<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Hub-Bub Prompt Review — Livable Telluride</title>
  <style>
    :root {
      --forest: #21443c; --forest-soft: #2a5347; --accent-green: #2f7a5f;
      --gold: #b58a2c; --rust: #a0531f; --bg-warm: #fdfbf6; --bg-hero: #efe9dc;
      --text-primary: #1a2e29; --text-secondary: #4a5e57; --text-muted: #7a8a85;
      --border-soft: rgba(33, 68, 60, 0.12); --shadow-card: 0 4px 18px rgba(36, 49, 46, 0.10);
      --font-heading: 'Georgia', 'Times New Roman', serif;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); line-height: 1.5; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 80px; }
    .topbar img { height: 54px; width: auto; }
    .eyebrow { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 18px 0 4px; }
    h1.page-title { font-family: var(--font-heading); font-size: 1.7rem; color: var(--forest); margin: 0 0 6px; }
    .sub { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 22px; }
    .card { background: #fff; border: 1px solid var(--border-soft); border-radius: 18px; box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 22px; }
    .card-body { padding: 22px 24px 24px; }
    .triage { background: var(--bg-hero); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
    .triage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .score-badge { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 11px; font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2f7a5f, #21443c); flex: 0 0 auto; }
    .triage-title { font-weight: 800; color: var(--forest); font-size: 0.96rem; }
    .triage-meta { font-size: 0.82rem; color: var(--text-muted); }
    .sides { margin: 8px 0 0; padding-left: 18px; }
    .sides li { font-size: 0.9rem; color: var(--text-secondary); margin: 4px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { font-size: 0.76rem; font-weight: 700; color: var(--forest-soft); background: #fff; border: 1px solid var(--border-soft); border-radius: 999px; padding: 4px 11px; }

    /* Feed-post preview — mirrors a Hub-Bub card */
    .post-frame { border: 1px solid var(--border-soft); border-radius: 14px; padding: 20px 22px; background: #fffefb; }
    .post-au { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#2f7a5f,#21443c); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 auto; }
    .post-auname { font-weight: 800; color: var(--forest); font-size: 0.95rem; }
    .post-aumeta { font-size: 0.8rem; color: var(--text-muted); }
    .post-title { font-family: var(--font-heading); font-size: 1.4rem; color: var(--forest); margin: 0 0 8px; line-height: 1.2; }
    .post-body { font-size: 1.02rem; line-height: 1.62; color: var(--text-primary); }
    .post-body p { margin: 0 0 12px; }
    .wc { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; }
    .wc.warn { color: var(--rust); font-weight: 700; }
    .flags { margin-top: 16px; background: #fdf1e6; border: 1px solid rgba(160,83,31,0.22); border-radius: 12px; padding: 14px 16px; }
    .flags h3 { color: var(--rust); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 8px; }
    .flags ul { margin: 0; padding-left: 18px; } .flags li { font-size: 0.87rem; color: #7a3e16; margin: 4px 0; }
    .cites { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
    .cites h3 { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
    .cites ul { margin: 0; padding-left: 18px; } .cites li { font-size: 0.84rem; color: var(--text-secondary); margin: 4px 0; } .cites a { color: var(--accent-green); }

    .edit-label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 4px; }
    .edit-input, .edit-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 9px; font-size: 0.98rem; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); }
    .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(47,122,95,0.12); }
    .edit-title { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--forest); }
    .edit-textarea { line-height: 1.6; resize: vertical; min-height: 180px; }
    .edit-hint { font-size: 0.78rem; color: var(--text-muted); margin: 10px 0 0; }
    .actions { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 13px 14px; border-radius: 11px; font-weight: 800; font-size: 0.96rem; border: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
    .btn-approve { background: linear-gradient(135deg, #2f7a5f, #21443c); color: #fff; }
    .btn-edit { background: var(--bg-hero); color: var(--forest); border: 1.5px solid var(--border-soft); }
    .btn-deny { background: #fff; color: #a33; border: 1.5px solid rgba(170,51,51,0.4); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .deny-box { margin-top: 14px; display: none; } .deny-box.show { display: block; }
    .panel { background: #fff; border: 1px solid var(--border-soft); border-radius: 16px; padding: 32px 26px; color: var(--text-secondary); }
    .panel h3 { font-family: var(--font-heading); color: var(--forest); margin: 0 0 10px; }
    .result-note { margin-top: 18px; padding: 14px 16px; border-radius: 12px; font-weight: 700; }
    .result-ok { background: #e7f1ec; color: var(--forest); } .result-deny { background: #fbeaea; color: #a33; } .result-edit { background: var(--bg-hero); color: var(--forest-soft); }
    .demo-banner { background: #fff7e6; border: 1px solid rgba(181,138,44,0.35); color: #7a5e10; font-size: 0.84rem; font-weight: 600; border-radius: 10px; padding: 9px 13px; margin-bottom: 16px; }
    @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><img src="https://livabletelluride.org/logo/Livable%20Telluride%20Logo.png" alt="Livable Telluride" onerror="this.style.display='none'"></div>
    <div class="eyebrow">Hub-Bub · Prompt review</div>
    <h1 class="page-title">Review a discussion prompt</h1>
    <p class="sub">The surfacing agent turned a local item into a short prompt for the Hub-Bub feed. Nothing posts until you approve it. Edit it here first if you like.</p>
    <div id="root"><div class="panel">Loading…</div></div>
  </div>

  <script>
  (function () {
    'use strict';
    // Token-gated Worker endpoints (service-account backed):
    //   GET  /pulse-draft?id=&t=   → { ok, draft }
    //   POST /pulse-decide  { id, t, action, editedTitle?, editedBody?, denyReason? }
    const WORKER = 'https://livabletelluride-rss-proxy.morgan-8f0.workers.dev';
    const root = document.getElementById('root');
    const params = new URLSearchParams(location.search);
    const ID = params.get('id');
    const TOKEN = params.get('t') || '';
    const DEMO = params.get('demo') === '1' || (!ID && !TOKEN);

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
    const bodyToP = t => String(t || '').split(/\n\n+/).map(p => '<p>' + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
    const wc = t => String(t || '').trim().split(/\s+/).filter(Boolean).length;

    const DEMO_DRAFT = {
      id: 'demo',
      title: 'You can finally see how big the Carhenge building would be',
      body: "For twelve days — July 6 through 17 — the Carhenge lot's closed while the Town stands up story poles: bare frames that trace the height and mass of the building it wants to put there, so people can judge the scale in person instead of squinting at a rendering. The Town's clear that nothing's decided yet — this is part of the HARC review.\n\nWhich is exactly why it's worth a look. Poles like these are the one honest moment to stand on the lot and ask whether a building that size belongs on that corner, or whether it's too much.\n\nGo see for yourself. What do you think?",
      topics: ['Carhenge redevelopment', 'building massing / density', 'HARC review'],
      sourceUrl: '',
      citations: [{ text: 'Town of Telluride notice — "Carhenge Lot Closed July 6-17 for Story Pole Installation," July 6, 2026', url: '' }],
      flaggedClaims: [],
      triage: { score: 4, angle: "The proposed Carhenge building's height and mass get staked out on the lot — the public's first in-person look at its scale.", controversy: { level: 4, sides: ['A rare chance to judge the real scale on site and shape the design before it\'s locked in.', 'A big new building — and a two-week closure of a core downtown lot — in a town tight on parking and wary of density.'] }, topics: ['Carhenge redevelopment', 'building massing / density', 'HARC review'] }
    };

    let draft = null, editing = false;

    function triageHtml(t) {
      if (!t) return '';
      let h = '<div class="triage"><div class="triage-head"><div class="score-badge">' + esc(t.score) + '</div>';
      h += '<div><div class="triage-title">Newsworthiness ' + esc(t.score) + '/5 — surfaced for review</div>';
      h += '<div class="triage-meta">' + esc(t.angle || 'Why this was surfaced') + '</div></div></div>';
      const sides = (t.controversy && t.controversy.sides) || [];
      if (sides.length) h += '<ul class="sides">' + sides.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
      if (Array.isArray(t.topics) && t.topics.length) h += '<div class="chips">' + t.topics.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>';
      h += '</div>';
      return h;
    }

    function postHtml(d) {
      const n = wc(d.editedBody != null ? d.editedBody : d.body);
      let h = '<div class="post-frame">';
      h += '<div class="post-au"><div class="post-avatar">L</div><div><div class="post-auname">Livable Telluride</div><div class="post-aumeta">Community prompt · just now</div></div></div>';
      h += '<h2 class="post-title">' + esc(d.editedTitle != null ? d.editedTitle : d.title) + '</h2>';
      h += '<div class="post-body">' + bodyToP(d.editedBody != null ? d.editedBody : d.body) + '</div>';
      h += '<div class="wc' + (n < 70 || n > 120 ? ' warn' : '') + '">' + n + ' words' + (n < 70 || n > 120 ? ' — target ~80–110' : '') + '</div>';
      if (Array.isArray(d.flaggedClaims) && d.flaggedClaims.length) h += '<div class="flags"><h3>⚠ Flagged — not fully sourced</h3><ul>' + d.flaggedClaims.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>';
      if (Array.isArray(d.citations) && d.citations.length) {
        h += '<div class="cites"><h3>Sourcing</h3><ul>';
        d.citations.forEach(c => { const u = safeUrl(c.url); h += '<li>' + esc(c.text) + (u ? ' — <a href="' + esc(u) + '" target="_blank" rel="noopener">source</a>' : '') + '</li>'; });
        h += '</ul></div>';
      }
      h += '</div>';
      return h;
    }

    function editHtml(d) {
      let h = '<div class="post-frame">';
      h += '<label class="edit-label">Title</label><input class="edit-input edit-title" id="ed-title" value="' + esc(d.editedTitle != null ? d.editedTitle : d.title) + '">';
      h += '<label class="edit-label">Post body (plain text — blank line between paragraphs)</label>';
      h += '<textarea class="edit-textarea" id="ed-body">' + esc(d.editedBody != null ? d.editedBody : d.body) + '</textarea>';
      h += '<p class="edit-hint">Keep it ~80–110 words, present both sides, end on an open question. Then <strong>Save edits</strong> (stays pending) or <strong>Approve</strong> to post your edited version.</p>';
      h += '</div>';
      return h;
    }

    function actionsHtml() {
      return '<div class="actions">'
        + '<button class="btn btn-approve" id="act-approve">✓ Approve &amp; post</button>'
        + '<button class="btn btn-edit" id="act-edit">' + (editing ? '💾 Save edits' : '✎ Edit') + '</button>'
        + '<button class="btn btn-deny" id="act-deny">✕ Deny</button></div>'
        + '<div class="deny-box" id="deny-box"><label class="edit-label">Reason for denying (optional)</label>'
        + '<input class="edit-input" id="deny-reason" placeholder="e.g. too thin / already covered">'
        + '<div class="actions" style="grid-template-columns:1fr;margin-top:10px;"><button class="btn btn-deny" id="deny-confirm">Confirm deny</button></div></div>';
    }

    function render() {
      let h = '<div class="card"><div class="card-body">';
      if (DEMO) h += '<div class="demo-banner">Demo preview (the golden example). Approve/Edit/Deny are simulated locally — no data is written.</div>';
      h += triageHtml(draft.triage);
      h += editing ? editHtml(draft) : postHtml(draft);
      h += actionsHtml();
      h += '</div></div>';
      root.innerHTML = h;
      wire();
    }

    function captureEdits() {
      const t = document.getElementById('ed-title'), b = document.getElementById('ed-body');
      if (t) draft.editedTitle = t.value.trim();
      if (b) draft.editedBody = b.value.trim();
    }
    function showResult(kind, text) {
      const cls = kind === 'deny' ? 'result-deny' : kind === 'edit' ? 'result-edit' : 'result-ok';
      const note = document.createElement('div'); note.className = 'result-note ' + cls; note.textContent = text;
      root.querySelector('.card-body').appendChild(note);
    }
    function disableAll() { root.querySelectorAll('button').forEach(b => b.disabled = true); }
    function postDecision(payload) {
      if (DEMO) return Promise.resolve({ ok: true, demo: true });
      return fetch(WORKER + '/pulse-decide', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: ID, t: TOKEN }, payload)) }).then(r => r.json());
    }

    function wire() {
      document.getElementById('act-edit').addEventListener('click', () => {
        if (editing) {
          captureEdits(); editing = false;
          postDecision({ action: 'edit', editedTitle: draft.editedTitle, editedBody: draft.editedBody })
            .then(res => { render(); showResult(res && res.ok ? 'edit' : 'deny', res && res.ok ? '💾 Edits saved — still pending your approval.' : 'Could not save: ' + ((res && res.msg) || 'error')); })
            .catch(e => { render(); showResult('deny', 'Could not save: ' + (e.message || e)); });
        } else { editing = true; render(); }
      });
      document.getElementById('act-approve').addEventListener('click', () => {
        if (editing) captureEdits();
        disableAll();
        const payload = { action: 'approve' };
        if (draft.editedTitle != null) payload.editedTitle = draft.editedTitle;
        if (draft.editedBody != null) payload.editedBody = draft.editedBody;
        postDecision(payload)
          .then(res => { if (res && res.ok) showResult('ok', '✓ Approved — posted to the Hub-Bub feed.'); else { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not approve: ' + ((res && res.msg) || 'error')); } })
          .catch(e => { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not approve: ' + (e.message || e)); });
      });
      document.getElementById('act-deny').addEventListener('click', () => document.getElementById('deny-box').classList.toggle('show'));
      document.getElementById('deny-confirm').addEventListener('click', () => {
        const reason = (document.getElementById('deny-reason').value || '').trim();
        disableAll();
        postDecision({ action: 'deny', denyReason: reason })
          .then(res => { if (res && res.ok) showResult('deny', '✕ Denied — it will not post.'); else { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not deny: ' + ((res && res.msg) || 'error')); } })
          .catch(e => { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not deny: ' + (e.message || e)); });
      });
    }

    if (DEMO) { draft = JSON.parse(JSON.stringify(DEMO_DRAFT)); render(); }
    else {
      fetch(WORKER + '/pulse-draft?id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(TOKEN))
        .then(r => r.json())
        .then(res => {
          if (!res || !res.ok || !res.draft) { root.innerHTML = '<div class="panel"><h3>Can’t open this draft</h3><p>' + esc((res && res.msg) || 'The link may have expired or already been decided.') + '</p></div>'; return; }
          draft = res.draft; render();
        })
        .catch(e => { root.innerHTML = '<div class="panel"><h3>Couldn’t load</h3><p>' + esc(e.message || String(e)) + '</p></div>'; });
    }
  })();
  </script>
</body>
</html>
