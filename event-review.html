<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Event Review — Livable Telluride</title>
  <style>
    :root {
      --forest: #21443c; --forest-soft: #2a5347; --accent-green: #2f7a5f;
      --gold: #b58a2c; --bg-warm: #fdfbf6; --bg-hero: #efe9dc;
      --text-primary: #1a2e29; --text-secondary: #4a5e57; --text-muted: #7a8a85;
      --border-soft: rgba(33, 68, 60, 0.12); --shadow-card: 0 4px 18px rgba(36, 49, 46, 0.10);
      --font-heading: 'Georgia', 'Times New Roman', serif;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); line-height: 1.5; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 70px; }
    .topbar img { height: 54px; width: auto; }
    .eyebrow { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 18px 0 4px; }
    h1.page-title { font-family: var(--font-heading); font-size: 1.8rem; color: var(--forest); margin: 0 0 6px; }
    .sub { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 22px; }

    .card { background: #fff; border: 1px solid var(--border-soft); border-radius: 18px; box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 22px; }
    .card-flyer { width: 100%; max-height: 380px; object-fit: contain; background: #f3efe6; display: block; border-bottom: 1px solid var(--border-soft); }
    .card-body { padding: 22px 24px 22px; }
    .card-body h2 { font-family: var(--font-heading); font-size: 1.5rem; color: var(--forest); margin: 0 0 12px; line-height: 1.15; }
    .meta-row { display: flex; align-items: center; gap: 9px; color: var(--text-secondary); font-size: 0.96rem; margin: 6px 0; }
    .meta-row svg { width: 18px; height: 18px; stroke: var(--accent-green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .desc { white-space: pre-wrap; color: var(--text-primary); font-size: 0.98rem; line-height: 1.6; margin: 14px 0 0; }
    .extras { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); font-size: 0.86rem; color: var(--text-muted); }
    .extras a { color: var(--accent-green); font-weight: 600; }
    .extras div { margin: 3px 0; }
    /* Editable review fields — admin can fix anything before approving */
    .edit-label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 12px 0 4px; }
    .edit-input, .edit-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 9px; font-size: 0.96rem; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); box-sizing: border-box; }
    .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(47,122,95,0.12); }
    .edit-title { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--forest); }
    .edit-textarea { line-height: 1.55; resize: vertical; min-height: 96px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .edit-hint { font-size: 0.78rem; color: var(--text-muted); margin: 14px 0 0; }
    .flyer-thumb { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid var(--border-soft); display: block; margin: 0 0 10px; object-fit: contain; background: #f3efe6; }
    .flyer-file { font-size: 0.86rem; color: var(--text-secondary); }
    .flyer-msg { font-size: 0.82rem; margin-top: 6px; min-height: 1em; }
    .gen-summary-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .gen-summary-btn { background: var(--bg-hero); color: var(--forest); border: 1px solid var(--border-soft); border-radius: 9px; padding: 8px 14px; font-size: 0.86rem; font-weight: 700; cursor: pointer; }
    .gen-summary-btn:hover { background: #e6dfce; }
    .gen-summary-btn:disabled { opacity: 0.55; cursor: default; }
    .gen-summary-msg { font-size: 0.82rem; color: var(--text-secondary); }
    @media (max-width: 520px) { .edit-grid { grid-template-columns: 1fr; } }
    .actions { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 11px; font-weight: 800; font-size: 0.98rem; border: none; cursor: pointer; }
    .btn-approve { background: linear-gradient(135deg, #2f7a5f, #21443c); color: #fff; }
    .btn-deny { background: #fff; color: #a33; border: 1.5px solid rgba(170,51,51,0.4); }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .empty, .panel { background: #fff; border: 1px solid var(--border-soft); border-radius: 16px; padding: 32px 26px; color: var(--text-secondary); }
    .panel h3 { font-family: var(--font-heading); color: var(--forest); margin: 0 0 10px; }
    .panel input { width: 100%; padding: 11px 13px; border: 1px solid var(--border-soft); border-radius: 9px; font-size: 0.95rem; margin-bottom: 12px; background: var(--bg-hero); box-sizing: border-box; }
    .panel button { background: var(--forest); color: #fff; border: none; border-radius: 10px; padding: 11px 20px; font-weight: 700; cursor: pointer; }
    .msg { font-size: 0.88rem; margin-top: 10px; min-height: 1.1em; }
    .signout { float: right; font-size: 0.82rem; color: var(--accent-green); background: none; border: none; cursor: pointer; text-decoration: underline; }
    @media (max-width: 520px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <img src="https://livabletelluride.org/logo/Livable%20Telluride%20Logo.png" alt="Livable Telluride" onerror="this.style.display='none'">
    </div>
    <div class="eyebrow">Admin</div>
    <h1 class="page-title">Event submissions</h1>
    <p class="sub">Review community event submissions. Approve to publish them to the calendar, or deny.</p>
    <div id="root"><div class="panel">Loading…</div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script>
  (function () {
    const ADMIN_EMAIL = 'info@livabletelluride.org';
    const FB_CONFIG = {
      apiKey: "AIzaSyCyAjB0RA_LtoETyRqxVJor0lRB4NRyXF0",
      authDomain: "telluride-gov-hub.firebaseapp.com",
      projectId: "telluride-gov-hub",
      storageBucket: "telluride-gov-hub.firebasestorage.app",
      messagingSenderId: "14117089764",
      appId: "1:14117089764:web:4287985258f0bc929cd7f1"
    };
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    const root = document.getElementById('root');

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
    const icon = {
      cal:  '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      pin:  '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
    };

    function fmtDate(date) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(date || '')) {
        const d = new Date(date + 'T12:00:00');
        if (!isNaN(d)) return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      }
      return date || '';
    }

    function cardHtml(id, d) {
      const img = safeUrl(d.imageUrl);
      const url = safeUrl(d.url);
      let h = '<div class="card" data-id="' + esc(id) + '" data-sub-email="' + esc(d.email || '') + '" data-sub-name="' + esc(d.name || '') + '">';
      h += '<div class="card-body">';
      // Every field is editable so you can fix anything (esp. the summary)
      // before publishing. Approve saves these values; Deny ignores them.
      h += '<label class="edit-label">Title</label>'
         + '<input class="edit-input edit-title" data-field="title" value="' + esc(d.title || '') + '">';
      h += '<div class="edit-grid">'
         + '<div><label class="edit-label">Date</label>'
         + '<input class="edit-input" data-field="date" value="' + esc(d.date || '') + '" placeholder="e.g. 2026-06-21 or June 21, 2026"></div>'
         + '<div><label class="edit-label">Time</label>'
         + '<input class="edit-input" data-field="time" value="' + esc(d.time || '') + '" placeholder="e.g. 6:00 PM"></div>'
         + '</div>';
      h += '<label class="edit-label">Location</label>'
         + '<input class="edit-input" data-field="location" value="' + esc(d.location || '') + '">';
      h += '<label class="edit-label">Description / summary</label>'
         + '<textarea class="edit-textarea" data-field="description" rows="6">' + esc(d.description || '') + '</textarea>'
         + '<div class="gen-summary-row">'
         + '<button type="button" class="gen-summary-btn">✨ Generate summary from flyer</button>'
         + '<span class="gen-summary-msg"></span>'
         + '</div>';
      h += '<label class="edit-label">Link (optional)</label>'
         + '<input class="edit-input" data-field="url" value="' + esc(d.url || '') + '" placeholder="https://…">';
      // Flyer image — shows the current flyer (if any) and lets you upload or
      // replace one (e.g. when an event was forwarded as an image). The hidden
      // imageUrl field is what gets saved on Approve.
      h += '<label class="edit-label">Flyer image</label>'
         + '<div class="flyer-edit">'
         + '<img class="flyer-thumb" data-thumb src="' + esc(img) + '"' + (img ? '' : ' style="display:none"') + ' onerror="this.style.display=\'none\'">'
         + '<input class="flyer-file" type="file" accept="image/*">'
         + '<input type="hidden" data-field="imageUrl" value="' + esc(d.imageUrl || '') + '">'
         + '<div class="flyer-msg"></div>'
         + '</div>';
      const ex = [];
      if (d.name || d.email) ex.push('<div>Submitted by: ' + esc(d.name || '') + (d.email ? ' &lt;' + esc(d.email) + '&gt;' : '') + '</div>');
      if (d.org) ex.push('<div>Organization: ' + esc(d.org) + '</div>');
      if (d.emailFrom) ex.push('<div>Forwarded from: ' + esc(d.emailFrom) + '</div>');
      if (ex.length) h += '<div class="extras">' + ex.join('') + '</div>';
      h += '<p class="edit-hint">Edit any field above, then Approve to publish your changes — or Deny.</p>';
      h += '<div class="actions">'
        + '<button class="btn btn-approve" data-act="approved" data-id="' + esc(id) + '">✓ Approve &amp; Publish</button>'
        + '<button class="btn btn-deny" data-act="denied" data-id="' + esc(id) + '">✕ Deny</button>'
        + '</div>';
      h += '</div></div>';
      return h;
    }

    const NOTIFY_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx0mroQH4gdRiOKI4xoCMjySCBF1vIqsPrvLJ-zIGa1RhoyhyD1pPiTG81DmAgQd5jj/exec';
    // On Approve, ping the info@ Apps Script to email the SUBMITTER a thank-you /
    // confirmation. Fire-and-forget; no-op when there's no submitter email.
    function notifyApproval(kind, email, name, title) {
      if (!email || !/\S+@\S+\.\S+/.test(email)) return;
      try {
        fetch(NOTIFY_WEBAPP_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'approval', kind: kind, email: email, name: name || '', title: title || '' })
        }).catch(function () {});
      } catch (e) {}
    }

    function decide(id, status, btn) {
      const card = btn.closest('.card');
      card.querySelectorAll('button').forEach(b => b.disabled = true);
      const update = {
        status: status,
        reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      // On approve, persist any edits the admin made to the fields.
      if (status === 'approved') {
        card.querySelectorAll('[data-field]').forEach(el => {
          update[el.getAttribute('data-field')] = (el.value || '').trim();
        });
      }
      db.collection('event_submissions').doc(id).update(update).then(() => {
        if (status === 'approved') notifyApproval('event', card.dataset.subEmail, card.dataset.subName, update.title);
        card.style.transition = 'opacity .3s'; card.style.opacity = '0.35';
        const note = document.createElement('div');
        note.style.cssText = 'padding:6px 24px 16px;font-weight:700;color:' + (status === 'approved' ? 'var(--forest)' : '#a33') + ';';
        note.textContent = status === 'approved' ? '✓ Approved — it will appear on the calendar.' : '✕ Denied.';
        card.appendChild(note);
        setTimeout(loadQueue, 1200);
      }).catch(err => {
        card.querySelectorAll('button').forEach(b => b.disabled = false);
        alert('Could not update: ' + (err.message || err));
      });
    }

    // Upload a flyer image (admin) to Firebase Storage and stash its URL in the
    // card's hidden imageUrl field, so Approve publishes it. Same storage path
    // + rules the website form uses (event-submissions/<uid>/…).
    function handleFlyerUpload(inp) {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const card = inp.closest('.card');
      const msg = card.querySelector('.flyer-msg');
      const thumb = card.querySelector('[data-thumb]');
      const hidden = card.querySelector('[data-field="imageUrl"]');
      if (!/^image\//.test(file.type)) { msg.style.color = '#a33'; msg.textContent = 'Please choose an image file.'; return; }
      if (file.size > 10 * 1024 * 1024) { msg.style.color = '#a33'; msg.textContent = 'Image too large (max 10 MB).'; return; }
      msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Uploading…';
      inp.disabled = true;
      const uid = auth.currentUser.uid;
      const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = 'event-submissions/' + uid + '/' + Date.now() + '_' + safe;
      storage.ref(path).put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
        hidden.value = url;
        thumb.src = url; thumb.style.display = 'block';
        msg.style.color = 'var(--forest)'; msg.textContent = '✓ Flyer attached — Approve to save it.';
        inp.disabled = false;
      }).catch(err => {
        msg.style.color = '#a33'; msg.textContent = 'Upload failed: ' + (err.message || err);
        inp.disabled = false;
      });
    }

    // Have Claude read the flyer image and write a summary into the Description
    // box. Calls the Cloudflare Worker (key stays server-side). Needs a flyer
    // image uploaded/attached first.
    const SUMMARIZE_URL = 'https://livabletelluride-rss-proxy.morgan-8f0.workers.dev/summarize-flyer';
    function generateSummary(btn) {
      const card = btn.closest('.card');
      const imgUrl = (card.querySelector('[data-field="imageUrl"]').value || '').trim();
      const ta = card.querySelector('[data-field="description"]');
      const msg = card.querySelector('.gen-summary-msg');
      if (!imgUrl) { msg.style.color = '#a33'; msg.textContent = 'Add a flyer image first, then generate.'; return; }
      msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Reading the flyer…';
      btn.disabled = true;
      fetch(SUMMARIZE_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageUrl: imgUrl })
      }).then(r => r.json()).then(d => {
        btn.disabled = false;
        if (d && d.ok && d.summary) {
          ta.value = d.summary;
          msg.style.color = 'var(--forest)'; msg.textContent = '✓ Generated — review/edit, then Approve.';
        } else {
          msg.style.color = '#a33'; msg.textContent = (d && d.msg) || 'Could not generate a summary.';
        }
      }).catch(err => {
        btn.disabled = false;
        msg.style.color = '#a33'; msg.textContent = 'Error: ' + (err.message || err);
      });
    }

    function loadQueue() {
      root.innerHTML = '<div class="panel">Loading submissions…</div>';
      db.collection('event_submissions').where('status', '==', 'pending').get()
        .then(snap => {
          const docs = [];
          snap.forEach(doc => docs.push({ id: doc.id, d: doc.data() || {} }));
          docs.sort((a, b) => {
            const ta = a.d.createdAt && a.d.createdAt.seconds || 0;
            const tb = b.d.createdAt && b.d.createdAt.seconds || 0;
            return tb - ta;
          });
          let html = '<button class="signout" id="signout">Sign out</button>'
            + '<div style="clear:both"></div>';
          if (!docs.length) {
            html += '<div class="empty">🎉 No pending submissions right now.</div>';
          } else {
            html += '<p class="sub">' + docs.length + ' submission' + (docs.length === 1 ? '' : 's') + ' awaiting review:</p>';
            html += docs.map(x => cardHtml(x.id, x.d)).join('');
          }
          root.innerHTML = html;
          document.getElementById('signout').addEventListener('click', () => auth.signOut());
          root.querySelectorAll('button[data-act]').forEach(b => {
            b.addEventListener('click', () => decide(b.getAttribute('data-id'), b.getAttribute('data-act'), b));
          });
          root.querySelectorAll('.flyer-file').forEach(inp => {
            inp.addEventListener('change', () => handleFlyerUpload(inp));
          });
          root.querySelectorAll('.gen-summary-btn').forEach(btn => {
            btn.addEventListener('click', () => generateSummary(btn));
          });
        })
        .catch(err => {
          root.innerHTML = '<div class="panel">Could not load submissions: ' + esc(err.message || String(err)) + '</div>';
        });
    }

    function loginPanel(msg) {
      root.innerHTML =
        '<div class="panel"><h3>Admin sign-in</h3>'
        + '<p>Sign in as <strong>' + esc(ADMIN_EMAIL) + '</strong> to review event submissions.</p>'
        + '<input id="li-email" type="email" placeholder="Email" autocomplete="username" value="' + esc(ADMIN_EMAIL) + '">'
        + '<input id="li-pass" type="password" placeholder="Password" autocomplete="current-password">'
        + '<button id="li-go">Sign in</button>'
        + '<div class="msg" id="li-msg" style="color:#a33;">' + esc(msg || '') + '</div></div>';
      const go = document.getElementById('li-go');
      const doLogin = () => {
        const em = document.getElementById('li-email').value.trim();
        const pw = document.getElementById('li-pass').value;
        document.getElementById('li-msg').textContent = '';
        go.disabled = true; go.textContent = 'Signing in…';
        auth.signInWithEmailAndPassword(em, pw).catch(err => {
          go.disabled = false; go.textContent = 'Sign in';
          document.getElementById('li-msg').textContent = (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') ? 'Incorrect email or password.' : (err.message || String(err));
        });
      };
      go.addEventListener('click', doLogin);
      document.getElementById('li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }

    auth.onAuthStateChanged(user => {
      if (user && user.email === ADMIN_EMAIL) loadQueue();
      else if (user) loginPanel('That account isn’t an admin. Sign out and use ' + ADMIN_EMAIL + '.');
      else loginPanel('');
    });
  })();
  </script>
</body>
</html>
