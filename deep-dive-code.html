<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Changes &amp; Accelerated Review — Livable Telluride Deep Dive</title>
  <script>const TOPIC_KEY = 'code';</script>
  <style>
    :root {
      --forest: #21443c; --forest-soft: #2a5347; --accent-green: #2f7a5f;
      --bg-warm: #fdfbf6; --bg-hero: #efe9dc; --bg-paper: #fffdf9;
      --text-primary: #1a2e29; --text-secondary: #4a5e57; --text-muted: #7a8a85;
      --border-soft: rgba(33,68,60,0.12); --shadow-card: 0 4px 18px rgba(36,49,46,0.10);
      --font-heading: 'Georgia','Times New Roman',serif;
      --font-main: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;font-family:var(--font-main);color:var(--text-primary);background:var(--bg-warm);line-height:1.5;}

    /* Nav */
    .topnav{background:#fff;border-bottom:1px solid var(--border-soft);padding:14px 0;position:sticky;top:0;z-index:50;}
    .topnav-inner{max-width:1280px;margin:0 auto;padding:0 32px;display:flex;align-items:center;gap:20px;}
    .topnav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .topnav-logo img{height:80px;width:auto;object-fit:contain;}
    .topnav-links{display:flex;gap:14px;margin-left:20px;flex:1;flex-wrap:wrap;}
    .topnav-links a{
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;color:var(--text-primary);text-decoration:none;font-weight:600;font-size: 0.76rem; white-space: nowrap;padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
    .topnav-links a:hover{color:var(--forest);}
    .topnav-links a.active{color:var(--forest);border-bottom-color:var(--forest);}
    .topnav-cta{display:inline-block;background:var(--forest);color:#fff;text-decoration:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:0.9rem;white-space:nowrap;}

    /* Hero */
    .hero{position:relative;width:100%;min-height:320px;overflow:hidden;display:flex;align-items:flex-end;}
    .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,25,20,0.82) 0%,rgba(10,25,20,0.35) 55%,transparent 100%);z-index:2;}
    .hero-text{position:relative;z-index:3;padding:40px 48px 40px;max-width:1280px;margin:0 auto;width:100%;}
    .hero-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
    .hero-breadcrumb a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:0.88rem;font-weight:600;}
    .hero-breadcrumb a:hover{color:#fff;}
    .hero-breadcrumb .sep{color:rgba(255,255,255,0.45);font-size:0.88rem;}
    .hero-badge{display:inline-block;background:rgba(47,122,95,0.85);color:#fff;font-size:0.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:999px;margin-bottom:12px;}
    .hero-title{margin:0;font-family:var(--font-heading);font-size:2.4rem;color:#fff;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.4);}
    .hero-status{margin:12px 0 0;font-size:1rem;color:rgba(255,255,255,.85);max-width:640px;}

    /* Page layout */
    .page-wrap{max-width:1280px;margin:0 auto;padding:40px 48px 64px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start;}

    /* Sections */
    .section{margin-bottom:36px;}
    .section-label{font-size:0.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-green);margin:0 0 14px;}
    .intro-text{font-size:1.05rem;line-height:1.7;color:var(--text-secondary);margin:0;}

    /* Status card */
    .status-card{background:#fff;border:1px solid var(--border-soft);border-radius:16px;padding:24px;box-shadow:var(--shadow-card);margin-bottom:28px;}
    .status-title{font-family:var(--font-heading);font-size:1.2rem;color:var(--text-primary);margin:0 0 10px;line-height:1.35;}
    .status-copy{font-size:0.92rem;line-height:1.65;color:var(--text-secondary);margin:0 0 16px;}
    .nextstep{background:rgba(47,122,95,.08);border-left:3px solid var(--accent-green);padding:12px 16px;border-radius:0 8px 8px 0;font-size:0.88rem;color:var(--text-secondary);margin:0;}
    .nextstep strong{color:var(--forest);}

    /* Timeline */
    .timeline{display:flex;flex-direction:column;gap:0;}
    .tl-item{display:grid;grid-template-columns:120px 1fr;gap:0 20px;position:relative;}
    .tl-item::before{content:'';position:absolute;left:119px;top:8px;bottom:-8px;width:1px;background:var(--border-soft);}
    .tl-item:last-child::before{display:none;}
    .tl-date{font-size:0.78rem;font-weight:700;color:var(--text-muted);padding:4px 0 24px;text-align:right;}
    .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-green);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent-green);margin-top:6px;flex-shrink:0;}
    .tl-body{padding:0 0 24px 20px;}
    .tl-body h4{margin:0 0 4px;font-size:0.92rem;font-weight:700;color:var(--text-primary);line-height:1.35;}
    .tl-body p{margin:0;font-size:0.86rem;line-height:1.6;color:var(--text-secondary);}
    .tl-item.future .tl-date,.tl-item.future .tl-body h4{color:var(--accent-green);}
    .tl-item.future .tl-dot{background:#fff;border-color:var(--accent-green);}

    /* Sidebar */
    .sidebar{display:flex;flex-direction:column;gap:22px;position:sticky;top:90px;}
    .scard{background:#fff;border:1px solid var(--border-soft);border-radius:16px;padding:22px;box-shadow:var(--shadow-card);}
    .scard-title{font-size:0.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 16px;}
    .metric{padding:10px 0;border-bottom:1px solid var(--border-soft);}
    .metric:last-child{border-bottom:none;padding-bottom:0;}
    .metric-label{font-size:0.78rem;color:var(--text-muted);margin-bottom:2px;}
    .metric-value{font-size:0.95rem;font-weight:700;color:var(--text-primary);line-height:1.3;}
    .metric-sub{font-size:0.78rem;color:var(--text-secondary);margin-top:2px;line-height:1.4;}
    .doc-item{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
    .doc-item:last-child{border-bottom:none;padding-bottom:0;}
    .doc-tag{font-size:0.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-green);}
    .doc-item a{font-size:0.86rem;color:var(--text-primary);text-decoration:none;font-weight:600;line-height:1.35;}
    .doc-item a:hover{color:var(--forest);}
    .doc-item p{margin:0;font-size:0.78rem;color:var(--text-secondary);}
    .player-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
    .player-item:last-child{border-bottom:none;padding-bottom:0;}
    .player-icon{font-size:1.2rem;flex-shrink:0;width:28px;text-align:center;}
    .player-body h4{margin:0 0 3px;font-size:0.88rem;font-weight:700;color:var(--text-primary);}
    .player-body p{margin:0;font-size:0.78rem;color:var(--text-secondary);line-height:1.4;}

    /* Legal summary */
    .legal-card{background:rgba(33,68,60,.04);border:1px solid rgba(33,68,60,.15);border-radius:16px;padding:24px;}
    .legal-label{font-size:0.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--forest);margin:0 0 12px;}
    .legal-card p{margin:0;font-size:0.88rem;line-height:1.65;color:var(--text-secondary);}

    /* News */
    .news-item{padding:14px 0;border-bottom:1px solid var(--border-soft);}
    .news-item:last-child{border-bottom:none;}
    .news-meta{font-size:0.78rem;color:var(--text-muted);margin-bottom:4px;}
    .news-item a{font-size:0.92rem;font-weight:600;color:var(--text-primary);text-decoration:none;line-height:1.35;display:block;margin-bottom:4px;}
    .news-item a:hover{color:var(--forest);}
    .news-item p{margin:0;font-size:0.82rem;color:var(--text-secondary);}

    /* Back link */
    .back-strip{background:var(--bg-hero);border-bottom:1px solid var(--border-soft);padding:12px 0;}
    .back-strip-inner{max-width:1280px;margin:0 auto;padding:0 48px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--forest);text-decoration:none;font-weight:600;font-size:0.88rem;}
    .back-link:hover{text-decoration:underline;}

    /* Controversy update block */
    .controversy-block{background:#fff;border:1px solid rgba(180,60,40,.2);border-left:4px solid #c0392b;border-radius:12px;padding:24px 26px;margin-bottom:28px;}
    .controversy-date{font-size:0.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#c0392b;margin:0 0 10px;}
    .controversy-heading{font-family:var(--font-heading);font-size:1.15rem;color:var(--text-primary);margin:0 0 18px;line-height:1.35;}
    .controversy-point{margin-bottom:16px;}
    .controversy-point:last-child{margin-bottom:0;}
    .controversy-point-label{font-size:0.82rem;font-weight:700;color:var(--forest);margin-bottom:4px;}
    .controversy-point p{margin:0;font-size:0.88rem;line-height:1.65;color:var(--text-secondary);}
    .controversy-footer{margin-top:20px;padding-top:16px;border-top:1px solid rgba(180,60,40,.15);}
    .btn-download-packet{display:inline-flex;align-items:center;gap:7px;background:#a8d5b0;color:#1a3d2b;text-decoration:none;font-weight:700;font-size:0.88rem;padding:10px 20px;border-radius:999px;border:1px solid #7dbb8a;transition:background .15s,box-shadow .15s;}
    .btn-download-packet:hover{background:#8fca9a;box-shadow:0 2px 8px rgba(33,68,60,.18);}
    .btn-download-packet svg{flex-shrink:0;}

    /* Legal issues list */
    .legal-issue-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-soft);}
    .legal-issue-item:last-child{border-bottom:none;padding-bottom:0;}
    .legal-issue-icon{font-size:1.3rem;flex-shrink:0;width:28px;text-align:center;padding-top:2px;}
    .legal-issue-body h4{margin:0 0 5px;font-size:0.9rem;font-weight:700;color:var(--text-primary);line-height:1.35;}
    .legal-issue-body p{margin:0;font-size:0.84rem;line-height:1.65;color:var(--text-secondary);}

    /* Empty state */
    .empty-note{font-size:0.86rem;color:var(--text-muted);font-style:italic;padding:8px 0;}

    @media(max-width:900px){
      .page-wrap{grid-template-columns:1fr;padding:24px 24px 48px;}
      .sidebar{position:static;}
      .hero-text{padding:32px 24px;}
      .hero-title{font-size:1.8rem;}
      .topnav-links{display:none;}
    }
  
    /* ── Translate widget + mobile nav (added 2026-05-18) ── */
    .topnav-translate { display: inline-flex; align-items: center; margin-right: 10px; }
    .topnav-translate .goog-te-gadget { font-size: 0 !important; line-height: 1; }
    .topnav-translate .goog-te-gadget-simple {
      background: transparent !important;
      border: 1px solid #d4dad0 !important;
      border-radius: 999px !important;
      padding: 7px 14px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      font-size: 0.82rem !important;
      cursor: pointer;
      line-height: 1.2 !important;
    }
    .topnav-translate .goog-te-gadget-simple .goog-te-menu-value { color: #2d4a3e !important; }
    .topnav-translate .goog-te-gadget-simple .goog-te-menu-value span { color: #2d4a3e !important; border: none !important; }
    .topnav-translate img.goog-te-gadget-icon { display: none !important; }
    .topnav-translate-reset {
      display: none; background: transparent; border: 1px solid #d4dad0;
      border-radius: 999px; padding: 7px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.78rem; cursor: pointer; color: #2d4a3e;
      margin-right: 10px; line-height: 1.2;
    }
    .topnav-translate-reset:hover { background: #f3f5ef; }
    body.translated-ltr .topnav-translate-reset,
    body.translated-rtl .topnav-translate-reset { display: inline-block; }
    body { top: 0 !important; }
    .goog-te-banner-frame, .skiptranslate iframe.goog-te-banner-frame { display: none !important; visibility: hidden !important; }
    .goog-tooltip, .goog-tooltip:hover { display: none !important; }
    .goog-text-highlight { background: none !important; box-shadow: none !important; }

    .topnav-hamburger {
      display: none; background: none; border: none; cursor: pointer;
      font-size: 1.5rem; line-height: 1; padding: 4px 8px; color: #2d4a3e;
    }
    .topnav-hamburger:focus { outline: 2px solid #2d4a3e; outline-offset: 2px; }

    @media (max-width: 860px) {
      .topnav-inner { position: relative; flex-wrap: nowrap; }
      .topnav-links {
        display: none !important;
        position: absolute; top: calc(100% + 1px); left: 0; right: 0;
        background: #fff; flex-direction: column !important; gap: 0 !important;
        padding: 8px 0; margin: 0 !important;
        border-top: 1px solid #d4dad0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        z-index: 60;
      }
      .topnav-links.open { display: flex !important; }
      .topnav-links a {
        padding: 14px 24px !important; border-bottom: 1px solid #f0f0ec !important;
        font-size: 1rem !important;
      }
      .topnav-links a:last-child { border-bottom: none !important; }
      .topnav-hamburger { display: block; }
      .topnav-translate { margin-right: 6px; }
      .topnav-translate .goog-te-gadget-simple { padding: 5px 10px !important; font-size: 0.75rem !important; }
      .topnav-cta { display: none !important; }
    }

  </style>
</head>

  </div>

  <div id="hero-section"></div>
  <div id="page-content"></div>

  <script>
    // Dynamic cache-buster (Math.floor(Date.now()/600000) → bumps every
    // 10 min) replaces the static `?v=dd1` that was never updated, leaving
    // browsers with whatever they cached on first visit. Without this, edits
    // to heroImage / LAND_USE_ISSUES in gov-data.js never reached users —
    // e.g. the May 25 Diamond Ridge heroImage update was invisible until
    // each user manually hard-refreshed.
    var v = Math.floor(Date.now() / 600000);
    var s = document.createElement('script');
    s.src = '/js/gov-data.js?v=' + v;
    // Once gov-data.js finishes loading, set a flag the bottom-of-page
    // bootstrap polls for. The earlier "retry on 50ms timer up to 2 sec"
    // wasn't reliable enough — some users were still seeing
    // "Data not available — please reload." Belt + suspenders: the
    // flag tells the bootstrap exactly when data is ready, and the
    // bootstrap also keeps a timer fallback in case onload misfires.
    s.onload = function() { window.__GOV_DATA_READY = true; };
    s.onerror = function() {
      console.error('gov-data.js failed to load:', s.src);
      window.__GOV_DATA_FAILED = true;
    };
    document.head.appendChild(s);
  </script>
  <script>
    // Merge gondola data if present
    if (typeof GONDOLA_DATA !== 'undefined' && typeof LAND_USE_ISSUES !== 'undefined') {
      LAND_USE_ISSUES.gondola = GONDOLA_DATA;
    }

    const FALLBACK_IMAGES = {
      wildfire: '/logo/Telluride Fire.png',
      diamond:  '/logo/Aldasoro.png',
      gondola:  '/images/blog/gondola-station.png',
    };

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderTopic(key, retries) {
      // gov-data.js loads via the async dynamic-cache-buster <script> above.
      // The loader sets window.__GOV_DATA_READY in its onload, and
      // __GOV_DATA_FAILED in its onerror. Wait for either — up to 6 sec —
      // before bailing.
      retries = retries || 0;
      var ready = (typeof LAND_USE_ISSUES !== 'undefined') || window.__GOV_DATA_READY;
      var failed = window.__GOV_DATA_FAILED;
      if (!ready && !failed) {
        if (retries < 120) return setTimeout(function() { renderTopic(key, retries + 1); }, 50);
        document.getElementById('page-content').innerHTML = '<p style="padding:40px">Data not available — please reload.</p>';
        return;
      }
      if (failed || typeof LAND_USE_ISSUES === 'undefined') {
        document.getElementById('page-content').innerHTML = '<p style="padding:40px">Couldn\'t load /js/gov-data.js. Check your network and reload.</p>';
        return;
      }
      // Merge any external topic blobs that loaded before us (e.g. GONDOLA_DATA
      // from the gondola page). Safe to run on every retry — idempotent.
      if (typeof GONDOLA_DATA !== 'undefined') LAND_USE_ISSUES.gondola = GONDOLA_DATA;
      const issue = LAND_USE_ISSUES[key];
      if (!issue) { document.getElementById('page-content').innerHTML = '<p style="padding:40px">Topic not found.</p>'; return; }

      const imgSrc = issue.heroImage || FALLBACK_IMAGES[key] || '/images/wilson-peak.png';

      // Hero
      document.getElementById('hero-section').innerHTML = `
        <section class="hero" style="min-height:340px;">
          <img class="hero-img" src="${esc(imgSrc)}" alt="${esc(issue.heroAlt||issue.label||'')}">
          <div class="hero-overlay"></div>
          <div class="hero-text">
            <div class="hero-breadcrumb">
              <a href="/deep-dives.html">Deep Dives</a>
              <span class="sep">›</span>
              <span style="color:rgba(255,255,255,.85);font-size:.88rem;">${esc(issue.label||key)}</span>
            </div>
            <h1 class="hero-title">${esc(issue.label||key)}</h1>
            ${issue.statusTitle ? `<p class="hero-status">${esc(issue.statusTitle)}</p>` : ''}
            ${issue.heroCredit ? `<p style="margin:8px 0 0;font-size:.72rem;color:rgba(255,255,255,.5);">${esc(issue.heroCredit)}</p>` : ''}
          </div>
        </section>`;

      document.title = (issue.label||key) + ' — Livable Telluride Deep Dive';

      // Main columns
      const mainHtml = buildMain(issue);
      const sideHtml = buildSidebar(issue);

      document.getElementById('page-content').innerHTML = `
        <div class="page-wrap">
          <div class="main-col">${mainHtml}</div>
          <aside class="sidebar">${sideHtml}</aside>
        </div>`;
    }

    function buildMain(issue) {
      let html = '';

      // Intro
      if (issue.intro) {
        html += `<div class="section"><p class="intro-text">${esc(issue.intro)}</p></div>`;
      }

      // Status + next step
      if (issue.statusTitle || issue.statusCopy || issue.nextStep) {
        html += `<div class="status-card">`;
        if (issue.statusTitle) html += `<h3 class="status-title">${esc(issue.statusTitle)}</h3>`;
        if (issue.statusCopy)  html += `<p class="status-copy">${esc(issue.statusCopy)}</p>`;
        if (issue.nextStep)    html += `<p class="nextstep"><strong>Watch for:</strong> ${esc(issue.nextStep)}</p>`;
        html += `</div>`;
      }

      // Controversy update (most recent development)
      if (issue.controversyUpdate) {
        const cu = issue.controversyUpdate;
        html += `<div class="controversy-block">
          <div class="controversy-date">Latest Development · ${esc(cu.date||'')}</div>
          <h3 class="controversy-heading">${esc(cu.heading||'')}</h3>`;
        if (cu.points && cu.points.length) {
          cu.points.forEach(pt => {
            html += `<div class="controversy-point">
              <div class="controversy-point-label">${esc(pt.label||'')}</div>
              <p>${esc(pt.text||'')}</p>
            </div>`;
          });
        }
        if (cu.packetHref) {
          html += `<div class="controversy-footer">
            <a class="btn-download-packet" href="${esc(cu.packetHref)}" ${cu.packetHref.startsWith('/') ? 'download' : 'target="_blank" rel="noopener"'}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download Packet
            </a>
          </div>`;
        }
        html += `</div>`;
      }

      // Legal summary
      if (issue.legalSummary) {
        html += `<div class="section legal-card">
          <div class="legal-label">Specific Concerns with the County's Draft</div>
          <p>${esc(issue.legalSummary)}</p>
        </div>`;
      }

      // Legal issues (detailed breakdown)
      if (issue.legalIssues && issue.legalIssues.length) {
        html += `<div class="section">
          <div class="section-label">${esc(issue.legalIssuesSub||'Draft Language Concerns')}</div>`;
        issue.legalIssues.forEach(li => {
          html += `<div class="legal-issue-item">
            <div class="legal-issue-icon">${li.icon||'⚠️'}</div>
            <div class="legal-issue-body">
              <h4>${esc(li.title||'')}</h4>
              ${li.copy ? `<p>${esc(li.copy)}</p>` : ''}
            </div>
          </div>`;
        });
        html += `</div>`;
      }

      // Timeline
      if (issue.timeline && issue.timeline.length) {
        html += `<div class="section">
          <div class="section-label">Timeline</div>
          <div class="timeline">`;
        issue.timeline.forEach(t => {
          html += `<div class="tl-item${t.future?' future':''}">
            <div class="tl-date">${esc(t.date||'')}</div>
            <div style="display:flex;gap:0;">
              <div class="tl-dot" style="margin-top:6px;flex-shrink:0;"></div>
              <div class="tl-body">
                <h4>${esc(t.title||'')}</h4>
                ${t.copy ? `<p>${esc(t.copy)}</p>` : ''}
              </div>
            </div>
          </div>`;
        });
        html += `</div></div>`;
      }

      // News
      if (issue.news && issue.news.length) {
        html += `<div class="section">
          <div class="section-label">Recent Coverage</div>`;
        issue.news.forEach(n => {
          html += `<div class="news-item">
            <div class="news-meta">${esc(n.source||'')}${n.date ? ' · '+esc(n.date) : ''}</div>
            <a href="${esc(n.href||'#')}" target="_blank" rel="noopener">${esc(n.title||'')}</a>
            ${n.copy ? `<p>${esc(n.copy)}</p>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      return html;
    }

    function buildSidebar(issue) {
      let html = '';

      // Metrics
      if (issue.snapshot && issue.snapshot.length) {
        html += `<div class="scard">
          <div class="scard-title">Key Facts</div>`;
        issue.snapshot.forEach(m => {
          html += `<div class="metric">
            <div class="metric-label">${esc(m.label||'')}</div>
            <div class="metric-value">${esc(m.value||'')}</div>
            ${m.sub ? `<div class="metric-sub">${esc(m.sub)}</div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      // Players
      if (issue.players && issue.players.length) {
        html += `<div class="scard">
          <div class="scard-title">Key Players</div>`;
        issue.players.forEach(p => {
          html += `<div class="player-item">
            <div class="player-icon">${p.icon||'👤'}</div>
            <div class="player-body">
              <h4>${esc(p.title||'')}</h4>
              ${p.copy ? `<p>${esc(p.copy)}</p>` : ''}
            </div>
          </div>`;
        });
        html += `</div>`;
      }

      // Documents
      if (issue.docs && issue.docs.length) {
        html += `<div class="scard">
          <div class="scard-title">Key Documents</div>`;
        issue.docs.forEach(d => {
          html += `<div class="doc-item">
            ${d.tag ? `<span class="doc-tag">${esc(d.tag)}</span>` : ''}
            <a href="${esc(d.href||'#')}" target="_blank" rel="noopener">${esc(d.title||'')}</a>
            ${d.copy ? `<p>${esc(d.copy)}</p>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      // Upcoming meetings
      if (issue.meetings && issue.meetings.length) {
        html += `<div class="scard">
          <div class="scard-title">Upcoming Meetings</div>`;
        issue.meetings.forEach(m => {
          html += `<div class="doc-item">
            <span class="doc-tag">${esc(m.date||'')}${m.time ? ' · '+esc(m.time) : ''}</span>
            <a href="${esc(m.href||'#')}" target="_blank" rel="noopener">${esc(m.title||'')}</a>
            ${m.location ? `<p>${esc(m.location)}</p>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      return html || '<div class="empty-note">Sidebar data loading…</div>';
    }

    renderTopic(TOPIC_KEY);
  </script>

<!-- Google Translate widget + mobile nav toggle (added 2026-05-18) -->
<script>
function lvResetTranslation() {
  var expires = '=; expires=Thu, 01 Jan 1970 00:00:00 GMT';
  var domains = ['', '.' + location.hostname, location.hostname];
  domains.forEach(function(d){
    var c = 'googtrans' + expires + '; path=/';
    if (d) c += '; domain=' + d;
    document.cookie = c;
  });
  location.reload();
}
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'es,fr,de,zh-CN,zh-TW,ja,ko,ar,ru,pt,it,vi,hi,nl,pl,tr,uk,sv,no,da,fi,el,he,th,id',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');
}
(function(){
  var s = document.createElement('script');
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  s.async = true;
  document.head.appendChild(s);
})();
(function(){
  function init(){
    var btn = document.getElementById('topnavHamburger');
    if (!btn) return;
    var links = document.querySelector('.topnav-links');
    if (!links) return;
    btn.addEventListener('click', function(){
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '✕' : '☰';
    });
    // close drawer when a link is clicked
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        btn.textContent = '☰';
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
