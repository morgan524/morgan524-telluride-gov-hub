name = "livabletelluride-donations"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "8f020e73de4e9956f0e3ad7dce070ef4"

# Non-secret defaults. Override any of these by `wrangler secret put NAME`.
[vars]
ORG_NAME = "Livable Telluride"
SENDER_EMAIL = "donations@livabletelluride.org"
SUPPORT_EMAIL = "info@livabletelluride.org"

# After `wrangler deploy` you'll get:
#   https://livabletelluride-donations.<your-subdomain>.workers.dev
# That URL goes into Stripe Dashboard → Developers → Webhooks as the
# endpoint for the "checkout.session.completed" event.
#
# Required secrets (`wrangler secret put NAME`):
#   STRIPE_WEBHOOK_SECRET   whsec_... from Stripe Dashboard → Webhooks → endpoint
#   RESEND_API_KEY          re_... from resend.com → API Keys
#   ORG_EIN                 your IRS Employer Identification Number, format "XX-XXXXXXX"
