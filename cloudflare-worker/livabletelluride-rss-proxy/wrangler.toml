name = "livabletelluride-rss-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "8f020e73de4e9956f0e3ad7dce070ef4"

# Per-day, per-endpoint token + cost counters for the three Anthropic calls this
# Worker makes (flyer summary, letter copyedit, Hub-Bub moderation). These are
# visitor-triggered, so they're the one AI surface that appears in no repo log —
# read them back at GET /ai-usage. Added 2026-08-07 to turn the "the Worker is
# probably the rest of the bill" guess into a measurement.
[[kv_namespaces]]
binding = "AI_USAGE"
id = "078ebbc4ff0941d683dcb705195840ef"

# After deploy, you'll get a URL like:
#   https://livabletelluride-rss-proxy.<your-subdomain>.workers.dev
#
# To require a shared secret on the proxy (recommended), run:
#   wrangler secret put PROXY_KEY
# Then make the GitHub Action send it via the X-Proxy-Key header.
