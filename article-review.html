<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Article Review — Livable Telluride</title>
  <style>
    :root {
      --forest: #21443c; --forest-soft: #2a5347; --accent-green: #2f7a5f;
      --gold: #b58a2c; --rust: #a0531f; --bg-warm: #fdfbf6; --bg-hero: #efe9dc;
      --text-primary: #1a2e29; --text-secondary: #4a5e57; --text-muted: #7a8a85;
      --border-soft: rgba(33, 68, 60, 0.12); --shadow-card: 0 4px 18px rgba(36, 49, 46, 0.10);
      --font-heading: 'Georgia', 'Times New Roman', serif;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); line-height: 1.5; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 80px; }
    .topbar img { height: 54px; width: auto; }
    .eyebrow { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 18px 0 4px; }
    h1.page-title { font-family: var(--font-heading); font-size: 1.8rem; color: var(--forest); margin: 0 0 6px; }
    .sub { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 22px; }

    .card { background: #fff; border: 1px solid var(--border-soft); border-radius: 18px; box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 22px; }
    .card-body { padding: 22px 24px 24px; }

    /* ── Triage rationale panel (why the agent drafted this) ── */
    .triage { background: var(--bg-hero); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
    .triage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .score-badge { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 11px; font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2f7a5f, #21443c); flex: 0 0 auto; }
    .triage-title { font-weight: 800; color: var(--forest); font-size: 0.96rem; }
    .triage-meta { font-size: 0.82rem; color: var(--text-muted); }
    .triage ul { margin: 8px 0 0; padding-left: 18px; }
    .triage li { font-size: 0.9rem; color: var(--text-secondary); margin: 4px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { font-size: 0.76rem; font-weight: 700; color: var(--forest-soft); background: #fff; border: 1px solid var(--border-soft); border-radius: 999px; padding: 4px 11px; }
    .followup { margin-top: 10px; font-size: 0.84rem; color: var(--rust); font-weight: 600; }

    /* ── Rendered article ── */
    .article-frame { border: 1px solid var(--border-soft); border-radius: 14px; padding: 22px 24px; background: #fffefb; }
    .article-frame .dek { color: var(--text-secondary); font-size: 1.02rem; font-style: italic; margin: 0 0 14px; line-height: 1.45; }
    .article-frame h2.headline { font-family: var(--font-heading); font-size: 1.62rem; color: var(--forest); margin: 0 0 8px; line-height: 1.18; }
    .meta-row { display: flex; align-items: center; gap: 9px; color: var(--text-secondary); font-size: 0.92rem; margin: 4px 0 14px; }
    .meta-row svg { width: 17px; height: 17px; stroke: var(--accent-green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .article-body { font-size: 1.0rem; line-height: 1.68; color: var(--text-primary); }
    .article-body p { margin: 0 0 14px; }
    .article-body sup.cite { color: var(--accent-green); font-weight: 700; cursor: help; font-size: 0.72em; }
    .article-body .flag { background: #fdf1e6; border-bottom: 2px dotted var(--rust); padding: 0 2px; }

    .citations { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
    .citations h3, .flags h3 { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
    .citations ol { margin: 0; padding-left: 20px; }
    .citations li { font-size: 0.84rem; color: var(--text-secondary); margin: 4px 0; }
    .citations a { color: var(--accent-green); font-weight: 600; }

    .flags { margin-top: 16px; background: #fdf1e6; border: 1px solid rgba(160,83,31,0.22); border-radius: 12px; padding: 14px 16px; }
    .flags h3 { color: var(--rust); }
    .flags ul { margin: 0; padding-left: 18px; }
    .flags li { font-size: 0.87rem; color: #7a3e16; margin: 4px 0; }

    /* ── Edit mode ── */
    .edit-label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 4px; }
    .edit-input, .edit-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 9px; font-size: 0.96rem; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); }
    .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(47,122,95,0.12); }
    .edit-title { font-family: var(--font-heading); font-size: 1.3rem; font-weight: 700; color: var(--forest); }
    .edit-textarea { line-height: 1.6; resize: vertical; min-height: 320px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88rem; }
    .edit-hint { font-size: 0.78rem; color: var(--text-muted); margin: 10px 0 0; }

    .actions { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 13px 14px; border-radius: 11px; font-weight: 800; font-size: 0.96rem; border: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
    .btn-approve { background: linear-gradient(135deg, #2f7a5f, #21443c); color: #fff; }
    .btn-edit { background: var(--bg-hero); color: var(--forest); border: 1.5px solid var(--border-soft); }
    .btn-deny { background: #fff; color: #a33; border: 1.5px solid rgba(170,51,51,0.4); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .deny-box { margin-top: 14px; display: none; }
    .deny-box.show { display: block; }
    .panel { background: #fff; border: 1px solid var(--border-soft); border-radius: 16px; padding: 32px 26px; color: var(--text-secondary); }
    .panel h3 { font-family: var(--font-heading); color: var(--forest); margin: 0 0 10px; }
    .result-note { margin-top: 18px; padding: 14px 16px; border-radius: 12px; font-weight: 700; }
    .result-ok { background: #e7f1ec; color: var(--forest); }
    .result-deny { background: #fbeaea; color: #a33; }
    .result-edit { background: var(--bg-hero); color: var(--forest-soft); }
    .demo-banner { background: #fff7e6; border: 1px solid rgba(181,138,44,0.35); color: #7a5e10; font-size: 0.84rem; font-weight: 600; border-radius: 10px; padding: 9px 13px; margin-bottom: 16px; }
    @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <img src="https://livabletelluride.org/logo/Livable%20Telluride%20Logo.png" alt="Livable Telluride" onerror="this.style.display='none'">
    </div>
    <div class="eyebrow">Editorial · Draft review</div>
    <h1 class="page-title">Review a drafted article</h1>
    <p class="sub">The editorial agent flagged this meeting as newsworthy and drafted an article. Nothing publishes until you approve it. You can edit it here first.</p>
    <div id="root"><div class="panel">Loading…</div></div>
  </div>

  <script>
  (function () {
    'use strict';
    // The Cloudflare Worker that gates draft reads + records decisions (token-
    // validated, writes to Firestore via the service account). Same Worker that
    // already does Hub-Bub moderation. Endpoints added in step 3:
    //   GET  /article-draft?id=..&t=..        → { ok, draft }
    //   POST /article-decide  { id, t, action, editedTitle?, editedDek?, editedBodyHtml?, denyReason? }
    const WORKER = 'https://livabletelluride-rss-proxy.morgan-8f0.workers.dev';
    const root = document.getElementById('root');
    const params = new URLSearchParams(location.search);
    const ID = params.get('id');
    const TOKEN = params.get('t') || '';
    // ?sample=1 is a DEV-ONLY affordance: render scripts/editorial/draft-sample.json
    // (the output of draft-meeting.js) in this real page. Harmless in prod —
    // the file isn't deployed, so it just errors gracefully.
    const SAMPLE = params.get('sample') === '1';
    const DEMO = params.get('demo') === '1' || (!ID && !TOKEN && !SAMPLE);
    const SIMULATED = DEMO || SAMPLE;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
    const calIcon = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

    function fmtDate(date) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(date || '')) {
        const d = new Date(date + 'T12:00:00');
        if (!isNaN(d)) return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      }
      return date || '';
    }

    // ── Demo draft: modeled on the real 2026-06-23 joint P&Z/HARC wildfire-code
    //    meeting that triage scored [4]. Shows inline source tags (<sup>) and a
    //    flagged unverifiable claim, so the citation-discipline UX is visible. ──
    const DEMO_DRAFT = {
      slug: '2026-06-23-telluride-wildfire-luc-amendments',
      title: 'Telluride weighs wildfire-driven changes to its building rules',
      dek: 'A joint Planning & Zoning and HARC session takes up Land Use Code and Design Guideline amendments meant to square the town with Colorado’s new wildfire resiliency code — the kind of rules change that reaches every future build in the box canyon.',
      source: 'telluride',
      bodyLabel: 'Town of Telluride',
      meetingDate: '2026-06-23',
      meetingKey: 'telluride|2026-06-23|Special Meeting - P&Z and HARC',
      triage: {
        score: 4,
        branch: 'draft',
        topics: ['wildfire code', 'Land Use Code', 'Design Guidelines', 'HARC', 'P&Z'],
        reasons: [
          'Substantive regulatory change: LUC and Design Guideline amendments to align with the Colorado Wildfire Resiliency Code — affects building materials and design standards town-wide.',
          'Recommendations advance directly to Town Council for final action, making this a meaningful step in the legislative process.',
          'Wildfire policy is a key public-interest topic for a mountain community with real fire risk.'
        ],
        follow_up_to: 'Colorado Wildfire Resiliency Code compliance process for Town of Telluride'
      },
      citations: [
        { marker: 1, text: 'Town of Telluride, Special Joint P&Z/HARC meeting agenda, June 23, 2026', url: '' },
        { marker: 2, text: 'Colorado Wildfire Resiliency Code (state requirement referenced in agenda)', url: '' }
      ],
      flaggedClaims: [
        'The number of existing homes that would need to retrofit is not stated in the agenda — flagged as unverifiable from the source.'
      ],
      bodyHtml:
        '<p>The Town of Telluride’s Planning &amp; Zoning Commission and its Historic and Architectural Review Commission met jointly on June 23 to take up amendments to the Land Use Code and the town’s Design Guidelines, both aimed at bringing local rules in line with Colorado’s new wildfire resiliency code.<sup class="cite">[1]</sup></p>' +
        '<p>For anyone who has watched a fire season tighten in the box canyon, the substance here is familiar even if the code language is new: the state is requiring mountain jurisdictions to fold wildfire-resistant standards into how buildings get designed and what they’re made of, and the town has to decide how those standards land alongside its own historic-preservation rules.<sup class="cite">[2]</sup></p>' +
        '<p>This was a recommendation-forming session, not a final vote. Whatever the two commissions land on advances to Town Council, which holds the final action.<sup class="cite">[1]</sup></p>' +
        '<p><span class="flag">How many existing homes would face retrofits under the proposed standards was not part of the materials before the commissions.</span><sup class="cite">⚠</sup> The amendments in front of P&amp;Z and HARC concern the rules for what gets built and reviewed going forward.</p>'
    };

    let draft = null;
    let editing = false;

    function triageHtml(t) {
      if (!t) return '';
      let h = '<div class="triage"><div class="triage-head">';
      h += '<div class="score-badge">' + esc(t.score) + '</div>';
      h += '<div><div class="triage-title">Newsworthiness ' + esc(t.score) + '/5 — drafted for review</div>';
      h += '<div class="triage-meta">Why the agent drafted this</div></div></div>';
      if (Array.isArray(t.reasons) && t.reasons.length) {
        h += '<ul>' + t.reasons.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>';
      }
      if (Array.isArray(t.topics) && t.topics.length) {
        h += '<div class="chips">' + t.topics.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>';
      }
      if (t.follow_up_to) h += '<div class="followup">↳ Follow-up to: ' + esc(t.follow_up_to) + '</div>';
      h += '</div>';
      return h;
    }

    function articleHtml(d) {
      let h = '<div class="article-frame">';
      h += '<h2 class="headline">' + esc(d.title) + '</h2>';
      if (d.dek) h += '<p class="dek">' + esc(d.dek) + '</p>';
      h += '<div class="meta-row">' + calIcon + '<span>' + esc(d.bodyLabel || '') + ' · ' + esc(fmtDate(d.meetingDate)) + '</span></div>';
      // Body is authored by the editorial agent (admin-only pipeline), so its
      // HTML is trusted and rendered as-is.
      h += '<div class="article-body">' + (d.editedBodyHtml || d.bodyHtml || '') + '</div>';
      if (Array.isArray(d.citations) && d.citations.length) {
        h += '<div class="citations"><h3>Sources</h3><ol>';
        d.citations.forEach(c => {
          const u = safeUrl(c.url);
          h += '<li>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(c.text) + '</a>' : esc(c.text)) + '</li>';
        });
        h += '</ol></div>';
      }
      if (Array.isArray(d.flaggedClaims) && d.flaggedClaims.length) {
        h += '<div class="flags"><h3>⚠ Flagged — not verifiable from the source</h3><ul>'
          + d.flaggedClaims.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>';
      }
      h += '</div>';
      return h;
    }

    function editHtml(d) {
      let h = '<div class="article-frame">';
      h += '<label class="edit-label">Headline</label><input class="edit-input edit-title" id="ed-title" value="' + esc(d.editedTitle != null ? d.editedTitle : d.title) + '">';
      h += '<label class="edit-label">Standfirst / dek</label><textarea class="edit-textarea" id="ed-dek" style="min-height:64px;font-family:var(--font-main);font-size:0.96rem;">' + esc(d.editedDek != null ? d.editedDek : d.dek) + '</textarea>';
      h += '<label class="edit-label">Article body (HTML — keep the <sup class="cite">[n]</sup> source tags)</label>';
      h += '<textarea class="edit-textarea" id="ed-body">' + esc(d.editedBodyHtml || d.bodyHtml || '') + '</textarea>';
      h += '<p class="edit-hint">Edit freely, then <strong>Save edits</strong> (stays pending) or <strong>Approve</strong> to publish your edited version.</p>';
      h += '</div>';
      return h;
    }

    function actionsHtml() {
      return '<div class="actions">'
        + '<button class="btn btn-approve" id="act-approve">✓ Approve &amp; publish</button>'
        + '<button class="btn btn-edit" id="act-edit">' + (editing ? '💾 Save edits' : '✎ Edit') + '</button>'
        + '<button class="btn btn-deny" id="act-deny">✕ Deny</button>'
        + '</div>'
        + '<div class="deny-box" id="deny-box">'
        + '<label class="edit-label">Reason for denying (optional, saved with the decision)</label>'
        + '<input class="edit-input" id="deny-reason" placeholder="e.g. not worth a full article / merge with the other 06-23 entry">'
        + '<div class="actions" style="grid-template-columns:1fr;margin-top:10px;"><button class="btn btn-deny" id="deny-confirm">Confirm deny</button></div>'
        + '</div>';
    }

    function render() {
      let h = '<div class="card"><div class="card-body">';
      if (SIMULATED) h += '<div class="demo-banner">' + (SAMPLE ? 'Sample preview — a real generated draft (draft-sample.json). Approve/Deny/Edit are simulated; no data is written.' : 'Demo preview — this is a sample draft. Approve/Deny/Edit are simulated locally; no data is written.') + '</div>';
      h += triageHtml(draft.triage);
      h += editing ? editHtml(draft) : articleHtml(draft);
      h += actionsHtml();
      h += '</div></div>';
      root.innerHTML = h;
      wire();
    }

    function captureEdits() {
      const t = document.getElementById('ed-title');
      const dk = document.getElementById('ed-dek');
      const b = document.getElementById('ed-body');
      if (t) draft.editedTitle = t.value.trim();
      if (dk) draft.editedDek = dk.value.trim();
      if (b) draft.editedBodyHtml = b.value;
      // Mirror edits onto the live fields so the rendered view reflects them.
      if (draft.editedTitle != null) draft.title = draft.editedTitle;
      if (draft.editedDek != null) draft.dek = draft.editedDek;
    }

    function showResult(kind, text) {
      const cls = kind === 'deny' ? 'result-deny' : kind === 'edit' ? 'result-edit' : 'result-ok';
      const note = document.createElement('div');
      note.className = 'result-note ' + cls;
      note.textContent = text;
      root.querySelector('.card-body').appendChild(note);
    }

    function disableAll() { root.querySelectorAll('button').forEach(b => b.disabled = true); }

    // POST a decision to the Worker (live mode). Returns a promise.
    function postDecision(payload) {
      if (SIMULATED) return Promise.resolve({ ok: true, demo: true });
      return fetch(WORKER + '/article-decide', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ id: ID, t: TOKEN }, payload))
      }).then(r => r.json());
    }

    function wire() {
      const editBtn = document.getElementById('act-edit');
      const approveBtn = document.getElementById('act-approve');
      const denyBtn = document.getElementById('act-deny');
      const denyBox = document.getElementById('deny-box');

      editBtn.addEventListener('click', () => {
        if (editing) {                       // currently editing → Save edits
          captureEdits();
          editing = false;
          postDecision({ action: 'edit', editedTitle: draft.editedTitle, editedDek: draft.editedDek, editedBodyHtml: draft.editedBodyHtml })
            .then(res => { render(); if (res && res.ok) showResult('edit', '💾 Edits saved — still pending your approval.'); else showResult('deny', 'Could not save: ' + ((res && res.msg) || 'error')); })
            .catch(e => { render(); showResult('deny', 'Could not save: ' + (e.message || e)); });
        } else {                             // enter edit mode
          editing = true;
          render();
        }
      });

      approveBtn.addEventListener('click', () => {
        if (editing) captureEdits();
        disableAll();
        const payload = { action: 'approve' };
        if (draft.editedTitle != null) payload.editedTitle = draft.editedTitle;
        if (draft.editedDek != null) payload.editedDek = draft.editedDek;
        if (draft.editedBodyHtml != null) payload.editedBodyHtml = draft.editedBodyHtml;
        postDecision(payload)
          .then(res => { if (res && res.ok) showResult('ok', '✓ Approved — it will publish on the next site rebuild.'); else { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not approve: ' + ((res && res.msg) || 'error')); } })
          .catch(e => { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not approve: ' + (e.message || e)); });
      });

      denyBtn.addEventListener('click', () => denyBox.classList.toggle('show'));
      document.getElementById('deny-confirm').addEventListener('click', () => {
        const reason = (document.getElementById('deny-reason').value || '').trim();
        disableAll();
        postDecision({ action: 'deny', denyReason: reason })
          .then(res => { if (res && res.ok) showResult('deny', '✕ Denied — it will not publish.'); else { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not deny: ' + ((res && res.msg) || 'error')); } })
          .catch(e => { root.querySelectorAll('button').forEach(b => b.disabled = false); showResult('deny', 'Could not deny: ' + (e.message || e)); });
      });
    }

    // ── Boot ──
    if (SAMPLE) {
      fetch('scripts/editorial/draft-sample.json')
        .then(r => { if (!r.ok) throw new Error('no draft-sample.json — run draft-meeting.js first'); return r.json(); })
        .then(d => { draft = d; render(); })
        .catch(e => { root.innerHTML = '<div class="panel"><h3>No sample draft</h3><p>' + esc(e.message || String(e)) + '</p></div>'; });
    } else if (DEMO) {
      draft = JSON.parse(JSON.stringify(DEMO_DRAFT));
      render();
    } else {
      fetch(WORKER + '/article-draft?id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(TOKEN))
        .then(r => r.json())
        .then(res => {
          if (!res || !res.ok || !res.draft) {
            root.innerHTML = '<div class="panel"><h3>Can’t open this draft</h3><p>' + esc((res && res.msg) || 'The link may have expired or already been decided.') + '</p></div>';
            return;
          }
          draft = res.draft;
          render();
        })
        .catch(e => { root.innerHTML = '<div class="panel"><h3>Couldn’t load</h3><p>' + esc(e.message || String(e)) + '</p></div>'; });
    }
  })();
  </script>
</body>
</html>
