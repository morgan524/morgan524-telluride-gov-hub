name: Customer.io — Look Up Person

# Manual-only. Prints one person's full Customer.io attributes so we can confirm
# names / region / sub_* / topic_* actually imported (the People list shows only
# email + created_at by default). Read-only; sends no email; touches no data.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to look up (their Customer.io id)'
        required: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Look up person in Customer.io
        env:
          CUSTOMERIO_APP_API_KEY: ${{ secrets.CUSTOMERIO_APP_API_KEY }}
          EMAIL: ${{ github.event.inputs.email }}
        run: node scripts/customerio-lookup.js
