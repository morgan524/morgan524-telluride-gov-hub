name: Customer.io — remove stale emails

# Unsubscribe permanently undeliverable addresses (hard bounces, dead domains,
# earlier-bounce suppressions, spam complaints) found in recent broadcast
# sends. Profiles are unsubscribed and tagged stale_email_reason, never
# deleted. See scripts/customerio-remove-stale.js. Run by hand.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Unsubscribe them (true) or only list them (false)'
        required: true
        default: 'false'
      days:
        description: 'Look back this many days of sends'
        required: true
        default: '7'
      emails:
        description: 'Optional: remove only these addresses (comma-separated), whatever the bounce type'
        required: false
        default: ''
      rename:
        description: 'Optional: change addresses, old=new (comma-separated)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  remove-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Find (and optionally unsubscribe) stale addresses
        env:
          CUSTOMERIO_APP_API_KEY: ${{ secrets.CUSTOMERIO_APP_API_KEY }}
          CUSTOMERIO_SITE_ID: ${{ secrets.CUSTOMERIO_SITE_ID }}
          CUSTOMERIO_TRACK_API_KEY: ${{ secrets.CUSTOMERIO_TRACK_API_KEY }}
          EMAILS: ${{ github.event.inputs.emails }}
          RENAME: ${{ github.event.inputs.rename }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then A=--apply; else A=; fi
          if [ -n "$RENAME" ]; then node scripts/customerio-remove-stale.js $A --rename "$RENAME" ${EMAILS:+--emails "$EMAILS"}
          elif [ -n "$EMAILS" ]; then node scripts/customerio-remove-stale.js $A --emails "$EMAILS"
          else node scripts/customerio-remove-stale.js $A --days "${{ github.event.inputs.days }}"; fi
