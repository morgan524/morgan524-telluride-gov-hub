name: SMC Housing Code Update Watch

# Watches the San Miguel County Housing Code Update / SSR project page and
# mirrors any newly-posted documents into assets/ssr/, plus a manifest.
#
# Runs every 6 hours and on manual dispatch.  When new documents appear the
# script writes them into assets/ssr/ and updates assets/ssr/manifest.json;
# this workflow then commits and pushes the changes so the live site has
# offline copies even if SMC moves or removes the originals.

on:
  schedule:
    - cron: '15 */6 * * *'   # every 6 hours, offset 15 min to avoid overlap with content-refresh
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SMC watcher
        run: node scripts/smc-housing-code-watch.js 2>&1 | tee /tmp/smc-watch.log

      - name: Commit & push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes from SMC watcher"
            exit 0
          fi
          git add assets/ssr
          git commit -m "🛰 SMC Housing Code Update mirror $(date -u +%F\ %H:%MZ)"
          git push origin HEAD

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-watch-logs-${{ github.run_id }}
          path: '/tmp/*.log'
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 SMC Housing Code Watch workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled SMC Housing Code Watch workflow failed.\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 SMC Housing Code Watch workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
