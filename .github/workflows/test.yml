name: Tests

# Unit tests for the pure helpers (serialize, sanitize, source-health, data
# loader, model IDs) using Node's built-in test runner — zero extra deps.
# Runs on any change to the scripts or the bot-managed data files, so a bad
# edit (or a malformed bot data write) fails CI instead of reaching the live
# site. The load-data test parses js/gov-*.js, so a syntax error there is caught.
on:
  push:
    paths:
      - 'scripts/**'
      - 'js/gov-data.js'
      - 'js/gov-helpers.js'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit tests
        run: cd scripts && npm test
