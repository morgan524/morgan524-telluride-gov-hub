name: Weekly Site Review

# Automated slice of the weekly review protocol (docs/weekly-review/PROTOCOL.md).
# Hard-fails only on the things that are real regressions/risks (a page loading
# the dead gov-hub.js, or a committed secret); everything else is advisory
# (::warning:: or continue-on-error) so the job doesn't cry wolf. On a hard
# failure it opens a tracked issue, mirroring content-refresh.yml.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (~7am Mountain)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      RSS_PROXY_URL: ${{ secrets.RSS_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Guard — no page may load dead js/gov-hub.js
        run: |
          if grep -lE 'src=["'"'"'][^"'"'"']*gov-hub\.js' *.html 2>/dev/null; then
            echo "::error::A page loads dead js/gov-hub.js — use gov-data.js + gov-helpers.js"; exit 1
          fi
          echo "OK — no page depends on gov-hub.js"

      - name: Feed freshness (advisory)
        run: |
          if ! curl -sf https://livabletelluride.org/feed.xml -o /tmp/f.xml; then
            echo "::warning::feed.xml unreachable"; exit 0; fi
          D=$(grep -oE '<lastBuildDate>[^<]+' /tmp/f.xml | head -1 | sed 's/<lastBuildDate>//')
          AGE=$(( ( $(date +%s) - $(date -d "$D" +%s) ) / 3600 ))
          echo "feed.xml lastBuildDate: $D (${AGE}h old)"
          [ "$AGE" -le 24 ] || echo "::warning::feed.xml is ${AGE}h old (>24h) — content-refresh may be stalled"

      - name: Cloudflare Worker /health (advisory)
        run: |
          [ -n "$RSS_PROXY_URL" ] || { echo "RSS_PROXY_URL not set — skip"; exit 0; }
          if curl -sf "$RSS_PROXY_URL/health" | grep -q '"ok":true'; then echo "Worker OK";
          else echo "::warning::Worker /health did not return ok:true"; fi

      - name: Secret scan (gitleaks — advisory)
        run: |
          set +e
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gl.tgz && tar xzf gl.tgz gitleaks
          if [ ! -x ./gitleaks ]; then echo "::warning::could not fetch gitleaks — skipping"; exit 0; fi
          # Advisory: real secrets live in GitHub/Worker secrets, never the repo;
          # known public-by-design IDs (Firebase web key, Apps Script /exec) are
          # allowlisted in .gitleaks.toml. Surface findings as a warning rather than
          # failing the job — GitHub native secret scanning is the hard backstop. A
          # developer can tighten to a hard fail after a clean local `gitleaks detect`.
          ./gitleaks detect --no-banner --redact --report-path /tmp/gl.json --exit-code 1
          if [ $? -eq 0 ]; then echo "✓ gitleaks: no findings";
          else echo "::warning::gitleaks reported findings — review /tmp/gl.json (likely public-by-design IDs; extend .gitleaks.toml). GitHub native secret scanning remains active."; fi
          exit 0

      - name: Link check (advisory — 403/429 are CI-IP blocks)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--max-concurrency 4 --accept 200,206,403,429 --exclude-path scripts --exclude-path node_modules ./*.html"
          fail: false

      - name: Lighthouse (advisory)
        run: npx --yes @lhci/cli@0.13.x autorun --collect.url=https://livabletelluride.org/ --upload.target=temporary-public-storage || true

      - name: Dependency audit (advisory — CI bot deps only)
        run: cd scripts && npm audit --omit=dev || true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔎 Weekly site review failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The Weekly Site Review workflow hard-failed (dead-code dependency or a potential committed secret).\n\nRun: ${url}\n\nSee docs/weekly-review/PROTOCOL.md.`
            });
