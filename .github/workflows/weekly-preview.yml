name: Weekly Email Preview

# Renders the upcoming weekly email via scripts/weekly-email.js (from the live
# gov-data.js + gov-helpers.js — real agenda links, curated events, topic
# sections) and emails a review copy to info@ every SUNDAY at 10:00 AM
# Mountain (moved from Saturday 2026-07-12 per Morgan — the draft arrives for
# review/edits the morning before the Monday 6:00 AM send, with anything
# posted Friday/Saturday picked up). The run also saves the paste-ready
# Mailchimp HTML (weekly-mailchimp.html) as an artifact. Since 2026-10-04 it
# also emails a review copy of Monday's "Past Meetings" email
# (scripts/past-meetings-email.js), when last week has recaps.
# Edit the "Week Ahead" lede before the send in the LEDE const of
# scripts/weekly-email.js.
on:
  schedule:
    - cron: '0 16 * * 0'   # Sun 16:00 UTC = 10:00 AM MDT (summer)
    - cron: '0 17 * * 0'   # Sun 17:00 UTC = 10:00 AM MST (winter)
    - cron: '0 20 * * 0'   # Sun 20:00 UTC = 2 PM MDT / 1 PM MST (backup)
# Once per week (Morgan 2026-10-24): any scheduled run from Sunday 10 AM to
# 10 PM Denver sends if this Sunday's preview hasn't gone out yet; a cache
# marker keyed on the date records the send. GitHub often starts crons late,
# so the old "only at 10 AM" guard could skip both twins.
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Week start date YYYY-MM-DD (override "next Monday" auto-detect). Use e.g. 2026-06-22 to re-render THIS week''s email after Sunday''s auto-send already advanced to next week.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write   # ci-health-issue failure tracker
  actions: write  # save the once-per-week cache marker

concurrency:
  group: weekly-preview
  cancel-in-progress: false

jobs:
  # DST guard: exactly one of the cron pair lands on 10:00 AM in Denver;
  # skip the other. Manual dispatch always runs.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
      key: ${{ steps.w.outputs.key }}
    steps:
      - name: Within the Sunday window?
        id: w
        run: |
          echo "key=weekly-preview-sent-$(TZ='America/Denver' date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "manual=true" >> "$GITHUB_OUTPUT"; echo "inwin=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          DOW="$(TZ='America/Denver' date +%u)"; H=$((10#$(TZ='America/Denver' date +%H)))
          if [ "$DOW" = "7" ] && [ "$H" -ge 10 ] && [ "$H" -lt 22 ]; then echo "inwin=true" >> "$GITHUB_OUTPUT"
          else echo "Denver weekday=$DOW hour=$H — outside Sunday 10 AM to 10 PM, skipping"; fi
      - name: Already sent today?
        id: sent
        if: steps.w.outputs.inwin == 'true' && steps.w.outputs.manual != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .weekly-preview-sent
          key: ${{ steps.w.outputs.key }}
          lookup-only: true
      - name: Decide
        id: g
        run: |
          if [ "${{ steps.w.outputs.inwin }}" = "true" ] && [ "${{ steps.sent.outputs.cache-hit }}" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "not in window or already sent — skipping"; fi

  preview:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      # Email send is skipped (just renders + uploads an artifact) until these
      # secrets are added. PREVIEW_SMTP_USER = a Gmail/Workspace address;
      # PREVIEW_SMTP_PASS = an app password for it.
      PREVIEW_SMTP_PASS: ${{ secrets.PREVIEW_SMTP_PASS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Render weekly email (preview + paste-ready) from live data
        id: render
        env:
          WEEK_START_INPUT: ${{ github.event.inputs.week_start }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Rick-voice lede generation
        run: |
          set -o pipefail
          # Cache-bust + -f so we always render from the freshest data and fail
          # loudly on a site outage instead of feeding an error page to node.
          T=$(date +%s)
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-data.js?t=$T"    -o /tmp/gd.js
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-helpers.js?t=$T" -o /tmp/gh.js
          # Honour the workflow_dispatch input when one is provided, otherwise
          # use the cron-default "next Monday". This lets a manual re-render
          # target THIS week (the one that's actually about to send) after
          # the Sunday auto-send has already advanced the default to the
          # following Monday.
          if [ -n "$WEEK_START_INPUT" ]; then
            WS="$WEEK_START_INPUT"
          else
            WS=$(date -u -d "next monday" +%F)
          fi
          LABEL="$(date -u -d "$WS" '+%B %-d') – $(date -u -d "$WS +6 days" '+%B %-d, %Y')"
          echo "Week start: $WS  ·  Label: $LABEL"
          # While the Sunday review freeze is active (digest-sunday-review.yml),
          # preview the EXACT reviewed files with the review's findings, not a
          # fresh render that could differ from what was reviewed.
          if node scripts/lib/frozen-preview.js weekly weekly-preview.html > /tmp/wp.log; then
            echo "weekly: previewing the frozen, reviewed digest"
            cp digest/week.html weekly-mailchimp.html
          else
            WEEKLY_PREVIEW=1 node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WS" "$LABEL" weekly-preview.html 2>&1 | tee /tmp/wp.log
            node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WS" "$LABEL" weekly-mailchimp.html
          fi
          echo "subject=$(grep '^SUBJECT=' /tmp/wp.log | sed 's/^SUBJECT=//')" >> "$GITHUB_OUTPUT"
          # Past Meetings review copy (no file when last week had no recaps).
          if node scripts/lib/frozen-preview.js past past-preview.html > /tmp/pp.log; then
            echo "past: previewing the frozen, reviewed digest"
          elif [ -f digest/freeze.json ] && node -e "process.exit(Date.now() < Date.parse(require('./digest/freeze.json').until) ? 0 : 1)"; then
            echo "past: frozen with no Past Meetings digest this week" > /tmp/pp.log
          else
            WEEKLY_PREVIEW=1 node scripts/past-meetings-email.js "$WS" past-preview.html | tee /tmp/pp.log
          fi
          echo "past_subject=$(grep '^SUBJECT=' /tmp/pp.log | sed 's/^SUBJECT=//')" >> "$GITHUB_OUTPUT"

      - name: Email preview to info@livabletelluride.org
        if: env.PREVIEW_SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          subject: ${{ steps.render.outputs.subject }}
          to: info@livabletelluride.org
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          html_body: file://weekly-preview.html

      - name: Email Past Meetings preview to info@livabletelluride.org
        if: env.PREVIEW_SMTP_PASS != '' && steps.render.outputs.past_subject != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          subject: ${{ steps.render.outputs.past_subject }}
          to: info@livabletelluride.org
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          html_body: file://past-preview.html

      - name: Note when email isn't configured
        if: env.PREVIEW_SMTP_PASS == ''
        run: echo "::warning::PREVIEW_SMTP_PASS secret not set — rendered weekly-preview.html (see artifact) but did not email. Add PREVIEW_SMTP_USER + PREVIEW_SMTP_PASS to enable the Sunday email."

      - name: Mark this Sunday's preview as sent
        if: github.event_name == 'schedule'
        run: mkdir -p .weekly-preview-sent && date -u +%FT%TZ > .weekly-preview-sent/at
      - uses: actions/cache/save@v4
        if: github.event_name == 'schedule'
        continue-on-error: true
        with:
          path: .weekly-preview-sent
          key: ${{ needs.guard.outputs.key }}

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-preview
          path: |
            weekly-preview.html
            weekly-mailchimp.html
            past-preview.html
          retention-days: 14
          if-no-files-found: ignore

      - name: CI health issue
        if: always()
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Weekly Email Preview workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
