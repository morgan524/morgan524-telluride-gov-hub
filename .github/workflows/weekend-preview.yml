name: Weekend Email Preview

# Renders the "Weekend Ahead" events email via scripts/weekly-email.js in
# WEEKEND mode (from the live gov-data.js + gov-helpers.js — curated best-of-
# the-weekend events, no meetings, Rick-voice lede) and emails a review copy to
# info@ every WEDNESDAY at 2:00 PM Mountain — the draft to review the day before
# the Thursday 6:00 AM send (digest-scheduled-send.yml). Also saves the paste-
# ready HTML as an artifact. (Revived 2026-07-13 per Morgan; Wed-review/Thu-send.)
on:
  schedule:
    - cron: '0 20 * * 4'   # Thu 20:00 UTC = 2:00 PM MDT (summer)
    - cron: '0 21 * * 4'   # Thu 21:00 UTC = 2:00 PM MST (winter)
    # Moved Wed→Thu 2026-07-23 to keep the review one day before the send,
    # which shifted from Thursday to Friday (per Morgan).
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Weekend start date YYYY-MM-DD — the FRIDAY the weekend begins (override the auto-detected upcoming Friday). The email sends Thursday and covers Fri–Sun.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write   # ci-health-issue failure tracker

jobs:
  # DST guard: exactly one of the cron pair lands on 2:00 PM in Denver; skip the
  # other. Manual dispatch always runs.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - name: Only proceed at 2:00 PM America/Denver
        id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR="$(TZ='America/Denver' date +%H)"
          if [ "$HOUR" = "14" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Denver hour=$HOUR (not 14) — DST twin cron, skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      # Email send is skipped (just renders + uploads an artifact) until these
      # secrets are added. PREVIEW_SMTP_USER = a Gmail/Workspace address;
      # PREVIEW_SMTP_PASS = an app password for it. (Already set for the weekly.)
      PREVIEW_SMTP_PASS: ${{ secrets.PREVIEW_SMTP_PASS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Render weekend email (preview + paste-ready) from live data
        id: render
        env:
          WEEK_START_INPUT: ${{ github.event.inputs.week_start }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Rick-voice lede generation
        run: |
          set -o pipefail
          # Cache-bust + -f so we always render from the freshest data and fail
          # loudly on a site outage instead of feeding an error page to node.
          T=$(date +%s)
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-data.js?t=$T"    -o /tmp/gd.js
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-helpers.js?t=$T" -o /tmp/gh.js
          # Honour the workflow_dispatch input when one is provided, otherwise
          # use the upcoming Friday — the email sends Thursday (cron day) and
          # covers Fri–Sun, so `date -d friday` from Thursday gives tomorrow.
          if [ -n "$WEEK_START_INPUT" ]; then
            WS="$WEEK_START_INPUT"
          else
            WS=$(date -u -d "friday" +%F)
          fi
          LABEL="$(date -u -d "$WS" '+%B %-d') - $(date -u -d "$WS +2 days" '+%B %-d, %Y')"
          echo "Weekend start: $WS  ·  Label: $LABEL"
          # If this weekend is already APPROVED at the Review Desk, preview the
          # EXACT file that will send. Re-rendering here would regenerate the
          # Rick lede and re-pick events, so the review email would contradict
          # the approved version — which is exactly what happened 2026-07-23.
          if node scripts/lib/approved-preview.js weekend "$WS" weekend-preview.html > /tmp/wp.log 2>/tmp/wp.err; then
            cat /tmp/wp.err
            cp weekend-preview.html weekend-mailchimp.html
          else
            cat /tmp/wp.err
            echo "No approval for $WS — rendering a fresh draft."
            WEEKEND=1 WEEKLY_PREVIEW=1 node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WS" "$LABEL" weekend-preview.html 2>&1 | tee /tmp/wp.log
            WEEKEND=1 node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WS" "$LABEL" weekend-mailchimp.html
          fi
          echo "subject=$(grep '^SUBJECT=' /tmp/wp.log | sed 's/^SUBJECT=//')" >> "$GITHUB_OUTPUT"

      - name: Email preview to info@livabletelluride.org
        if: env.PREVIEW_SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          subject: ${{ steps.render.outputs.subject }}
          to: info@livabletelluride.org
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          html_body: file://weekend-preview.html

      - name: Note when email isn't configured
        if: env.PREVIEW_SMTP_PASS == ''
        run: echo "::warning::PREVIEW_SMTP_PASS secret not set — rendered weekend-preview.html (see artifact) but did not email."

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekend-preview
          path: |
            weekend-preview.html
            weekend-mailchimp.html
          retention-days: 14
          if-no-files-found: ignore

      - name: CI health issue
        if: always()
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Weekend Email Preview workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
