name: Meeting Recaps

# Auto-generates the "Past Meeting Summaries" recap cards (MEETING_RECAPS in
# js/gov-helpers.js), which were previously hand-written and went stale.
# Lists each gov YouTube channel's recent meeting uploads, pulls the transcript
# (yt-dlp auto-captions), and has Claude write a ~100-word "Rick"-voice recap of
# what happened. Idempotent (dedups by video + body/date), so safe to run daily.
#
# Scheduled at 15:00 UTC (≈9am MT) — offset from Content Refresh (0/6/12/18) to
# avoid a push race on gov-helpers.js; it touches only MEETING_RECAPS, which no
# other job writes, so a rebase is clean even if the file changed elsewhere.

# ⚠️ DISABLED on a schedule on purpose. YouTube blocks caption/transcript
# downloads from GitHub runner datacenter IPs (a run succeeds but gets 0-char
# transcripts — verified 2026-06-25). This pipeline therefore runs on a
# residential IP via a Mac launchd job (scripts/run-meeting-recaps-local.sh +
# ~/Library/LaunchAgents/com.livabletelluride.meeting-recaps.plist). This
# workflow is kept for manual dispatch only — and even that won't produce
# transcripts from the cloud; re-enable the cron only if YouTube ever stops
# blocking runner IPs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meeting-recaps
  cancel-in-progress: false

jobs:
  recaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Generate meeting recaps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node scripts/meeting-recaps.js 2>&1 | tee /tmp/meeting-recaps.log

      - name: Commit & push new recaps
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          if [ -n "$(git status --porcelain js/gov-helpers.js scripts/pending/)" ]; then
            git add js/gov-helpers.js scripts/pending/
            git commit -m "📝 Auto meeting recaps $(date -u +%Y-%m-%d)"
            # Rebase onto any commits the content bot pushed meanwhile, then push.
            # Only MEETING_RECAPS + pending vote drafts change here.
            git pull --rebase origin main
            git push
          else
            echo "No new recaps."
          fi

      # New transcript-drafted vote files → open/refresh a review issue.
      # Drafts are NEVER inserted automatically; review + insert-votes.mjs
      # is the human step (see scripts/EXTRACT_VOTES_README.md).
      - name: Vote-draft review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(git diff --name-only HEAD~1 HEAD -- scripts/pending/ 2>/dev/null || true)
          [ -z "$NEW" ] && { echo "No new vote drafts."; exit 0; }
          BODY="Transcript-drafted vote files from meeting-recaps (review, then insert with scripts/insert-votes.mjs):

          $(echo "$NEW" | sed 's/^/- /')"
          EXISTING=$(gh issue list --label vote-tracker --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "🗳 Vote tracker: transcript drafts to review" --label vote-tracker --body "$BODY" || \
            gh issue create --title "🗳 Vote tracker: transcript drafts to review" --body "$BODY"
          fi
