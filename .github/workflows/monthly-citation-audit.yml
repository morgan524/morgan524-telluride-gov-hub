name: Monthly Citation Audit

on:
  schedule:
    # 1st of each month at 15:00 UTC (9am Mountain)
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run citation audit
        run: |
          set -o pipefail
          node scripts/citation-audit.js 2>&1 | tee /tmp/citation-audit.log

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-audit-logs-${{ github.run_id }}
          path: '/tmp/*.log'
          retention-days: 30
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Monthly Citation Audit workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled Monthly Citation Audit workflow failed.\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Monthly Citation Audit workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
