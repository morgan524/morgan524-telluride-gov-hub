name: Content Review → Claude Fix

# Hands the daily content review's "needs your judgment" items to Claude Code
# to fix at the source, instead of emailing them to a person to fix by hand.
# (Morgan, 2026-09-21: "have the bot run this issue to you for fixing for all
# issues in the future.")
#
# Runs after EACH successful Daily Content Review (once a day, 12:30 UTC). It reads that run's
# content-review-actionable.log artifact and exits quietly when it is empty
# (the normal case) or when a fix PR from a previous run is still open, so a
# finding is worked at most once until a human merges or closes the PR.
#
# Claude edits the working tree; the commit + PR + issue comment happen in
# plain shell steps afterwards so the PR body is under our control.
#
# Two tiers (Morgan, 2026-10-06: "fix errors that are easy to identify and fix"):
#   EASY → committed straight to main. Claude must call the whole batch easy
#          (typos, garbled text, a verified-dead link cleared/replaced, an exact
#          duplicate dropped) AND a mechanical gate must agree: only content-data
#          files touched (data/*.json, js/gov-helpers.js, js/gov-data.js), a
#          small diff, syntax + unit tests + JSON mirrors all pass.
#   REVIEW → a PR for Morgan, as before: anything touching code, dates,
#          meeting facts or what a summary says, or failing any gate check.
# Merge (or the easy commit) and the next content-refresh re-renders.

on:
  workflow_run:
    workflows: ["Daily Content Review"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: content-review-claude-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The review run's logs. On a manual dispatch there is no upstream run,
      # so regenerate the actionable log locally instead.
      - name: Fetch the review's findings (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v6
        with:
          name: content-review-logs-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: review-logs

      - name: Regenerate findings (manual dispatch)
        if: github.event_name != 'workflow_run'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p review-logs
          node scripts/content-review.js > /dev/null 2>&1 || true
          cp content-review-actionable.log content-review-findings.log review-logs/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Decide whether there is anything to fix
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "run=false" >> "$GITHUB_OUTPUT"
          # The artifact mixes /tmp and repo-root paths, so the files may land
          # nested under their original directories — flatten them.
          for f in content-review-actionable.log content-review-findings.log content-review-findings.json; do
            SRC=$(find review-logs -name "$f" -type f | head -1)
            [ -n "$SRC" ] && [ "$SRC" != "review-logs/$f" ] && cp "$SRC" "review-logs/$f"
          done
          if [ ! -s review-logs/content-review-actionable.log ]; then
            echo "No actionable findings — nothing for Claude to do."; exit 0
          fi
          OPEN=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/content-review-fix"))] | length')
          if [ "${OPEN:-0}" != "0" ]; then
            echo "A content-review fix PR is still open — waiting for it to be merged/closed before working new findings."; exit 0
          fi
          # Also wait on a fix BRANCH that never became a PR. From 2026-09-28 the
          # PR step failed ("GitHub Actions is not permitted to create or approve
          # pull requests"), so the open-PR check above never tripped and every
          # review run (3–4 a day) paid ~$0.90 to redo the same fixes, leaving 34
          # orphan branches. Any claude/content-review-fix-* branch not yet merged
          # into main means a fix is already waiting for a human.
          git fetch -q origin '+refs/heads/claude/content-review-fix-*:refs/remotes/origin/claude/content-review-fix-*' 2>/dev/null || true
          PENDING=$(git branch -r --no-merged origin/main 2>/dev/null | grep -c 'origin/claude/content-review-fix-' || true)
          if [ "${PENDING:-0}" != "0" ]; then
            echo "$PENDING unmerged content-review fix branch(es) already waiting — not paying to redo them."; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "----- actionable findings -----"; cat review-logs/content-review-actionable.log

      - name: Claude fixes the findings at the source
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --max-turns 60
          prompt: |
            You are working in the Livable Telluride / Telluride Gov Hub repo. The
            daily content review found items that need judgment. Fix them AT THE
            SOURCE so they stay fixed. Read CLAUDE.md and docs/content-review.md
            first. The findings are in review-logs/content-review-actionable.log
            (full context in review-logs/content-review-findings.log).

            HARD RULES
            - js/gov-helpers.js event/meeting arrays and most *_CACHED_DATA are
              re-scraped every 6 hours. A bare hand-edit there is gone by the
              next refresh. Every fix needs a durable half: a scraper/normalizer
              change in scripts/content-refresh.js, an entry in
              data/content-corrections.json (kinds: event-date, clear-link,
              set-link, drop-event — see scripts/lib/content-corrections.js), or a
              detector fix in scripts/content-review.js when the finding is a
              false positive. You MAY also patch the current data so the site is
              right today, but never as the only fix.
            - Hand-curated config in js/gov-data.js (TELLURIDE_FESTIVALS,
              LOCAL_ORGS, etc.) and MANUAL_SUMMARIES text can be edited directly.
            - If you rename a meeting title, rename its
              "source|date|title" keys in MANUAL_SUMMARIES, MEETING_PREVIEWS and
              MEETING_AGENDA_META too, or the summary orphans.
            - Never invent facts. For a date conflict, check the organizer's own
              page (curl it); if you cannot verify which date is right, leave the
              data alone and say so in the summary. Two dates on the same weekday
              exactly 7 days apart are a weekly series, not a conflict.
            - Never link to an agenda that doesn't exist; never feature an
              obituary; a summary must never explain why it can't summarize.
            - After editing: `node --check` every .js you touched, run
              `node scripts/mirror-json.js` if you changed js/gov-data.js or
              js/gov-helpers.js, then run
              `ANTHROPIC_API_KEY= node scripts/content-review.js` and confirm the
              items you fixed no longer appear in content-review-actionable.log.
              Then `git checkout -- scripts/source-baselines.json` (bot-owned).
            - Do NOT git commit, push, or open a PR — a later step does that.

            WORK IN TWO PHASES so the human PR stays as small as possible.

            PHASE 1 — EASY fixes only (these go live without a human). A fix is
            easy ONLY if it is one of these, with no doubt, AND it edits only
            data/*.json, js/gov-helpers.js or js/gov-data.js:
              • a spelling/typo fix in a title or text where the right spelling
                is obvious from the record itself or its source page;
              • removing garbled characters/markup from text;
              • clearing a link you confirmed is dead (curl), or replacing it
                with a URL you confirmed works and is the same page;
              • dropping an exact duplicate entry;
              plus the data/content-corrections.json rows (existing kinds only)
              that make those durable.
            Do every easy fix, run the checks above, then — before touching
            anything else — run `git diff > /tmp/claude-easy.patch` and write
            /tmp/claude-easy-summary.md (one bullet per easy fix). If there are
            no easy fixes, skip both files.

            PHASE 2 — everything else (goes to a PR for Morgan): any code change
            (scripts/, a new correction kind, a detector or scraper fix), any
            date/time/location change, adding or removing a real event or
            meeting, changing what a summary says, anything you had to judge or
            could not verify. When unsure, it belongs here. Keep these changes
            minimal — only what the finding needs. Do not undo phase 1 edits.

            FINISH by writing /tmp/claude-fix-summary.md covering PHASE 2 only:
            one bullet per finding with what you changed and why (file paths),
            and a final "Not fixed" list for anything you left alone and why.

      # Split Claude's work: phase 1 (easy) goes straight to main if a
      # mechanical gate agrees — the bot never self-certifies — and only the
      # remainder becomes a PR, so the PR carries just what needs judgment.
      - name: Apply easy fixes to main, PR the rest
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🧭 Daily content review findings'
        run: |
          set -e
          git config user.name  "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git checkout -- scripts/source-baselines.json 2>/dev/null || true
          rm -f content-review-findings.log content-review-findings.json content-review-actionable.log
          git add -A -- . ':!review-logs' ':!scripts/node_modules'
          if git diff --cached --quiet; then echo "Claude made no changes."; exit 0; fi
          BASE=$(git rev-parse HEAD)
          git commit -q -m "tmp: everything Claude changed"
          FULL=$(git rev-parse HEAD)
          git reset -q --hard "$BASE"

          # Gate: every check must pass for the easy patch to go live.
          easy_gate() {
            CHANGED=$(git diff --name-only)
            [ -n "$CHANGED" ] || { echo "Easy patch is empty."; return 1; }
            BAD=$(echo "$CHANGED" | grep -vE '^(data/[^/]+\.json|js/gov-helpers\.js|js/gov-data\.js)$' || true)
            [ -z "$BAD" ] || { echo "Easy patch touches more than content data: $BAD"; return 1; }
            LINES=$(git diff --numstat | awk '{n+=$1+$2} END {print n+0}')
            [ "$LINES" -le 60 ] || { echo "Easy patch is $LINES lines (limit 60)."; return 1; }
            node --check js/gov-helpers.js && node --check js/gov-data.js || { echo "Syntax check failed."; return 1; }
            for j in $(echo "$CHANGED" | grep '^data/' || true); do
              node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$j" || { echo "$j is not valid JSON."; return 1; }
            done
            # Mirrors must already be in sync: re-running mirror-json may change nothing new.
            node scripts/mirror-json.js >/dev/null 2>&1 || { echo "mirror-json failed."; return 1; }
            [ "$(git diff --name-only)" = "$CHANGED" ] || { echo "JSON mirrors were out of sync."; return 1; }
            (cd scripts && npm ci --silent >/dev/null 2>&1 && npm test --silent >/dev/null 2>&1) || { echo "Unit tests failed."; return 1; }
            git checkout -- scripts/source-baselines.json 2>/dev/null || true
            echo "Easy patch: $(echo "$CHANGED" | wc -l | tr -d ' ') file(s), $LINES lines — passes every check."
          }

          EASY_SHA=""; SPLIT="$BASE"
          if [ -s /tmp/claude-easy.patch ] && git apply --exclude=scripts/source-baselines.json /tmp/claude-easy.patch 2>/dev/null; then
            if easy_gate; then
              git add -A -- . ':!review-logs' ':!scripts/node_modules'
              git commit -q -m "Content review easy fixes $(date -u +%F) (Claude, auto-applied)" -m "$(cat /tmp/claude-easy-summary.md 2>/dev/null || echo 'No summary written.')"
              SPLIT=$(git rev-parse HEAD)
              git pull -q --rebase origin main
              git push -q origin HEAD:main
              EASY_SHA=$(git rev-parse --short HEAD)
              echo "Easy fixes live on main: $EASY_SHA"
            else
              echo "Easy patch failed the gate — it goes in the PR instead."
              git reset -q --hard "$BASE"
            fi
          fi
          git clean -fdq -e review-logs -e scripts/node_modules

          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EASY_SHA" ] && [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$(printf '🤖 Claude applied easy fixes directly (commit %s). Revert that commit to undo.\n\n%s' "$EASY_SHA" "$(cat /tmp/claude-easy-summary.md 2>/dev/null)")"
          fi

          # The PR gets only what is left: everything Claude changed minus what went live.
          git diff --binary "$SPLIT" "$FULL" > /tmp/claude-review.patch
          if [ ! -s /tmp/claude-review.patch ]; then echo "Nothing left for review — no PR."; exit 0; fi
          BRANCH="claude/content-review-fix-$(date -u +%Y%m%d-%H%M)"
          git checkout -q -b "$BRANCH"
          git apply --3way /tmp/claude-review.patch
          git add -A -- . ':!review-logs' ':!scripts/node_modules'
          git commit -m "Content review fixes $(date -u +%F) (Claude)" -m "$(cat /tmp/claude-fix-summary.md 2>/dev/null || echo 'See PR body.')"
          git push -u origin "$BRANCH"
          {
            echo "Claude worked the content review's actionable findings from $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "## What changed"
            cat /tmp/claude-fix-summary.md 2>/dev/null || echo "(no summary written)"
            echo
            echo "## Findings worked"
            echo '```'; cat review-logs/content-review-actionable.log; echo '```'
            echo
            if [ -n "$EASY_SHA" ]; then
              echo "Easy fixes from this run already went live in $EASY_SHA — this PR holds only the rest."
              echo
            fi
            echo "Merge to apply. content-refresh re-renders within the hour; the next content review confirms."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/pr-body.md
          PR_URL=$(gh pr create --title "Content review fixes $(date -u +%F) (Claude)" --body-file /tmp/pr-body.md --base main --head "$BRANCH")
          echo "PR: $PR_URL"
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "🤖 Claude opened a fix PR for the actionable findings: $PR_URL"
          fi
