name: Site Review (weekly AI)

# Weekly full AI site review — everything the daily run does, PLUS the per-page
# Claude vision review (visual/layout/content/consistency) with an adversarial
# verify pass, cross-page dedup, site-wide detection, and an executive summary.
# Updates a single rolling issue ("🔎 Weekly site review"). Runs in the cloud
# (no local-machine dependency) against the deployed production site.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC ≈ 7am Mountain
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-review-weekly
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: cd scripts && npm install
      - name: Install Chromium
        run: cd scripts && npx playwright install chromium --with-deps
      - name: Run full AI site review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/review/review-site.js --issue-title "🔎 Weekly site review" 2>&1 | tee /tmp/site-review-weekly.log

      # 2026-07-22 audit P0-4: a crashed review run previously died silently —
      # indistinguishable from "reviewed, found nothing".
      - name: CI Health issue (open on failure / close on recovery)
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Weekly site review workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
