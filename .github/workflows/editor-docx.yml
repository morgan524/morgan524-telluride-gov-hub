name: Week Ahead Editor Copy (Word)

# Fridays after 6:00 PM Mountain time (Morgan 2026-10-19): email John Metzger
# a Word document with all of next week's Week Ahead text — the intro, every
# public meeting and every event with its suggested language — for editing.
# Morgan then updates the newsletter on the Review Desk from his edits.
# Nothing here touches the digest itself; it only renders and emails a copy.
#
# Send ONCE per week (Morgan 2026-10-24). GitHub often starts scheduled runs
# hours late (Fri 2026-10-23 ran at 10:33 and 11:48 PM and the old "only at
# 6 PM" guard skipped both), so any run from Friday 6 PM through Saturday
# 2 PM Denver sends if that week's copy hasn't gone out yet. A cache marker
# keyed on the week records the send; later runs that week skip. The
# Saturday-morning cron is the backup if GitHub drops Friday's.
# Manual dispatch always sends (use `to` for a test to another address).
on:
  schedule:
    - cron: '15 0 * * 6'   # Sat 00:15 UTC = Fri 6:15 PM MDT (summer)
    - cron: '15 1 * * 6'   # Sat 01:15 UTC = Fri 6:15 PM MST (winter)
    - cron: '0 15 * * 6'   # Sat 15:00 UTC = Sat 9 AM MDT / 8 AM MST (backup)
  workflow_dispatch:
    inputs:
      to:
        description: 'Send to (default john@metzger.com). Use your own address for a test.'
        required: false
      week_start:
        description: 'Week start YYYY-MM-DD (default: next Monday)'
        required: false

permissions:
  contents: read
  actions: write   # save the once-per-week cache marker

concurrency:
  group: editor-docx
  cancel-in-progress: false

jobs:
  editor-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Within the Friday-evening / Saturday window?
        id: w
        run: |
          WS="$(TZ='America/Denver' date -d 'next monday' +%F)"
          echo "key=editor-docx-sent-$WS" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "manual=true" >> "$GITHUB_OUTPUT"; echo "inwin=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          DOW="$(TZ='America/Denver' date +%u)"; H=$((10#$(TZ='America/Denver' date +%H)))
          if { [ "$DOW" = "5" ] && [ "$H" -ge 18 ]; } || { [ "$DOW" = "6" ] && [ "$H" -lt 14 ]; }; then
            echo "inwin=true" >> "$GITHUB_OUTPUT"
          else
            echo "Denver weekday=$DOW hour=$H — outside Fri 6 PM to Sat 2 PM, skipping"
          fi

      - name: Already sent this week?
        id: sent
        if: steps.w.outputs.inwin == 'true' && steps.w.outputs.manual != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .editor-docx-sent
          key: ${{ steps.w.outputs.key }}
          lookup-only: true

      - name: Decide
        id: g
        run: |
          if [ "${{ steps.w.outputs.inwin }}" != "true" ]; then exit 0; fi
          if [ "${{ steps.sent.outputs.cache-hit }}" = "true" ]; then echo "This week's copy already went out (${{ steps.w.outputs.key }}) — skipping"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.g.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.g.outputs.go == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: steps.g.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: Render next week's text and build the Word document
        if: steps.g.outputs.go == 'true'
        id: build
        env:
          WEEK_START_INPUT: ${{ github.event.inputs.week_start }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # the intro is written the same way as Monday's
        run: |
          set -eo pipefail
          pip install -q python-docx==1.1.2
          T=$(date +%s)
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-data.js?t=$T"    -o /tmp/gd.js
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-helpers.js?t=$T" -o /tmp/gh.js
          WS="${WEEK_START_INPUT:-$(TZ='America/Denver' date -d 'next monday' +%F)}"
          LABEL="$(date -u -d "$WS" '+%B %-d') – $(date -u -d "$WS +6 days" '+%B %-d, %Y')"
          EDITOR_JSON=/tmp/editor.json node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WS" "$LABEL" /tmp/week.html
          FILE="Week-Ahead-$WS.docx"
          python3 scripts/editor-docx.py /tmp/editor.json "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Email the Word document
        if: steps.g.outputs.go == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          to: ${{ github.event.inputs.to || 'john@metzger.com' }}
          cc: info@livabletelluride.org
          subject: 'Week Ahead text for editing: ${{ steps.build.outputs.label }}'
          body: |
            John,

            Attached is the text for next week's Week Ahead email (${{ steps.build.outputs.label }}): the intro, every public meeting, and every event with its suggested wording.

            Please edit directly in the document (Track Changes is welcome) and send it back. Morgan will update the newsletter online from your edits before it goes out Monday morning.

            Thanks,
            Livable Telluride
          attachments: ${{ steps.build.outputs.file }}

      - name: Mark this week as sent
        if: steps.g.outputs.go == 'true' && github.event.inputs.to == ''
        run: mkdir -p .editor-docx-sent && date -u +%FT%TZ > .editor-docx-sent/at
      - uses: actions/cache/save@v4
        if: steps.g.outputs.go == 'true' && github.event.inputs.to == ''
        continue-on-error: true
        with:
          path: .editor-docx-sent
          key: ${{ steps.w.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: steps.g.outputs.go == 'true'
        with:
          name: editor-docx
          path: ${{ steps.build.outputs.file }}
