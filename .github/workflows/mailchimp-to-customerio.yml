name: Migrate — Mailchimp → Customer.io

# One-click subscriber migration for the Customer.io trial. Exports the
# Mailchimp audience and identifies each person in Customer.io with matching
# topic/subscription attributes. DRY RUN by default — review the mapping in the
# logs, then re-run with dry_run=false to actually import. Does NOT send email
# and does NOT touch Mailchimp (read-only there). Mailchimp stays live.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (map + tally only, write nothing to Customer.io)'
        required: true
        default: 'true'
      limit:
        description: 'Cap people processed (0 = all). Use a small number for a first live test.'
        required: false
        default: '0'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run migration
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY_NEW || secrets.MAILCHIMP_API_KEY }}
          CUSTOMERIO_SITE_ID: ${{ secrets.CUSTOMERIO_SITE_ID }}
          CUSTOMERIO_TRACK_API_KEY: ${{ secrets.CUSTOMERIO_TRACK_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/mailchimp-to-customerio.js
