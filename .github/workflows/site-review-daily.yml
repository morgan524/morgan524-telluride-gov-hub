name: Site Review (daily checks)

# Daily deterministic full-site review — per-page broken links, console/JS errors,
# accessibility (axe, incl. contrast), broken images, SEO/meta — across every
# public page, fanned out on one headless browser. No AI (≈free). Updates a
# single rolling issue ("🔎 Daily site review") instead of opening a new one.
#
# Runs in the cloud, so it does NOT depend on any local machine being awake.
# Reviews the deployed production site. The weekly AI sweep is a separate workflow.

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ≈ 7am Mountain (cron is UTC; ~6am in winter / DST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-review-daily
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: cd scripts && npm install
      - name: Install Chromium
        run: cd scripts && npx playwright install chromium --with-deps
      - name: Run deterministic site review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/review/review-site.js --no-ai --issue-title "🔎 Daily site review" 2>&1 | tee /tmp/site-review-daily.log

      # 2026-07-22 audit P0-4: a crashed review run previously died silently —
      # indistinguishable from "reviewed, found nothing".
      - name: CI Health issue (open on failure / close on recovery)
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Daily site review workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
