name: Digest Refresh

# Regenerates the Digest Review Desk's content from live site data and commits
# it, so digest-review.html always shows the UPCOMING sends:
#   - weekly  = the coming Mon–Sun (the Monday "Week Ahead")
#   - weekend = the coming Fri–Sun (the Friday "Weekend Ahead", events only)
# Runs daily; also dispatchable. Commits only when the rendered output changes.
on:
  schedule:
    - cron: '0 13 * * *'   # daily 13:00 UTC (~7am Mountain)
    - cron: '45 15 * * 0'  # Sunday 15:45 UTC — freshen the Review Desk draft
                           # right before the 10:00 AM Sunday weekly review email
    - cron: '45 19 * * 4'  # Thu 19:45 UTC (1:45 PM MDT) — freshen right before
    - cron: '45 20 * * 4'  # Thu 20:45 UTC (1:45 PM MST)   the 2:00 PM Thu weekend
                           #   review email (weekend-preview.yml). Idempotent:
                           #   commits only if the render changed, so running
                           #   both DST twins is harmless. (Wed→Thu 2026-07-23
                           #   with the weekend send moving Thu→Fri.)
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # ci-health-issue failure tracker

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render digests + manifest from live data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Rick-voice lede generation
        run: |
          set -eo pipefail
          # Cache-bust (?t=timestamp) so we always get the freshest data, not a
          # CDN-cached copy, and -f so a site outage fails the run loudly instead
          # of feeding an error page to node.
          T=$(date +%s)
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-data.js?t=$T"    -o /tmp/gd.js
          curl -fsS --retry 3 "https://livabletelluride.org/js/gov-helpers.js?t=$T" -o /tmp/gh.js
          WK=$(date -u -d "monday" +%F)     # coming Monday (today if Mon)
          WE=$(date -u -d "friday" +%F)     # coming Friday (today if Fri)
          WK_LABEL="$(date -u -d "$WK" '+%B %-d') - $(date -u -d "$WK +6 days" '+%B %-d, %Y')"
          WE_LABEL="$(date -u -d "$WE" '+%B %-d') - $(date -u -d "$WE +2 days" '+%B %-d, %Y')"

          # ── Freeze/lock support ──
          # If digest/<key>.lock.json exists and its weekStart matches the coming
          # Monday/Friday, a human has APPROVED that digest on the Review Desk —
          # do NOT re-render it (that would change the lede or swap events after
          # approval). A lock whose weekStart no longer matches is stale (the week
          # rolled over): delete it and render fresh.
          lock_ws() { if [ -f "$1" ]; then python3 -c "import json;print(json.load(open('$1')).get('weekStart',''))" 2>/dev/null || true; fi; }
          lock_subj() { python3 -c "import json;print(json.load(open('$1')).get('subject',''))" 2>/dev/null || true; }

          WK_SUBJ_LOCK=""
          if [ "$(lock_ws digest/weekly.lock.json)" = "$WK" ]; then
            echo "week digest LOCKED for $WK — preserving the approved version"
            WK_SUBJ_LOCK="$(lock_subj digest/weekly.lock.json)"
          else
            rm -f digest/weekly.lock.json
            node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WK" "$WK_LABEL" digest/week.html
          fi

          WE_SUBJ_LOCK=""
          if [ "$(lock_ws digest/weekend.lock.json)" = "$WE" ]; then
            echo "weekend digest LOCKED for $WE — preserving the approved version"
            WE_SUBJ_LOCK="$(lock_subj digest/weekend.lock.json)"
          else
            rm -f digest/weekend.lock.json
            WEEKEND=1 node scripts/weekly-email.js /tmp/gd.js /tmp/gh.js "$WE" "$WE_LABEL" digest/weekend.html
          fi

          export WK_SUBJ="${WK_SUBJ_LOCK:-The Week Ahead Outlook - $WK_LABEL}"
          export WE_SUBJ="${WE_SUBJ_LOCK:-The Weekend Ahead Outlook - $WE_LABEL}"
          export WK_COV="Mon $(date -u -d "$WK" '+%b %-d') to Sun $(date -u -d "$WK +6 days" '+%b %-d, %Y')"
          export WE_COV="Fri $(date -u -d "$WE" '+%b %-d') to Sun $(date -u -d "$WE +2 days" '+%b %-d, %Y')"
          export WK WE   # ISO weekStart per digest → the desk passes it to /save so the lock matches
          export GEN="$(date -u '+%Y-%m-%d %H:%M UTC')"
          python3 - <<'PY'
          import json, os
          m={"generated":os.environ["GEN"],"digests":{
            "weekly":{"name":"The Week Ahead Outlook","subject":os.environ["WK_SUBJ"],"covers":os.environ["WK_COV"],"weekStart":os.environ["WK"],"audience":"Weekly Update","file":"digest/week.html"},
            "weekend":{"name":"The Weekend Ahead Outlook","subject":os.environ["WE_SUBJ"],"covers":os.environ["WE_COV"],"weekStart":os.environ["WE"],"audience":"Weekly Update","file":"digest/weekend.html"}}}
          open("digest/manifest.json","w").write(json.dumps(m,indent=2)+"\n")
          print("manifest:",os.environ["WK_SUBJ"],"|",os.environ["WE_SUBJ"])
          PY
      - name: Commit if changed
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git add -A digest/   # -A so a deleted (stale) lock file is staged too
          if git diff --cached --quiet; then
            echo "no digest changes"
          else
            git commit -m "Digest refresh $(date -u +%F)"
            # Rebase + retry so a bot commit landing between checkout and push
            # (e.g. a late content-refresh) doesn't make the push fail silently.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "push attempt $i failed; retrying"; sleep 10; }
            done
          fi

      - name: CI health issue
        if: always()
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Digest Refresh workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
