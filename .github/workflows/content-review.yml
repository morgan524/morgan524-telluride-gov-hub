name: Daily Content Review

# Content-correctness review of the live data (events, meetings, news, notices,
# housing): duplicate events, wrong/past/conflicting dates, broken/malformed
# links, garbled text, low-quality summaries, plus an optional AI semantic pass.
#
# REPORT-ONLY — never edits site content (content-refresh.js rewrites
# js/gov-helpers.js every 6h, so fixes belong at the source). Findings are
# turned into ONE auto-refreshing GitHub issue that auto-closes on a clean run,
# mirroring the maintenance.yml / content-refresh.yml issue pattern.
#
# Runs 1 hour after EACH 6-hour content-refresh (which runs at 0,6,12,18 UTC
# and completes in ~6-9 min) so every refresh's output gets reviewed, not just
# the morning's. EXCEPTION-ONLY email: the owner is emailed (info@) only when a
# finding needs a human decision, evaluated once a day on the 13:00 run — plus a
# light Monday weekly digest as a paper trail. Auto-fixable issues never become
# email; content-refresh.js fixes them at the source (sanitizeRecords +
# filterMvConflicts). The other three runs just keep the GitHub issue current.
on:
  schedule:
    - cron: '0 1,7,13,19 * * *'   # 1h after each content-refresh (00/06/12/18 UTC); 13:00 = morning email run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  content-review:
    runs-on: ubuntu-latest
    env:
      # Morning email digest (reuses the weekly-preview SMTP secrets). If unset,
      # the email is skipped and the GitHub issue remains the channel.
      PREVIEW_SMTP_PASS: ${{ secrets.PREVIEW_SMTP_PASS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run content review
        env:
          # Enables the AI semantic pass. Same key the content-refresh bot uses
          # for meeting summaries. If absent, the deterministic checks still run
          # and the AI pass is skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node scripts/content-review.js 2>&1 | tee /tmp/content-review.log

      # Turn content-review-findings.log into a single, auto-managed issue.
      # Opens/refreshes when there are findings; closes on the first clean run.
      - name: Findings issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🧭 Daily content review findings'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -s content-review-findings.log ]; then
            BODY=$(printf 'The daily content review found issues as of %s:\n\n```\n%s\n```\nRun: %s\n\nThese are content-correctness checks (duplicate events, wrong/past/conflicting dates, broken/malformed links, garbled text, summary quality) plus an optional AI pass. **Report-only** — fixes are applied by a human/Claude at the source. This issue refreshes each run and auto-closes on the first clean run. See docs/content-review.md.' "$NOW" "$(cat content-review-findings.log)" "$RUN_URL")
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            fi
          else
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "✅ Content review clean as of $NOW. Closing."
            fi
          fi
          exit 0

      # EXCEPTION-ONLY email policy. The owner is emailed only when something
      # needs them. Decision (evaluated once a day, on the 13:00 UTC run or a
      # manual dispatch — the other three runs just refresh the issue):
      #   • action items present (content-review-actionable.log non-empty)
      #       → send an "action needed" email.
      #   • else if Monday → send a light weekly digest (status + paper trail).
      #   • else → send NOTHING (silent on normal/advisory-only days).
      # Auto-fixable issues (exact dups, scheme-less links, MV wrong-dates) are
      # fixed at the source by content-refresh.js, so they never become email.
      - name: Decide + build email
        id: email
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(date -u +%H); DOW=$(date -u +%u); NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          echo "send=false" >> "$GITHUB_OUTPUT"
          if [ "$HOUR" != "13" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Not the 13:00 decision run ($HOUR:00 UTC) — issue refreshed, no email."; exit 0
          fi
          ISSUE_LINK=$(printf '<p><a href="%s/%s/issues?q=is%%3Aissue+is%%3Aopen+content+review">Open the findings issue →</a></p>' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY")
          if [ -s content-review-actionable.log ]; then
            N=$(sed -n '2p' content-review-actionable.log | grep -oE '^[0-9]+' || echo '')
            echo "subject=🔧 Livable Telluride — content review needs you${N:+ ($N)}" >> "$GITHUB_OUTPUT"
            {
              printf '<p>The content review found item(s) that need your judgment as of %s. The rest were either auto-fixed by the bot or are low-priority advisories (see the GitHub issue).</p>' "$NOW"
              printf '<pre style="font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:#f6f8fa;padding:14px;border-radius:8px;border:1px solid #e1e4e8">'
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' content-review-actionable.log
              printf '</pre>%s' "$ISSUE_LINK"
            } > content-review-email.html
            echo "send=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "1" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "subject=🗓️ Livable Telluride — weekly content review digest (no action needed)" >> "$GITHUB_OUTPUT"
            {
              printf '<p><b>Nothing needs you</b> as of %s. ✅ This is your weekly paper trail.</p>' "$NOW"
              printf '<p>The bot reviews content 4×/day and auto-fixes duplicate events, scheme-less links, wrong-year dates, joint-meeting double-listings, and Mountain Village wrong-date copies. You only get an email when something needs a human decision.</p>'
              if [ -s content-review-findings.log ]; then
                printf '<p>Current low-priority advisories (FYI only — no action required):</p><pre style="font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:#f6f8fa;padding:14px;border-radius:8px;border:1px solid #e1e4e8">'
                sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' content-review-findings.log
                printf '</pre>%s' "$ISSUE_LINK"
              fi
            } > content-review-email.html
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "No action items and not Monday — staying silent. ✅"
          fi

      - name: Email to info@
        if: steps.email.outputs.send == 'true' && env.PREVIEW_SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          subject: ${{ steps.email.outputs.subject }}
          to: info@livabletelluride.org
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          html_body: file://content-review-email.html

      - name: Note when email isn't configured
        if: steps.email.outputs.send == 'true' && env.PREVIEW_SMTP_PASS == ''
        run: echo "::warning::PREVIEW_SMTP_PASS not set — skipped the morning email. The GitHub issue still has the findings."

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: content-review-logs-${{ github.run_id }}
          path: |
            /tmp/content-review.log
            content-review-findings.log
            content-review-findings.json
            content-review-actionable.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Content Review workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled Daily Content Review workflow failed (the script itself crashed, not merely findings).\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Content Review workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
