name: Digest Sunday Review

# Early-Sunday review of both Monday digests (Week Ahead + Past Meetings), then
# a freeze until Monday afternoon (Morgan, 2026-10-04):
#   1. render both digests fresh from the latest data (digest-refresh.yml),
#   2. review them with scripts/digest-review.js — every link fetched, every
#      date badge checked against its weekday and window, recap links checked,
#      plus an editorial read by Claude — and commit the report to
#      digest/review.{md,html,json},
#   3. write digest/freeze.json: until Monday 21:00 UTC (3 PM MDT / 2 PM MST)
#      digest-refresh.yml will not re-render either digest, so what Morgan
#      reviews Sunday afternoon is what was reviewed. Review Desk edits and
#      approvals still save (they go through the digest Worker, not the bot),
#   4. email the report to info@.
# Report only: it never edits a digest. Fix findings at the Review Desk.
on:
  schedule:
    - cron: '0 11 * * 0'   # Sun 11:00 UTC = 5:00 AM MDT (summer)
    - cron: '0 12 * * 0'   # Sun 12:00 UTC = 5:00 AM MST (winter)
  workflow_dispatch:
    inputs:
      freeze:
        description: 'Freeze the digests until Monday afternoon after reviewing (true/false)'
        required: false
        default: 'true'
      email:
        description: 'Email the report to info@ (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write
  issues: write

concurrency:
  group: digest-sunday-review
  cancel-in-progress: false

jobs:
  # DST guard: exactly one of the cron pair lands on 5:00 AM in Denver.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOUR="$(TZ='America/Denver' date +%H)"
          if [ "$HOUR" = "05" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Denver hour=$HOUR (not 05) — DST twin, skipping"; echo "go=false" >> "$GITHUB_OUTPUT"; fi

  render:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    uses: ./.github/workflows/digest-refresh.yml
    with:
      force: 'true'
    secrets: inherit

  review:
    needs: render
    runs-on: ubuntu-latest
    env:
      PREVIEW_SMTP_PASS: ${{ secrets.PREVIEW_SMTP_PASS }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the render job just committed the fresh digests to main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Freeze window
        id: win
        run: |
          WK="$(python3 -c "import json;print(json.load(open('digest/manifest.json'))['digests']['weekly']['weekStart'])")"
          echo "until=${WK}T21:00:00Z" >> "$GITHUB_OUTPUT"
          echo "week=$WK" >> "$GITHUB_OUTPUT"

      - name: Review both digests
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RSS_PROXY_URL: ${{ secrets.RSS_PROXY_URL }}   # link checks for hosts that block GitHub IPs
          FROZEN_UNTIL: ${{ (github.event.inputs.freeze || 'true') == 'true' && 'Monday afternoon (3 PM MT)' || 'not frozen (manual test run)' }}
        run: |
          set -o pipefail
          node scripts/digest-review.js digest | tee /tmp/review.log
          echo "issues=$(sed -n 's/^ISSUES=//p' /tmp/review.log)" >> "$GITHUB_OUTPUT"
          echo "high=$(sed -n 's/^HIGH=//p' /tmp/review.log)" >> "$GITHUB_OUTPUT"

      - name: Write the freeze
        if: (github.event.inputs.freeze || 'true') == 'true'
        env:
          UNTIL: ${{ steps.win.outputs.until }}
          WK: ${{ steps.win.outputs.week }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          json.dump({"frozenAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "until": os.environ["UNTIL"], "weekStart": os.environ["WK"],
                     "reason": "Sunday review (digest-sunday-review.yml): the bot will not re-render the digests until this time. Review Desk edits still save."},
                    open("digest/freeze.json", "w"), indent=2)
          PY
          cat digest/freeze.json

      - name: Commit report (+ freeze)
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git add digest/review.md digest/review.html digest/review.json
          [ -f digest/freeze.json ] && git add digest/freeze.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Sunday digest review ${{ steps.win.outputs.week }}: ${{ steps.review.outputs.issues }} issue(s)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || { echo "push attempt $i failed; retrying"; sleep 10; }; done

      - name: Email the report to info@livabletelluride.org
        if: env.PREVIEW_SMTP_PASS != '' && (github.event.inputs.email || 'true') == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.PREVIEW_SMTP_USER }}
          password: ${{ secrets.PREVIEW_SMTP_PASS }}
          subject: "Digest review for ${{ steps.win.outputs.week }}: ${{ steps.review.outputs.issues }} issue(s), ${{ steps.review.outputs.high }} high"
          to: info@livabletelluride.org
          from: Livable Telluride <${{ secrets.PREVIEW_SMTP_USER }}>
          html_body: file://digest/review.html

      - name: CI health issue
        if: always()
        uses: ./.github/actions/ci-health-issue
        with:
          title: '🚨 Digest Sunday Review workflow is failing'
          status: ${{ job.status }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
