name: Festival Ticket Status Check

on:
  schedule:
    # Every Monday at 10:00 UTC (4am Mountain Time)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

permissions:
  contents: write
  issues: write   # for the failure-tracker step

jobs:
  ticket-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run festival ticket status check
        run: |
          set -o pipefail
          node scripts/festival-ticket-check.js 2>&1 | tee /tmp/festival-ticket-check.log

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git add js/gov-data.js
          git commit -m "🎟️ Festival ticket status update $(date -u +'%Y-%m-%d')

          Automated weekly check: updated ticketStatus/promo for changed festivals"
          git pull --rebase origin main
          git push

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-ticket-check-logs-${{ github.run_id }}
          path: '/tmp/*.log'
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Festival Ticket Check workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled Festival Ticket Check workflow failed.\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Festival Ticket Check workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
