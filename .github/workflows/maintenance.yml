name: Daily Maintenance

on:
  schedule:
    # Daily at 12:30 UTC (6:30am Mountain). Offset 30 min past content-refresh's
    # 12:00 slot so the two don't rewrite gov-helpers.js simultaneously — a
    # concurrent whole-array rewrite can't be textually rebase-merged, so the
    # loser's push would fail and its work would be silently lost.
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run daily maintenance
        run: |
          set -o pipefail
          node scripts/maintenance.js 2>&1 | tee /tmp/maintenance.log

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git add -A
          git commit -m "🧹 Daily maintenance $(date -u +'%Y-%m-%d')

          Automated: expired notice cleanup, stale news removal, link check, file parity"
          git pull --rebase origin main
          git push

      # Liveness/health findings (feed freshness, events sheet, and the
      # weekly-email staleness tripwire) land in maintenance-issues.log. Open or
      # refresh a dedicated issue so they're actually seen — a missed weekly send
      # used to surface only as a log ::warning:: nobody reads.
      - name: Report issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🩺 Maintenance liveness/health findings'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -f maintenance-issues.log ]; then
            echo "::warning::Maintenance found issues — check the log"
            cat maintenance-issues.log
          fi
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -s maintenance-issues.log ]; then
            BODY=$(printf 'Daily maintenance liveness/health checks flagged the following as of %s:\n\n```\n%s\n```\nRun: %s\n\nThese are off-machine pipeline signals (feed freshness, events sheet reachability, weekly-email send staleness). This issue refreshes each run and auto-closes on the first clean run.' "$NOW" "$(cat maintenance-issues.log)" "$RUN_URL")
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body "$BODY"; else gh issue create --title "$ISSUE_TITLE" --body "$BODY"; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "✅ Liveness/health checks clean as of $NOW. Closing."
          fi
          exit 0

      # Deterministic daily review (JS syntax / broken assets / nav drift).
      # scripts/maintenance.js writes review-findings.log when it finds
      # something; this opens or refreshes a dedicated GitHub issue with the
      # current findings, and closes it on the first clean run.
      - name: Daily review findings issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🔎 Daily website review findings'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -s review-findings.log ]; then
            BODY=$(printf 'The daily deterministic review (scripts/maintenance.js) found issues as of %s:\n\n```\n%s\n```\nRun: %s\n\nThese are pass/fail checks — JS syntax, broken internal links / missing assets, and top-nav drift. This issue refreshes each run and auto-closes on the first clean run.' "$NOW" "$(cat review-findings.log)" "$RUN_URL")
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            fi
          else
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "✅ Daily review clean as of $NOW. Closing."
            fi
          fi
          exit 0

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maintenance-logs-${{ github.run_id }}
          path: |
            /tmp/*.log
            maintenance-issues.log
            review-findings.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Maintenance workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled Daily Maintenance workflow failed.\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Maintenance workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
