name: Daily Maintenance

on:
  schedule:
    # Daily at 12:00 UTC (6am Mountain)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run daily maintenance
        env:
          # Optional. When present, the liveness checks confirm that the
          # Mailchimp RSS-driven digest campaigns are still running. Without
          # it, the campaign-paused check is skipped (and logs an ℹ note).
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: node scripts/maintenance.js 2>&1 | tee maintenance.log

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Gov Hub Bot"
          git config user.email "bot@livabletelluride.org"
          git add -A
          git commit -m "🧹 Daily maintenance $(date -u +'%Y-%m-%d')

          Automated: expired notice cleanup, stale news removal, link check, file parity"
          git push

      - name: Report issues
        if: always()
        run: |
          if [ -f maintenance-issues.log ]; then
            echo "::warning::Maintenance found issues — check the log"
            cat maintenance-issues.log
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-logs-${{ github.run_id }}
          path: |
            *.log
            maintenance-issues.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update CI Health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Maintenance workflow is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled Daily Maintenance workflow failed.\n\nFirst observed: %s\nRun: %s\n\nLogs are attached to the run as an artifact. This issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
          exit 0

      - name: Close CI Health issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: '🚨 Daily Maintenance workflow is failing'
        run: |
          set +e
          NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$NUM"
          fi
          exit 0
