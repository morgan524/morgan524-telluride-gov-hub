name: CI Health Issue
description: >
  Open one CI-Health issue on failure, comment on repeat failures (no duplicate
  issues), and auto-close it when the workflow recovers. Call once at the end of a
  job with if:always() and pass the job status input. Factored out of the
  copy-pasted failure-tracker blocks so scheduled workflows that commit or send
  email don't fail silently. Requires permissions issues:write on the caller
  and a prior actions/checkout (this is a local composite action).
  NOTE: do not put GitHub expression syntax in these description strings — the
  manifest loader evaluates it and job/secrets contexts aren't available here.

inputs:
  title:
    description: Issue title (unique per workflow, e.g. "🚨 Digest Refresh workflow is failing")
    required: true
  status:
    description: The job status — pass the job.status context from the caller
    required: true
  run-url:
    description: URL of the failing run
    required: true
  github-token:
    description: Token with issues write scope (pass the GITHUB_TOKEN secret)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ inputs.title }}
        JOB_STATUS: ${{ inputs.status }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        set +e  # never let the tracker itself fail the job
        NUM=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
        NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
        if [ "$JOB_STATUS" = "success" ]; then
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Workflow recovered at $NOW. Closing."
            gh issue close "$NUM"
          fi
        else
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another failure at $NOW. Run: $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" \
              --body "$(printf 'The scheduled workflow failed.\n\nFirst observed: %s\nRun: %s\n\nThis issue auto-closes when the next run succeeds.' "$NOW" "$RUN_URL")"
          fi
        fi
        exit 0
