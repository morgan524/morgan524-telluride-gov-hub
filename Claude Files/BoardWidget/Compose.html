<!DOCTYPE html>
<!--
  Compose.html — "New matter" dialog (served via HtmlService.createHtmlOutputFromFile).
  Static HTML + client JS. On submit it reads any attached file to base64 and calls
  google.script.run.createAndSend(title, fullText, manualSummary, docName, docMime, docB64).
-->
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --fg:#2D4A3E; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         margin:0; padding:18px 20px; color:#1f2937; font-size:13px; }
  h2 { margin:0 0 4px; color:var(--fg); font-size:18px; }
  p.sub { margin:0 0 16px; color:#6b7280; font-size:12px; }
  label { display:block; font-weight:600; margin:14px 0 4px; color:#374151; }
  .hint { font-weight:400; color:#9ca3af; font-size:11px; }
  input[type=text], textarea {
    width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:7px;
    font-size:13px; font-family:inherit; resize:vertical; }
  textarea { min-height:90px; }
  input[type=file] { font-size:12px; margin-top:4px; }
  .row-actions { margin-top:20px; display:flex; gap:10px; align-items:center; }
  button {
    background:var(--fg); color:#fff; border:0; border-radius:8px;
    padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  button.secondary { background:#e5e7eb; color:#374151; }
  button:disabled { opacity:.55; cursor:default; }
  #status { margin-top:16px; font-size:13px; white-space:pre-wrap; line-height:1.5;
            padding:12px 14px; border-radius:8px; display:none; }
  #status.ok  { display:block; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; }
  #status.err { display:block; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid #ffffff7a;
          border-top-color:#fff; border-radius:50%; animation:s .8s linear infinite;
          vertical-align:-2px; margin-right:7px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <h2>New board matter</h2>
  <p class="sub">Sends a personalized Yes / No / Abstain ballot to everyone on the Board tab.</p>

  <form id="f" onsubmit="return false;">
    <label>Title <span class="hint">— short name shown in the email subject</span></label>
    <input type="text" id="title" placeholder="e.g. Approve 2026 operating budget" autofocus>

    <label>Matter text <span class="hint">— the full motion / description members read &amp; the basis for the summary</span></label>
    <textarea id="fullText" placeholder="Paste the motion, resolution, or description here…"></textarea>

    <label>Document to attach <span class="hint">— optional (PDF, etc.; keep under ~24 MB)</span></label>
    <input type="file" id="doc">

    <label>Summary override <span class="hint">— optional; leave blank to auto-summarize</span></label>
    <textarea id="manualSummary" placeholder="Leave blank to generate a summary from the matter text."></textarea>

    <div class="row-actions">
      <button id="send" type="button" onclick="submit_()">Create &amp; send ballot</button>
      <button class="secondary" type="button" onclick="google.script.host.close()">Cancel</button>
    </div>
  </form>

  <div id="status"></div>

<script>
  function setStatus(cls, msg) {
    var el = document.getElementById('status');
    el.className = cls;
    el.innerHTML = msg;
  }
  function busy(on, label) {
    var b = document.getElementById('send');
    b.disabled = on;
    b.innerHTML = on ? '<span class="spin"></span>' + (label || 'Sending…') : 'Create &amp; send ballot';
  }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  function fire(title, fullText, manualSummary, docName, docMime, docB64) {
    google.script.run
      .withSuccessHandler(function (res) {
        busy(false);
        setStatus('ok', escapeHtml(res));
        // clear form so an accidental second click doesn't double-send
        document.getElementById('f').reset();
      })
      .withFailureHandler(function (err) {
        busy(false);
        setStatus('err', '⚠️ ' + escapeHtml(err && err.message ? err.message : err));
      })
      .createAndSend(title, fullText, manualSummary, docName, docMime, docB64);
  }

  function submit_() {
    var title = document.getElementById('title').value;
    var fullText = document.getElementById('fullText').value;
    var manualSummary = document.getElementById('manualSummary').value;
    if (!title.trim()) { setStatus('err', 'Please enter a title for the matter.'); return; }

    busy(true, 'Sending…');
    var fileInput = document.getElementById('doc');
    var file = fileInput.files && fileInput.files[0];
    if (file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var b64 = String(e.target.result).split(',')[1] || '';
        fire(title, fullText, manualSummary, file.name, file.type, b64);
      };
      reader.onerror = function () { busy(false); setStatus('err', 'Could not read the attached file.'); };
      reader.readAsDataURL(file);
    } else {
      fire(title, fullText, manualSummary, '', '', '');
    }
  }

  // --- Auto-fill a standard approval motion from the chosen document ---
  var lastAutoMotion = '';
  function docBaseName(name) { return String(name).replace(/\.[^.]+$/, '').trim(); }
  function buildMotion(docName) {
    var d = '"' + docBaseName(docName) + '"';
    return 'WHEREAS the Board of Directors of Livable Telluride has reviewed ' + d + ';\n\n' +
      'WHEREAS the Board finds that approving this matter is consistent with the organization\'s mission and in the best interest of Livable Telluride;\n\n' +
      'NOW, THEREFORE, BE IT RESOLVED that the Board of Directors hereby approves ' + d + ', in the form presented to the Board and attached as the accompanying document; and\n\n' +
      'BE IT FURTHER RESOLVED that the officers of Livable Telluride are authorized and directed to take all actions reasonably necessary to carry out the intent of this resolution.';
  }
  document.getElementById('doc').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var ta = document.getElementById('fullText');
    // Only auto-fill if the box is empty or still holds a previously auto-generated
    // motion -- never clobber text the user typed or edited themselves.
    if (!ta.value.trim() || ta.value.trim() === lastAutoMotion.trim()) {
      var motion = buildMotion(f.name);
      ta.value = motion;
      lastAutoMotion = motion;
    }
    // Suggest a title if none has been entered yet.
    var titleEl = document.getElementById('title');
    if (!titleEl.value.trim()) titleEl.value = 'Approve ' + docBaseName(f.name);
  });
</script>
</body>
</html>
