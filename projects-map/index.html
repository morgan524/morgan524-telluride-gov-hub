<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valley Project Map — Livable Telluride</title>
  <meta name="description" content="An interactive map showing how separate public decisions add up across San Miguel County, Colorado.">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-left">
    <h1>Valley Project Map</h1>
    <p>How separate public decisions add up · San Miguel County, CO</p>
  </div>
  <a id="submit-missing"
     href="mailto:info@livabletelluride.org?subject=Missing%20project%20for%20the%20Valley%20Map&body=Project%20name%3A%0ALocation%3A%0AWhat's%20happening%3A%0ASource%20or%20link%3A"
     target="_blank">
    + Submit Missing Project
  </a>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT PANEL -->
  <div id="left-panel">

    <!-- Search -->
    <div id="search-box">
      <input id="search-input" type="search" placeholder="Search projects, issues, locations…" autocomplete="off">
    </div>

    <!-- Filters -->
    <div id="filters">
      <div class="filter-section">
        <div class="filter-label">Project Type</div>
        <div class="filter-chips" id="filter-type"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Status</div>
        <div class="filter-chips" id="filter-status"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Community Area</div>
        <div class="filter-chips" id="filter-area"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Source Confidence</div>
        <div class="filter-chips" id="filter-confidence"></div>
      </div>
    </div>

    <!-- Project List -->
    <div id="project-list">
      <div class="no-results">Loading projects…</div>
    </div>

  </div><!-- /left-panel -->

  <!-- MAP AREA -->
  <div id="map-wrapper">
    <div id="map"></div>

    <!-- Preset View Buttons -->
    <div id="preset-buttons"></div>

    <!-- 3D Massing Toggle -->
    <div id="massing-toggle-bar">
      <label class="massing-toggle-label">
        <input type="checkbox" id="toggleMassing">
        <span class="massing-toggle-icon">🏗</span>
        Show 3D proposed massing
      </label>
      <div id="massing-disclaimer">
        Approximate massing — not architectural plans. See source confidence in each project.
      </div>
    </div>

    <!-- Legend -->
    <div id="legend">
      <h4>Pin Status</h4>
      <div id="legend-items"></div>
      <div id="massing-legend-section" style="display:none">
        <h4 style="margin-top:10px;margin-bottom:4px;font-size:0.7rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b">3D Massing</h4>
      </div>
    </div>

    <!-- Right Drawer (populated by JS) -->
    <div id="drawer"></div>

  </div><!-- /map-wrapper -->

</div><!-- /main -->

<script src="js/app.js"></script>
</body>
</html>
