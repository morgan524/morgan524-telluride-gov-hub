<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Document — Livable Telluride</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      background: #2d2d2d;
      color: #1a2e29;
    }
    .doc-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid rgba(33,68,60,0.15);
    }
    .doc-bar a.home { display: inline-flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .doc-bar a.home img { height: 40px; width: auto; }
    .doc-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1a2e29;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doc-sub { font-weight: 500; font-size: 0.78rem; color: #6a7a75; }
    .doc-actions { display: flex; gap: 10px; flex-shrink: 0; }
    .doc-actions a {
      font-size: 0.8rem; font-weight: 600; text-decoration: none;
      padding: 7px 14px; border-radius: 999px; white-space: nowrap;
    }
    .doc-actions a.primary { background: #21443c; color: #fff; }
    .doc-actions a.ghost { border: 1px solid rgba(33,68,60,0.25); color: #21443c; }
    .doc-frame { flex: 1 1 auto; width: 100%; border: 0; background: #2d2d2d; }
    .doc-missing { color: #fff; padding: 40px; text-align: center; font-size: 1rem; }
    .doc-missing a { color: #9ecbb5; }
  </style>
</head>
<body>
  <div class="doc-bar">
    <a class="home" href="/" aria-label="Livable Telluride home">
      <img src="/logo/Livable Telluride Logo.png" alt="Livable Telluride">
    </a>
    <div class="doc-title" id="docTitle">Source Document <span class="doc-sub" id="docSub"></span></div>
    <div class="doc-actions" id="docActions"></div>
  </div>
  <iframe class="doc-frame" id="docFrame" title="Source document viewer"></iframe>

  <script>
  // Whitelisted primary-source documents (filename in /source-documents/ → display title).
  // Only these can be loaded — prevents the viewer from embedding arbitrary URLs.
  var DOCS = {
    'voodoo-bond-certificates.pdf': 'VooDoo Bond Certificates (Series 2022A, 2022B, 2023)',
    'voodoo-moral-obligation-resolution-23-2022.pdf': 'Town Council Resolution No. 23 (2022) — VooDoo Moral Obligation',
    'canyonlands-bond.pdf': 'CanyonLands / Tower House Bond Document (WI-PFA, 2024)',
    '2025-10-09-town-council-budget-packet.pdf': 'Town Council Budget Meeting Packet — Oct. 9, 2025'
  };
  (function () {
    var params = new URLSearchParams(location.search);
    var doc = params.get('doc') || '';
    var frame = document.getElementById('docFrame');
    var titleEl = document.getElementById('docTitle');
    var subEl = document.getElementById('docSub');
    var actions = document.getElementById('docActions');
    if (Object.prototype.hasOwnProperty.call(DOCS, doc)) {
      var path = '/source-documents/' + doc;
      var title = DOCS[doc];
      document.title = title + ' — Livable Telluride';
      titleEl.firstChild.textContent = title + ' ';
      subEl.textContent = 'Primary source document';
      frame.src = path;
      actions.innerHTML =
        '<a class="ghost" href="/Blog%20Posts/the-growing-weight-of-tellurides-debt/">← Back to debt report</a>' +
        '<a class="primary" href="' + path + '" target="_blank" rel="noopener">Open / Download PDF</a>';
    } else {
      frame.outerHTML = '<div class="doc-missing">Document not found. ' +
        '<a href="/">Return to Livable Telluride</a></div>';
      titleEl.firstChild.textContent = 'Document not found ';
    }
  })();
  </script>

</body>
</html>
