<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Housing — Livable Telluride</title>
  <style>
    :root {
      --forest: #21443c;
      --forest-soft: #2a5347;
      --accent-green: #2f7a5f;
      --accent-green-soft: rgba(47, 122, 95, 0.12);
      --accent-green-border: rgba(47, 122, 95, 0.25);
      --bg-warm: #fdfbf6;
      --bg-hero: #efe9dc;
      --bg-paper: #fffdf9;
      --bg-elig: #f4d9d2;       /* warm pink-cream — eligibility card from mockup */
      --bg-elig-border: #e8b8ad;
      --text-primary: #1a2e29;
      --text-secondary: #4a5e57;
      --text-muted: #7a8a85;
      --border-soft: rgba(33, 68, 60, 0.12);
      --border-card: rgba(33, 68, 60, 0.10);
      --shadow-card: 0 4px 18px rgba(36, 49, 46, 0.10);
      --font-heading: 'Georgia', 'Times New Roman', serif;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: var(--font-main); color: var(--text-primary); background: var(--bg-warm); line-height: 1.5; }

    /* ── Top nav (shared with other v2 pages) ── */
    .topnav { background: #fff; border-bottom: 1px solid var(--border-soft); padding: 14px 0; position: sticky; top: 0; z-index: 50; }
    .topnav-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 24px; }
    .topnav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--forest); font-family: var(--font-heading); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
    .topnav-logo img { height: 80px; width: auto; object-fit: contain; }
    .topnav-links { display: flex; gap: 14px; margin-left: 16px; flex: 1; }
    .topnav-links a {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-primary); text-decoration: none; font-weight: 600; font-size: 0.76rem; white-space: nowrap; padding: 6px 2px; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    .topnav-links a:hover { color: var(--forest); }
    .topnav-links a.active { color: var(--forest); border-bottom-color: var(--forest); }
    .topnav-cta { display: inline-block; background: var(--forest); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }

    /* ── Hero ── shared cream/warm overlay treatment, matches Local News */
    .hero {
      background:
        linear-gradient(180deg, rgba(239, 233, 220, 0.78) 0%, rgba(239, 233, 220, 0.45) 55%, rgba(239, 233, 220, 0.20) 100%),
        url('img/wilson-peak.png') no-repeat center center / cover,
        var(--bg-hero);
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border-soft);
      min-height: 200px;
    }
    .hero h1 { text-shadow: 0 1px 2px rgba(255,255,255,0.6); }
    .hero p  { text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    .hero-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    .hero h1 { margin: 0 0 8px; font-family: var(--font-heading); font-size: 2.6rem; color: var(--text-primary); }
    .hero p { margin: 0; color: var(--text-secondary); font-size: 1.05rem; max-width: 760px; }

    /* ── Sidebar filter panel ── */
    .filter-panel {
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .filter-panel-heading {
      padding: 12px 16px 10px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
    }
    .filter-group { padding: 6px 0; }
    .filter-group + .filter-group { border-top: 1px solid var(--border-soft); }
    .filter-group-label {
      padding: 8px 16px 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .filter-opt {
      display: block;
      width: 100%;
      padding: 9px 16px;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background 0.12s, color 0.12s;
      border-radius: 0;
    }
    .filter-opt:hover { background: var(--accent-green-soft); color: var(--forest); }
    .filter-opt.active { background: var(--forest); color: #fff; }

    /* ── Main page layout ── */
    .page-wrap {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ── Left sidebar ── */
    .sidebar { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 110px; }

    /* Eligibility card (cream-pink, matches mockup) */
    .elig-card {
      background: var(--bg-elig);
      border: 1px solid var(--bg-elig-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-card);
    }
    .elig-card h3 {
      font-family: var(--font-heading);
      color: var(--forest);
      font-size: 1.1rem;
      margin: 0 0 8px;
      line-height: 1.25;
    }
    .elig-card p {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin: 0 0 14px;
    }
    .elig-btn {
      display: inline-block;
      background: var(--forest);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .elig-btn:hover { background: var(--forest-soft); }

    /* Decorative pine tree below eligibility card (CSS-drawn) */
    .pine-deco {
      text-align: center;
      padding: 28px 0;
      font-size: 4rem;
      line-height: 1;
      color: var(--accent-green);
      opacity: 0.55;
    }

    /* ── Housing card grid ── */
    .house-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .house-card {
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .house-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg-sidebar, #ece5d5);
      overflow: hidden;
    }
    .house-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .house-img-wrap .house-map {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .type-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--forest);
      color: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .type-pill.sale { background: var(--forest); }
    .type-pill.tax { background: #5a7e6a; }

    .house-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .house-title-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .house-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.3;
    }
    .house-price {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      color: var(--forest);
      font-weight: 700;
    }
    .house-beds {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .house-summary {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .house-source {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .house-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
      flex-wrap: wrap;
    }
    .house-actions-left  { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .house-actions-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-action {
      display: inline-block;
      background: var(--forest);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .btn-action:hover { background: var(--forest-soft); }
    .btn-action.secondary {
      background: var(--accent-green-soft);
      color: var(--forest);
      border: 1px solid var(--accent-green-border);
    }
    .btn-action.secondary:hover { background: rgba(47, 122, 95, 0.20); }

    /* Apply Now — primary green CTA for lottery listings */
    .btn-apply {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--forest);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .btn-apply:hover { background: var(--forest-soft); }
    .btn-apply svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.4; fill: none; }

    /* Icon-only contact buttons */
    .btn-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green-border);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--forest);
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-icon:hover { background: rgba(47, 122, 95, 0.22); }
    .btn-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Lottery block — sits above the actions row when l.lottery is true */
    .lottery-block {
      background: linear-gradient(135deg, rgba(185, 78, 44, 0.06), rgba(181, 138, 44, 0.06));
      border: 1px solid rgba(185, 78, 44, 0.20);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 4px;
    }
    .lottery-banner {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b94e2c;
      margin-bottom: 6px;
    }
    .lottery-block dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(110px, max-content) 1fr;
      gap: 4px 10px;
      font-size: 0.82rem;
    }
    .lottery-block dt {
      color: var(--text-muted);
      font-weight: 600;
    }
    .lottery-block dd {
      margin: 0;
      color: var(--text-secondary);
    }
    .lottery-block dd strong { color: var(--text-primary); }

    .house-address {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 1080px) {
      .house-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 880px) {
      .topnav-links { display: none; }
      .hero h1 { font-size: 1.9rem; }
      .page-wrap { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  
    /* ── Translate widget + mobile nav (added 2026-05-18) ── */
    .topnav-translate { display: inline-flex; align-items: center; margin-right: 10px; }
    .topnav-translate .goog-te-gadget { font-size: 0 !important; line-height: 1; }
    .topnav-translate .goog-te-gadget-simple {
      background: transparent !important;
      border: 1px solid #d4dad0 !important;
      border-radius: 999px !important;
      padding: 7px 14px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      font-size: 0.82rem !important;
      cursor: pointer;
      line-height: 1.2 !important;
    }
    .topnav-translate .goog-te-gadget-simple .goog-te-menu-value { color: #2d4a3e !important; }
    .topnav-translate .goog-te-gadget-simple .goog-te-menu-value span { color: #2d4a3e !important; border: none !important; }
    .topnav-translate img.goog-te-gadget-icon { display: none !important; }
    .topnav-translate-reset {
      display: none; background: transparent; border: 1px solid #d4dad0;
      border-radius: 999px; padding: 7px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.78rem; cursor: pointer; color: #2d4a3e;
      margin-right: 10px; line-height: 1.2;
    }
    .topnav-translate-reset:hover { background: #f3f5ef; }
    body.translated-ltr .topnav-translate-reset,
    body.translated-rtl .topnav-translate-reset { display: inline-block; }
    body { top: 0 !important; }
    .goog-te-banner-frame, .skiptranslate iframe.goog-te-banner-frame { display: none !important; visibility: hidden !important; }
    .goog-tooltip, .goog-tooltip:hover { display: none !important; }
    .goog-text-highlight { background: none !important; box-shadow: none !important; }

    .topnav-hamburger {
      display: none; background: none; border: none; cursor: pointer;
      font-size: 1.5rem; line-height: 1; padding: 4px 8px; color: #2d4a3e;
    }
    .topnav-hamburger:focus { outline: 2px solid #2d4a3e; outline-offset: 2px; }

    @media (max-width: 860px) {
      .topnav-inner { position: relative; flex-wrap: nowrap; }
      .topnav-links {
        display: none !important;
        position: absolute; top: calc(100% + 1px); left: 0; right: 0;
        background: #fff; flex-direction: column !important; gap: 0 !important;
        padding: 8px 0; margin: 0 !important;
        border-top: 1px solid #d4dad0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        z-index: 60;
      }
      .topnav-links.open { display: flex !important; }
      .topnav-links a {
        padding: 14px 24px !important; border-bottom: 1px solid #f0f0ec !important;
        font-size: 1rem !important;
      }
      .topnav-links a:last-child { border-bottom: none !important; }
      .topnav-hamburger { display: block; }
      .topnav-translate { margin-right: 6px; }
      .topnav-translate .goog-te-gadget-simple { padding: 5px 10px !important; font-size: 0.75rem !important; }
      .topnav-cta { display: none !important; }
    }

  </style>
</head>

    <div class="topnav-inner">
      <a class="topnav-logo" href="/" aria-label="Livable Telluride home">
        <img src="https://livabletelluride.org/logo/Livable%20Telluride%20Logo.png" alt="Livable Telluride" onerror="this.style.display='none'">
      </a>
      <nav class="topnav-links">
        <a href="/local-news.html">Local News</a>

        <a href="/deep-dives.html">Deep Dives</a>

        <a href="/local-orgs.html">Local Orgs</a>

      <div id="google_translate_element" class="topnav-translate"></div>

      <a class="topnav-cta" href="/hub-bub.html#signup">Subscribe</a>
      <button class="topnav-hamburger" aria-label="Open navigation menu" aria-expanded="false" id="topnavHamburger" type="button">☰</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Housing</h1>
      <p>Local rentals, deed-restricted ownership opportunities, tax-credit listings, and housing-program information for Telluride, Mountain Village, and the surrounding region.</p>
    </div>
  </section>

  <main class="page-wrap">
    <aside class="sidebar">
      <div class="filter-panel" id="filterPanel"></div>
      <div class="pine-deco" aria-hidden="true">🌲</div>
    </aside>

    <section>
      <div class="house-grid" id="houseGrid"></div>
    </section>
  </main>

  <script>
    /* ── Sample data — falls back to this if /js/gov-helpers.js isn't loaded.
       Real data comes from HOUSING_LISTINGS via loadLiveHousing(). ───── */
    const SAMPLE_LISTINGS = [
      {
        title: 'Alabama Apartments — 2 Bed',
        type: 'rent',
        typeLabel: 'For Rent',
        price: '$1,375/month',
        beds: '2 Bedroom, 1 Bath',
        location: 'Telluride',
        summary: 'Bright apartment in walking distance of Main Street. Income-qualified deed-restricted rental. Pet-friendly, washer/dryer in unit.',
        source: 'SMRHA',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=800&h=450&fit=crop'
      },
      {
        title: 'River Trail Townhome',
        type: 'sale',
        typeLabel: 'For Sale',
        price: '$465,000',
        beds: '3 Bedroom, 2 Bath',
        location: 'Mountain Village',
        summary: 'Deed-restricted ownership opportunity with peak views, attached garage, ski-area access, and recent kitchen update.',
        source: 'SMRHA',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800&h=450&fit=crop'
      },
      {
        title: 'Cornet House Studio',
        type: 'rent',
        typeLabel: 'For Rent',
        price: '$2,000/month',
        beds: 'Studio, 1 Bath',
        location: 'Telluride',
        summary: 'Charming studio in the historic district. Walking distance to gondola, restaurants, and trails. Heat included.',
        source: 'Telluride Foundation',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=800&h=450&fit=crop'
      },
      {
        title: 'Lulu City Place — 3 Bed',
        type: 'sale',
        typeLabel: 'For Sale',
        price: '$1,490,000',
        beds: '3 Bedroom, 2 Bath',
        location: 'Mountain Village',
        summary: 'Spacious mountain-modern with vaulted ceilings, two-car garage, in-floor heat, and direct gondola access.',
        source: 'SMRHA',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800&h=450&fit=crop'
      },
      {
        title: 'West Meadows Home',
        type: 'sale',
        typeLabel: 'For Sale',
        price: '$595,000',
        beds: '2 Bedroom, 1.5 Bath',
        location: 'Telluride',
        summary: 'Single-family home with fenced yard, mountain views, sun-filled living room, and detached studio.',
        source: 'SMRHA',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=800&h=450&fit=crop'
      },
      {
        title: 'Aspen View Condo',
        type: 'rent',
        typeLabel: 'For Rent',
        price: '$3,500/month',
        beds: '2 Bedroom, 2 Bath',
        location: 'Mountain Village',
        summary: 'Furnished condo with ski-area access, hot tub privileges, mountain views, and underground parking.',
        source: 'Private',
        url: 'https://smrha.org/',
        img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&h=450&fit=crop'
      }
    ];

    /* ── Filter taxonomy ── */
    const FILTERS = [
      { key: 'all',         label: 'All Listings' },
      { key: 'rent',        label: 'Deed Restricted For Rent' },
      { key: 'sale',        label: 'Deed Restricted For Sale' },
      { key: 'lottery',     label: 'Lottery' },
      { key: 'tell',        label: 'Telluride' },
      { key: 'mv',          label: 'Mountain Village' },
      { key: 'norwood',     label: 'Norwood' },
      { key: 'placerville', label: 'Placerville' },
      { key: 'ophir',       label: 'Ophir' }
    ];

    let LISTINGS = SAMPLE_LISTINGS.slice();
    let activeFilter = 'all';

    /* ── Sidebar filter panel ── */
    const TYPE_FILTERS = FILTERS.slice(0, 4);   // All, Rent, Sale, Lottery
    const LOC_FILTERS  = FILTERS.slice(4);       // Telluride … Ophir

    function sidebarHtml() {
      // Only show a filter chip when at least one current listing matches it
      // (except "All", always shown). Prevents dead chips like "Lottery" or
      // "Norwood" that would always render an empty list. Re-runs on every
      // render(), so chips reappear automatically if matching data arrives.
      function visible(f) {
        return f.key === 'all' || LISTINGS.some(function(l) { return matchesFilter(l, f.key); });
      }
      function opt(f) {
        const cls = f.key === activeFilter ? 'filter-opt active' : 'filter-opt';
        return '<button class="' + cls + '" data-filter="' + f.key + '">' + f.label + '</button>';
      }
      const typeChips = TYPE_FILTERS.filter(visible).map(opt).join('');
      const locChips  = LOC_FILTERS.filter(visible).map(opt).join('');
      let html = '<div class="filter-panel-heading">Filter Listings</div>'
        + '<div class="filter-group">' + typeChips + '</div>';
      if (locChips) {
        html += '<div class="filter-group"><div class="filter-group-label">By Location</div>'
          + locChips + '</div>';
      }
      return html;
    }

    /* ── Location-specific eligibility URL ── */
    function eligibilityUrl(l) {
      const text = ((l.address || '') + ' ' + (l.location || '')).toLowerCase();
      if (/pinion park|norwood/.test(text))          return 'https://smrha.org/pinion-park/';
      if (/telluride/.test(text) && !/mountain village/.test(text)) return 'https://smrha.org/town-of-telluride/';
      return 'https://smrha.org/san-miguel-county/';
    }

    function matchesFilter(l, key) {
      const loc = (l.location || '');
      if (key === 'all') return true;
      if (key === 'rent') return /rent/i.test(l.type);
      if (key === 'sale') return /sale/i.test(l.type);
      if (key === 'lottery') return l.lottery === true;
      if (key === 'tell') return /telluride/i.test(loc) && !/mountain village/i.test(loc);
      if (key === 'mv')          return /mountain village/i.test(loc);
      if (key === 'norwood')     return /norwood/i.test(loc);
      if (key === 'placerville') return /placerville/i.test(loc);
      if (key === 'ophir')       return /ophir/i.test(loc);
      return true;
    }

    function pillClass(type) {
      if (/sale/i.test(type)) return 'type-pill sale';
      if (/tax/i.test(type))  return 'type-pill tax';
      return 'type-pill';
    }

    function houseCard(l) {
      // Visual top of card: map (if we have lat/lng), else photo (if any), else nothing.
      let visualHtml = '';
      if (l.lat != null && l.lng != null) {
        const bbox = (l.lng - 0.008) + ',' + (l.lat - 0.005) + ',' + (l.lng + 0.008) + ',' + (l.lat + 0.005);
        const mapSrc = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox
          + '&layer=mapnik&marker=' + l.lat + ',' + l.lng;
        visualHtml = '<iframe class="house-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" '
          + 'src="' + mapSrc + '" title="Map: ' + (l.title || '') + '"></iframe>';
      } else if (l.img) {
        visualHtml = '<img src="' + l.img + '" alt="' + (l.title || '') + '" onerror="this.style.display=\'none\'">';
      }
      const pill = '<span class="' + pillClass(l.type) + '">' + (l.typeLabel || l.type || 'Available') + '</span>';
      // Strip redundant "(deed-restricted)" and tier suffix from price — type pill already conveys that
      const priceClean = (l.price || '').replace(/,?\s*deed[-\s]?restricted/gi, '').replace(/\s*\(\s*\)\s*$/, '').trim();
      const price = priceClean ? '<div class="house-price">' + priceClean + '</div>' : '';
      const beds = l.beds ? '<div class="house-beds">' + l.beds + (l.location ? ' • ' + l.location : '') + '</div>' : '';
      const addrLine = l.address ? '<div class="house-address">📍 ' + l.address + '</div>' : '';
      const summary = l.summary ? '<p class="house-summary">' + l.summary + '</p>' : '';
      const source = l.source ? '<div class="house-source">Source: ' + l.source + '</div>' : '';

      // Lottery block — only when l.lottery is true and we have at least a deadline
      let lotteryHtml = '';
      if (l.lottery && (l.deadline || l.drawingDate || l.eligibility)) {
        const rows = [];
        if (l.deadline)        rows.push('<dt>Application due</dt><dd><strong>' + l.deadline + '</strong></dd>');
        if (l.drawingDate)     rows.push('<dt>Lottery drawing</dt><dd>' + l.drawingDate + '</dd>');
        if (l.drawingLocation) rows.push('<dt>Drawing location</dt><dd>' + l.drawingLocation + '</dd>');
        if (l.eligibility)     rows.push('<dt>Eligibility</dt><dd>' + l.eligibility + '</dd>');
        lotteryHtml = '<div class="lottery-block">'
                    +   '<div class="lottery-banner">🎲 Lottery — Applications Open</div>'
                    +   '<dl>' + rows.join('') + '</dl>'
                    + '</div>';
      }

      // Action row — left group: View Details + Check Eligibility; right group: phone + email icons
      const leftBtns = [];
      leftBtns.push('<a class="btn-action" href="' + (l.url || '#') + '" target="_blank" rel="noopener">View Details →</a>');
      leftBtns.push('<a class="btn-action secondary" href="' + eligibilityUrl(l) + '" target="_blank" rel="noopener">Check Eligibility →</a>');

      const rightBtns = [];
      if (l.contact && l.contact.phone) {
        const tel = l.contact.phone.replace(/[^+\d]/g, '');
        rightBtns.push('<a class="btn-icon" href="tel:' + tel + '" aria-label="Call ' + l.contact.phone + '" title="' + l.contact.phone + '">'
          + '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg></a>');
      }
      if (l.contact && l.contact.email) {
        rightBtns.push('<a class="btn-icon" href="mailto:' + l.contact.email + '" aria-label="Email ' + l.contact.email + '" title="' + l.contact.email + '">'
          + '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>');
      }

      const actionsHtml = '<div class="house-actions">'
        + '<div class="house-actions-left">' + leftBtns.join('') + '</div>'
        + (rightBtns.length ? '<div class="house-actions-right">' + rightBtns.join('') + '</div>' : '')
        + '</div>';

      return '<article class="house-card">'
           + '<div class="house-img-wrap">' + pill + visualHtml + '</div>'
           + '<div class="house-body">'
           +   '<div class="house-title-row">'
           +     '<h2 class="house-title">' + l.title + '</h2>'
           +     price
           +   '</div>'
           +   beds + addrLine + summary + lotteryHtml + source
           +   actionsHtml
           + '</div>'
           + '</article>';
    }

    function render() {
      document.getElementById('filterPanel').innerHTML = sidebarHtml();
      const filtered = LISTINGS.filter(l => matchesFilter(l, activeFilter));
      const grid = document.getElementById('houseGrid');
      grid.innerHTML = filtered.length
        ? filtered.map(houseCard).join('')
        : '<div class="empty">No listings match this filter.</div>';

      document.querySelectorAll('.filter-opt[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          render();
        });
      });
    }
    render();

    /* ── Live data: pulls HOUSING_LISTINGS from /js/gov-helpers.js. ────────
       The deployed const has fields {title, type, lottery, address,
       beds, price, source, url, applyUrl, deadline, eligibility, note,
       lat, lng, ...}. We map to our card schema. ── */
    function detectTypeLabel(t) {
      if (/rent/i.test(t)) return 'For Rent';
      if (/sale/i.test(t)) return 'For Sale';
      if (/tax/i.test(t)) return 'Tax Credit';
      return (t || '').replace(/^./, c => c.toUpperCase());
    }
    function locationFromAddress(addr) {
      if (!addr) return '';
      if (/mountain village/i.test(addr)) return 'Mountain Village';
      if (/telluride/i.test(addr)) return 'Telluride';
      if (/norwood/i.test(addr)) return 'Norwood';
      if (/ridgway/i.test(addr)) return 'Ridgway';
      if (/ouray/i.test(addr)) return 'Ouray';
      const m = addr.match(/,\s*([A-Za-z ]+),\s*CO/);
      return m ? m[1].trim() : '';
    }

    function loadLiveHousing() {


      const dataScript = document.createElement('script');
      dataScript.src = 'https://livabletelluride.org/js/gov-data.js?v=' + Math.floor(Date.now()/600000);
      dataScript.onload = () => {
        const s = document.createElement('script');
        s.src = 'https://livabletelluride.org/js/gov-helpers.js?v=' + Math.floor(Date.now()/600000);
        s.onload = () => {
          try {
            if (typeof HOUSING_LISTINGS === 'undefined' || !Array.isArray(HOUSING_LISTINGS)) return;
            const live = HOUSING_LISTINGS.map(l => ({
              title: (l.title || '').replace(/^[^\w]*\s/, '').replace(/\s*\(deed[-\s]?restricted\)\s*$/i, ''),  // strip emoji + redundant "(Deed-Restricted)"
              type: l.type || '',
              typeLabel: detectTypeLabel(l.type),
              lottery: l.lottery === true,
              price: l.price || '',
              beds: l.beds || '',
              address: l.address || '',                              // full street address
              location: locationFromAddress(l.address) || '',         // town label for filter
              lat: typeof l.lat === 'number' ? l.lat : null,          // for inline map
              lng: typeof l.lng === 'number' ? l.lng : null,
              summary: l.note || '',                                  // body summary only
              eligibility: l.eligibility || '',                       // shown in lottery block
              deadline: l.deadline || '',
              drawingDate: l.drawingDate || '',
              drawingLocation: l.drawingLocation || '',
              source: l.source || 'SMRHA',
              url: l.url || '#',                                      // primary listing URL
              applyUrl: l.applyUrl || '',                             // distinct apply URL (lottery)
              contact: l.contact || null,                             // {phone, email}
              img: ''
            }));
            if (live.length > 0) {
              LISTINGS = live;
              render();
            }
          } catch (err) { console.warn('loadLiveHousing failed:', err); }
        };
        s.onerror = () => console.warn('Could not load /js/gov-helpers.js for housing');
        document.head.appendChild(s);
      };
      dataScript.onerror = () => console.warn('Could not load gov-data.js');
      document.head.appendChild(dataScript);
    }
    loadLiveHousing();
  </script>

<script>
function lvResetTranslation() {
  var expires = '=; expires=Thu, 01 Jan 1970 00:00:00 GMT';
  var domains = ['', '.' + location.hostname, location.hostname];
  domains.forEach(function(d){
    var c = 'googtrans' + expires + '; path=/';
    if (d) c += '; domain=' + d;
    document.cookie = c;
  });
  location.reload();
}
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'es,fr,de,zh-CN,zh-TW,ja,ko,ar,ru,pt,it,vi,hi,nl,pl,tr,uk,sv,no,da,fi,el,he,th,id',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');
}
(function(){
  var s = document.createElement('script');
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  s.async = true;
  document.head.appendChild(s);
})();
(function(){
  function init(){
    var btn = document.getElementById('topnavHamburger');
    if (!btn) return;
    var links = document.querySelector('.topnav-links');
    if (!links) return;
    btn.addEventListener('click', function(){
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '✕' : '☰';
    });
    // close drawer when a link is clicked
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        btn.textContent = '☰';
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
