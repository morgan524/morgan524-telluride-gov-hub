<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gov-Hub — Livable Telluride</title>
<meta name="description" content="Every public meeting in the region — agendas, plain-English summaries, Zoom links, and how to comment — for the next month.">
<link rel="stylesheet" href="lt.css?v=8">
<link rel="icon" href="/logo/icon-192.png">
<link rel="apple-touch-icon" href="/logo/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="canonical" href="https://livabletelluride.org/gov-hub.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Livable Telluride">
<meta property="og:url" content="https://livabletelluride.org/gov-hub.html">
<meta property="og:title" content="Gov-Hub — Livable Telluride">
<meta property="og:description" content="Every public meeting in the region — agendas, plain-English summaries, Zoom links, and how to comment — for the next month.">
<meta property="og:image" content="https://livabletelluride.org/logo/Livable%20Telluride%20Logo.png">
<style>
  /* Upcoming | Past toggle */
  .gh-toggle-wrap { max-width: var(--maxw); margin: 0 auto; padding: 26px var(--pad-x) 0; }
  .gh-toggle { display: inline-flex; background: var(--sage2); border: 1px solid var(--hairline); border-radius: 999px; padding: 4px; gap: 4px; }
  .gh-toggle .gt { font: 600 15px/1 var(--sans); color: var(--forest); padding: 9px 18px; border-radius: 999px; }
  .gh-toggle .gt.active { background: var(--forest); color: #fff; }
  .gh-toggle a.gt:hover { background: var(--sage); color: var(--forest); }
  /* Two-column shell: meeting list + right entity-filter sidebar */
  .gh-layout { max-width: var(--maxw); margin: 0 auto; padding: 12px var(--pad-x) 20px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
  .gh-side { position: sticky; top: 96px; }
  .side-filter { padding: 20px 22px; }
  .side-filter h3 { font: 600 20px/1.2 var(--serif); margin: 0 0 10px; }
  .ents { display: block; }
  .ent { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 9px 2px; border-top: 1px solid var(--hairline); cursor: pointer; }
  .ent:first-child { border-top: 0; }
  .ent .e-name { font: 600 15px/1.25 var(--sans); color: var(--forest); }
  .ent:hover .e-name { color: var(--rust); }
  .ent.active .e-name { color: var(--rust); }
  .ent .e-count { font: 700 11.5px/1 var(--sans); color: var(--muted2); background: var(--sage2); border: 1px solid var(--hairline); border-radius: 999px; padding: 5px 9px; }
  .ent.active .e-count { background: var(--forest); border-color: var(--forest); color: #fff; }
  .meet-wrap { min-width: 0; }
  .day-h { font: italic 500 21px/1.3 var(--serif); color: var(--muted); margin: 30px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--forest); }
  .m-card { display: grid; grid-template-columns: 96px 1fr; gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--hairline); }
  .m-date { text-align: center; }
  .m-date .m { font: 800 10.5px/1 var(--sans); letter-spacing: .08em; color: var(--rust); text-transform: uppercase; }
  .m-date .d { font: 600 34px/1.05 var(--serif); color: var(--forest); }
  .m-date .e-logo { width: 88px; height: 88px; margin: 12px auto 0; border-radius: 10px; background: #fff; border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; padding: 6px; }
  .m-date .e-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .m-card .src { font: 600 12px/1.4 var(--sans); color: var(--muted); margin-left: 8px; }
  .m-card h3 { font: 600 23px/1.2 var(--serif); margin: 7px 0 6px; }
  .m-card .summ { font: 400 15.5px/1.62 var(--sans); color: var(--body2); margin: 0 0 10px; }
  .m-card .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .m-card .acts .cbtn { display: inline-block; background: var(--forest); color: #fff; font: 600 12px/1 var(--sans); padding: 7px 14px; border-radius: 5px; }
  .m-card .acts .cbtn:hover { background: #1c3a33; color: #fff; }
  .m-card .acts .abtn { display: inline-block; font: 600 12px/1 var(--sans); color: var(--forest); border: 1.5px solid var(--forest); padding: 6px 12px; border-radius: 5px; }
  .m-card .acts .abtn:hover { background: var(--sage2); color: var(--forest); }
  /* Solid green = a real agenda/packet is posted; grey ghost = not yet */
  .m-card .acts .abtn.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
  .m-card .acts .abtn.primary:hover { background: #1c3a33; color: #fff; }
  .m-card .acts .abtn.empty { border-color: var(--hairline); color: var(--muted2); background: var(--sage2); cursor: default; }
  .m-card .acts .abtn.zoom { border-color: #2d64a8; color: #2d64a8; }
  .m-card .acts .abtn.zoom:hover { background: #eef3fa; }
  .m-card .acts .abtn.live { border-color: #a0463d; color: #a0463d; }
  .m-card .acts .abtn.live:hover { background: #f9efee; }
  .zoomline { font: 500 15px/1.6 var(--sans); color: var(--muted); margin-top: 8px; }
  @media (max-width: 900px) {
    .gh-layout { grid-template-columns: 1fr; gap: 0; }
    .gh-side { position: static; order: -1; }
    .side-filter { padding: 14px 16px; }
    .ents { display: flex; flex-wrap: wrap; gap: 8px; }
    .ent { width: auto; border: 1px solid var(--hairline); border-radius: 999px; padding: 7px 8px 7px 13px; }
    .ent:first-child { border-top: 1px solid var(--hairline); }
    .ent.active { background: var(--sage); border-color: var(--forest); }
    .m-card { grid-template-columns: 72px 1fr; }
    .m-date .e-logo { width: 64px; height: 64px; }
  }
</style>
</head>
<body>
<div id="lt-header"></div>

<header class="masthead">
  <img class="masthead-art" src="uploads/wilson-peak.png" alt="" aria-hidden="true">
  <div class="masthead-fade"></div>
  <div class="masthead-inner">
    <div class="crumb">Act <span class="sep">&rsaquo;</span> Gov-Hub</div>
    <h1>Gov-Hub</h1>
    <p class="sub">Every public meeting in the region for the next month &mdash; agendas, plain-English summaries, Zoom links, and how to make your voice heard.</p>
  </div>
</header>

<div class="gh-toggle-wrap">
  <div class="gh-toggle" role="tablist">
    <span class="gt active">Upcoming meetings</span>
    <a class="gt" href="gov-hub-past.html">Past meetings &amp; recaps</a>
  </div>
</div>

<div class="gh-layout">
  <main class="meet-wrap" id="meet-list"><p class="meta" style="padding:18px 0">Loading meetings&hellip;</p></main>
  <aside class="gh-side">
    <div class="side-filter card">
      <h3>Public entities</h3>
      <div class="ents" id="ent-filter" aria-label="Filter by public entity"></div>
    </div>
  </aside>
</div>

<div id="lt-footer"></div>
<script src="site.js?v=7"></script>
<script src="/js/lt-data.js?v=5"></script>
<script>
(function () {
  var list = document.getElementById('meet-list');
  if (!window.LTData) { list.innerHTML = '<div class="lt-data-error">This section failed to load. Please refresh in a minute.</div>'; return; }
  var esc = LTData.esc, safe = LTData.safeUrl;
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var meetings = [], srcFilter = '';

  // Public Entities — always ALL listed (even zero-count), logos from /logo/.
  // Keys match week-meetings.json `source`; labels match its sourceLabel.
  // Labels/order for the filter; logo URLs come from the shared LTData map.
  var ENTITIES = [
    { key: 'fire',      label: 'Fire Protection' },
    { key: 'mv',        label: 'Mountain Village' },
    { key: 'ouray',     label: 'Ouray County' },
    { key: 'county',    label: 'San Miguel County' },
    { key: 'school',    label: 'School District R-1' },
    { key: 'smart',     label: 'SMART Transit' },
    { key: 'airport',   label: 'Telluride Regional Airport' },
    { key: 'med',       label: 'Telluride Regional Medical Center' },
    { key: 'norwood',   label: 'Town of Norwood' },
    { key: 'ophir',     label: 'Town of Ophir' },
    { key: 'rico',      label: 'Town of Rico' },
    { key: 'ridgway',   label: 'Town of Ridgway' },
    { key: 'telluride', label: 'Town of Telluride' }
  ];
  var LOGO_BY_KEY = LTData.ENTITY_LOGOS;

  /* Bold proper-noun runs + standalone street addresses in summaries — the
     same emphasizeNames heuristic as the live Gov-Hub cards and the digest. */
  var NAME_STOP = {}; ('The A An On In At As It This That These Those Its Their And But Or If After Before During While Also Both Two Three Four Five Several Additional Other Following New Council Board Commission Committee Ordinance Ordinances Resolution Resolutions Meeting Session Sessions Town County City District State Chair Mayor Public Staff Members Member Consent Agenda Work Executive Regular Special Substantial Councilors January February March April May June July August September October November December Monday Tuesday Wednesday Thursday Friday Saturday Sunday Section Stage Phase Article Item Step Unit No Yes Accommodations Building Buildings Preliminary Large Scale').split(' ').forEach(function (w) { NAME_STOP[w] = 1; });
  var ADDR = '\\d+\\s+(?:(?:N|S|E|W|NE|NW|SE|SW|North|South|East|West)\\.?\\s+[A-Z][A-Za-z’\']*(?:\\s+[A-Z][A-Za-z’\']*)*(?:\\s+(?:Ave|Avenue|St|Street|Rd|Road|Dr|Drive|Blvd|Boulevard|Ln|Lane|Way|Ct|Court|Pl|Place|Cir|Circle|Trail|Trl|Pkwy|Parkway|Hwy|Highway))?|[A-Z][A-Za-z’\']*(?:\\s+[A-Z][A-Za-z’\']*)*\\s+(?:Ave|Avenue|St|Street|Rd|Road|Dr|Drive|Blvd|Boulevard|Ln|Lane|Way|Ct|Court|Pl|Place|Cir|Circle|Trail|Trl|Pkwy|Parkway|Hwy|Highway))';
  var RUN = "[A-Z][a-z]+(?:['’][A-Za-z]+)?(?:\\s+(?:of|the|[A-Z][a-z]+(?:['’][A-Za-z]+)?))*";
  function emphasizeNames(raw) {
    var re = new RegExp('(' + ADDR + ')|(' + RUN + ')', 'g');
    var html = '', last = 0, m;
    while ((m = re.exec(raw)) !== null) {
      html += esc(raw.slice(last, m.index));
      if (m[1]) {
        var locates = /\b(?:at|on)\s+$/i.test(raw.slice(0, m.index));
        html += locates ? esc(m[1]) : '<strong>' + esc(m[1]) + '</strong>';
        last = m.index + m[1].length; continue;
      }
      var run = m[2], trimmed = run.replace(/(?:\s+(?:of|the))+$/, '');
      var tail = run.slice(trimmed.length), leadThe = '';
      if (/\s/.test(trimmed)) { var t = trimmed.match(/^(The\s+)(?=[A-Z])/); if (t) { leadThe = t[1]; trimmed = trimmed.slice(leadThe.length); } }
      var multi = /\s/.test(trimmed);
      var before = raw.slice(0, m.index).replace(/\s+$/, '');
      var sentenceStart = before === '' || /[.!?]$/.test(before);
      var sig = trimmed.split(/\s+/).filter(function (w) { return !/^(?:of|the)$/i.test(w); });
      var allStop = sig.length > 0 && sig.every(function (w) { return NAME_STOP[w]; });
      var bold = !allStop && (multi || (!sentenceStart && !NAME_STOP[trimmed]));
      html += esc(leadThe) + (bold ? '<strong>' + esc(trimmed) + '</strong>' : esc(trimmed)) + esc(tail);
      last = m.index + run.length;
    }
    return html + esc(raw.slice(last));
  }

  function commentMailto(m) {
    // Same subject format as the live Gov-Hub so clerks see a consistent inbox.
    var subject = 'Written comments: ' + (m.title || 'Meeting') + ' — ' + (m.date || '');
    return 'mailto:' + encodeURIComponent(m.commentEmail) + '?subject=' + encodeURIComponent(subject);
  }
  function render() {
    var rows = meetings.filter(function (m) { return !srcFilter || m.source === srcFilter; });
    if (!rows.length) {
      var name = (ENTITIES.filter(function (e) { return e.key === srcFilter; })[0] || {}).label || 'this entity';
      list.innerHTML = '<p class="meta" style="padding:18px 0">No meetings scheduled for ' + esc(name) + ' in the next two weeks.</p>';
      return;
    }
    var html = '', lastDate = '';
    rows.forEach(function (m) {
      if (m.date !== lastDate) {
        html += '<div class="day-h">' + LTData.fmtDate(m.date, { weekday: 'long', month: 'long', day: 'numeric' }) + '</div>';
        lastDate = m.date;
      }
      var d = LTData.parseDateKey(m.date);
      var logo = LOGO_BY_KEY[m.source]
        ? '<div class="e-logo"><img src="' + esc(LOGO_BY_KEY[m.source]) + '" alt="' + esc(m.sourceLabel) + '" loading="lazy"></div>' : '';
      // Action row — live-Gov-Hub parity: View Agenda goes solid green when a
      // real agenda is posted (m.hasAgenda), outline when the link is just a
      // calendar page; Agenda Packet is always present — solid green download
      // when posted, grey non-clickable ghost when not yet.
      var acts = '';
      if (m.commentEmail) acts += '<a class="cbtn" href="' + esc(commentMailto(m)) + '">&#9993;&#65039; Submit Comment</a>';
      if (m.agendaUrl) acts += '<a class="abtn' + (m.hasAgenda ? ' primary' : '') + '" href="' + esc(safe(m.agendaUrl)) + '" target="_blank" rel="noopener">View Agenda &rarr;</a>';
      acts += m.packetUrl
        ? '<a class="abtn primary" href="' + esc(safe(m.packetUrl)) + '" download target="_blank" rel="noopener">&#128230; Agenda Packet &darr;</a>'
        : '<span class="abtn empty" title="Agenda packet not yet posted" aria-disabled="true">&#128230; Agenda Packet</span>';
      if (m.zoomLink) acts += '<a class="abtn zoom" href="' + esc(safe(m.zoomLink)) + '" target="_blank" rel="noopener">&#128249; Join Zoom</a>';
      if (m.livestream) acts += '<a class="abtn live" href="' + esc(safe(m.livestream)) + '" target="_blank" rel="noopener">&#9654; Livestream</a>';
      if (!m.agendaUrl && m.link) acts += '<a class="abtn" href="' + esc(safe(m.link)) + '" target="_blank" rel="noopener">Meeting info</a>';
      // Zoom access details inline whenever present (Meeting ID + Passcode + Phone).
      var zoomBits = [];
      if (m.zoomMeetingId) zoomBits.push('<strong>Meeting ID:</strong> ' + esc(m.zoomMeetingId));
      if (m.zoomPasscode) zoomBits.push('<strong>Passcode:</strong> ' + esc(String(m.zoomPasscode).replace(/\.$/, '')));
      if (m.zoomPhone) zoomBits.push('<strong>Phone:</strong> ' + esc(m.zoomPhone));
      var zoomline = zoomBits.length ? '<div class="zoomline">' + zoomBits.join(' &middot; ') + '</div>' : '';
      html += '<article class="m-card">' +
        '<div class="m-date"><div class="m">' + MON[d.getMonth()] + '</div><div class="d">' + d.getDate() + '</div>' + logo + '</div>' +
        '<div><span class="tag">' + esc(m.sourceLabel) + '</span>' + (m.time ? '<span class="src">' + esc(m.time) + '</span>' : '') +
        '<h3>' + esc(m.title) + '</h3>' +
        (m.summary ? '<p class="summ">' + emphasizeNames(m.summary) + '</p>' : '') +
        (m.location ? '<div class="meta" style="margin-bottom:6px">&#128205; ' + esc(m.location) + '</div>' : '') +
        zoomline + '<div class="acts" style="margin-top:10px">' + acts + '</div></div></article>';
    });
    list.innerHTML = html;
  }

  function renderEntityFilter() {
    var counts = {};
    meetings.forEach(function (m) { counts[m.source] = (counts[m.source] || 0) + 1; });
    var bar = document.getElementById('ent-filter');
    var all = { key: '', label: 'All Meetings', logo: 'uploads/lt-logo.png', count: meetings.length };
    var items = [all].concat(ENTITIES.map(function (e) {
      return { key: e.key, label: e.label, logo: e.logo, count: counts[e.key] || 0 };
    }));
    bar.innerHTML = items.map(function (e) {
      return '<div class="ent' + (e.key === srcFilter ? ' active' : '') + '" data-key="' + esc(e.key) + '" role="button" tabindex="0">' +
        '<div class="e-name">' + esc(e.label) + '</div>' +
        '<div class="e-count">' + e.count + '</div></div>';
    }).join('');
    function pick(el) {
      srcFilter = el.dataset.key || '';
      bar.querySelectorAll('.ent').forEach(function (x) { x.classList.toggle('active', x === el); });
      render();
    }
    bar.addEventListener('click', function (e) { var el = e.target.closest('.ent'); if (el) pick(el); });
    bar.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var el = e.target.closest('.ent'); if (el) { e.preventDefault(); pick(el); }
    });
  }

  LTData.load(['week-meetings']).then(function (data) {
    meetings = (data['week-meetings'] || []).filter(function (m) { return m.date >= LTData.todayMT(); });
    renderEntityFilter();
    render();
  }).catch(function (err) { LTData.showError(list, err); });
})();
</script>
</body>
</html>
