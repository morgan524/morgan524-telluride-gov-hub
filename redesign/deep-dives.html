<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Dives — Livable Telluride</title>
<meta name="description" content="Long-form, source-linked explainers on the projects and policies shaping Telluride and San Miguel County — timelines, original documents, and key votes.">
<!-- STAGING: remove noindex at cutover -->
<meta name="robots" content="noindex">
<link rel="stylesheet" href="lt.css?v=8">
<link rel="icon" href="uploads/lt-logo.png">
<style>
  .feat-wrap { max-width: var(--maxw); margin: 0 auto; padding: 34px var(--pad-x) 0; }
  .feat { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; align-items: center; }
  .feat .img-frame { aspect-ratio: 4/3; border-radius: 10px; box-shadow: var(--shadow-media); }
  .img-frame.contain { background: linear-gradient(150deg, #e7efe7, #f7f2e6); }
  .img-frame.contain img { object-fit: contain; padding: 10px; }
  .story:hover .img-frame.contain img { transform: none; }
  .feat h2 { font: 600 42px/1.08 var(--serif); letter-spacing: -.015em; margin: 12px 0 10px; }
  .feat h2 a { color: var(--forest); }
  .feat:hover h2 a { color: var(--rust); }
  .feat .dek { font: 400 16.5px/1.65 var(--sans); color: var(--body2); margin: 0 0 12px; }
  .all-wrap { max-width: var(--maxw); margin: 0 auto; padding: 44px var(--pad-x) 0; }
  .all-head { border-bottom: 2px solid var(--forest); padding-bottom: 12px; margin-bottom: 24px; }
  .dive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .dive-card .img-frame { aspect-ratio: 16/9; border-radius: 10px; margin-bottom: 12px; }
  .dive-card h3 { font: 600 26px/1.15 var(--serif); margin: 8px 0 6px; }
  .dive-card h3 a { color: var(--forest); }
  .dive-card .dek { font: 400 15px/1.6 var(--sans); color: var(--body2); margin: 0 0 8px; }
  @media (max-width: 900px) { .feat, .dive-grid { grid-template-columns: 1fr; } }
  .blog-wrap { max-width: var(--maxw); margin: 0 auto; padding: 52px var(--pad-x) 0; }
  .blog-head { border-bottom: 2px solid var(--forest); padding-bottom: 12px; margin-bottom: 24px; }
  .blog-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }
  .blog-card .img-frame { aspect-ratio: 16/9; border-radius: 10px; margin-bottom: 10px; background: linear-gradient(150deg, #e7efe7, #f7f2e6); }
  .blog-card h3 { font: 600 19px/1.25 var(--serif); margin: 6px 0 6px; }
  .blog-card h3 a { color: var(--forest); }
  .blog-card:hover h3 a { color: var(--rust); }
  .blog-card .dek { font: 400 14px/1.6 var(--sans); color: var(--body2); margin: 0 0 6px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 900px) { .blog-grid { grid-template-columns: 1fr; } }
  @media (min-width: 901px) and (max-width: 1100px) { .blog-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="lt-header"></div>

<header class="masthead">
  <img class="masthead-art" src="uploads/wilson-peak.png" alt="" aria-hidden="true">
  <div class="masthead-fade"></div>
  <div class="masthead-inner">
    <div class="crumb">Learn <span class="sep">&rsaquo;</span> Deep Dives</div>
    <h1>Deep Dives</h1>
    <p class="sub">Long-form, source-linked explainers on the projects and policies shaping the region &mdash; timelines, original documents, and key votes.</p>
  </div>
</header>

<div class="feat-wrap" id="feat-slot"></div>


<div class="all-wrap">
  <div class="all-head"><span class="eyebrow">The library</span><h2 class="section-h">All deep dives</h2></div>
  <div class="dive-grid" id="dive-grid"><p class="meta">Loading&hellip;</p></div>
</div>

<div class="blog-wrap">
  <div class="blog-head"><span class="eyebrow">From the newsletter</span><h2 class="section-h">The Livable Telluride blog</h2></div>
  <div class="blog-grid" id="blog-grid"><p class="meta">Loading&hellip;</p></div>
</div>

<div id="lt-footer"></div>
<script src="site.js?v=7"></script>
<script src="/js/lt-data.js?v=4"></script>
<script>
(function () {
  var grid = document.getElementById('dive-grid');
  if (!window.LTData) { grid.innerHTML = '<div class="lt-data-error">This section failed to load. Please refresh in a minute.</div>'; return; }
  // Per-topic presentation config (order = display order; first = featured).
  // Standalone dives (own pages, not LAND_USE_ISSUES-driven) are listed as extras.
  // contain:true = image carries baked-in text; never crop it.
  var TOPICS = [
    { key: 'carhenge', cat: 'Land Use', contain: true },
    { key: 'skigate',  cat: 'Governance' },
    { key: 'society',  cat: 'Land Use' },
    { key: 'code',     cat: 'Policy' },
    { key: 'wildfire', cat: 'Environment' },
    { key: 'diamond',  cat: 'Land Use' }
  ];
  var EXTRAS = [
    { label: 'The Gondola', cat: 'Transportation', href: 'deep-dive-gondola.html', img: '/images/blog/gondola-station.png',
      dek: 'The free gondola’s funding fight — SMART’s ballot measure, the cost-sharing IGA, and what happens when the money runs out.' },
    { label: 'VooDoo', cat: 'Housing Finance', href: '/deep-dive-voodoo.html', img: '/images/blog/voodoo-project.png',
      dek: 'A $20M debt stack on one housing project — the $23M balloon due in 2032, and the rent-vs-debt-service shortfall.' }
  ];
  function clip(s, n) {
    s = String(s || ''); if (s.length <= n) return s;
    return s.slice(0, n).replace(/\s+\S*$/, '') + '…';
  }
  function card(t, issue) {
    // Every card gets an image — box-canyon stock when a topic has none.
    var src = (issue && issue.heroImage) || t.img || '/img/box-canyon.jpg';
    // heroImage may be site-root-relative ('assets/…') — resolve absolutely
    // so cards work from the staged /redesign/ mount too (same as deep-dive.js).
    if (src && !/^https?:\/\//.test(src) && src.charAt(0) !== '/') src = '/' + src;
    var cls = 'img-frame' + (t.contain ? ' contain' : '');
    var img = '<a href="' + href(t) + '"><div class="' + cls + '"><img src="' + LTData.esc(src) + '" alt="" loading="lazy"></div></a>';
    var dek = (issue && issue.intro) ? issue.intro : (t.dek || '');
    var docs = issue && issue.docs ? issue.docs.length + ' source documents' : '';
    var tl = issue && issue.timeline ? issue.timeline.length + ' timeline entries' : '';
    return '<article class="dive-card story">' + img +
      '<div><span class="tag">' + LTData.esc(t.cat) + '</span>' +
      '<h3><a href="' + href(t) + '">' + LTData.esc(issue ? issue.label : t.label) + '</a></h3>' +
      '<p class="dek">' + LTData.esc(clip(dek, 220)) + '</p>' +
      '<div class="meta">' + LTData.esc([docs, tl].filter(Boolean).join(' · ')) + '</div></div></article>';
  }
  function href(t) { return t.href || ('deep-dive-' + t.key + '.html'); }

  LTData.load(['land-use-issues']).then(function (data) {
    var issues = data['land-use-issues'] || {};
    var feat = TOPICS[0]; var fi = issues[feat.key];
    if (fi) {
      document.getElementById('feat-slot').innerHTML =
        '<article class="feat story">' +
        '<div><span class="tag rust-tint">Featured dive</span> <span class="tag">' + LTData.esc(feat.cat) + '</span>' +
        '<h2><a href="' + href(feat) + '">' + LTData.esc(fi.label) + '</a></h2>' +
        '<p class="dek">' + LTData.esc(clip(fi.intro, 300)) + '</p>' +
        '<a class="btn btn-forest" href="' + href(feat) + '">Read the deep dive &rarr;</a></div>' +
        (fi.heroImage ? '<a href="' + href(feat) + '"><div class="img-frame' + (feat.contain ? ' contain' : '') + '"><img src="' + LTData.esc(fi.heroImage) + '" alt=""></div></a>' : '') +
        '</article>';
    }
    var cards = TOPICS.slice(1).map(function (t) { return card(t, issues[t.key]); })
      .concat(EXTRAS.map(function (t) { return card(t, null); }));
    grid.innerHTML = cards.join('');
  }).catch(function (err) { LTData.showError(grid, err); });

  // ── The Livable Telluride blog — every newsletter/post, newest first.
  // Loaded separately so a blog-data hiccup never blanks the dives library.
  var blogGrid = document.getElementById('blog-grid');
  LTData.loadOne('blog-posts').then(function (posts) {
    if (!Array.isArray(posts) || !posts.length) { blogGrid.innerHTML = '<p class="meta">No posts yet.</p>'; return; }
    var sorted = posts.slice().sort(function (a, b) { return new Date(b.date || 0) - new Date(a.date || 0); });
    blogGrid.innerHTML = sorted.map(function (p) {
      var link = p.href || p.url || '#';
      // Strip the zero-width preheader padding Mailchimp leaves in excerpts.
      var dek = String(p.excerpt || p.summary || '').replace(/[​-‍﻿͏­]/g, '').trim();
      var img = p.image || p.img || '';
      var imgHtml = '<a href="' + LTData.esc(link) + '" target="_blank" rel="noopener"><div class="img-frame">' +
        (img ? '<img src="' + LTData.esc(img) + '" alt="" loading="lazy">' : '') + '</div></a>';
      return '<article class="blog-card story">' + imgHtml +
        '<div><span class="tag">' + LTData.esc(p.category || 'Newsletter') + '</span>' +
        '<h3><a href="' + LTData.esc(link) + '" target="_blank" rel="noopener">' + LTData.esc(p.title || 'Untitled') + '</a></h3>' +
        (dek ? '<p class="dek">' + LTData.esc(clip(dek, 200)) + '</p>' : '') +
        '<div class="meta">' + LTData.esc(p.date || '') + '</div></div></article>';
    }).join('');
  }).catch(function (err) { LTData.showError(blogGrid, err); });
})();
</script>
</body>
</html>
