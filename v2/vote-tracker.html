<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telluride Town Council — Vote Tracker</title>
<style>
/* ─── Base ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-dark:#173d34;
  --green-mid:#1f6f54;
  --green-light:#2a9468;
  --green-pale:#e8f4f0;
  --green-border:#c2ddd6;
  --text-dark:#1a2420;
  --text-mid:#3d5249;
  --text-light:#6b8c82;
  --bg:#f5f9f7;
  --white:#ffffff;
  --red-dark:#9f3f36;
  --red-mid:#c0544a;
  --red-pale:#fdf0ef;
  --amber:#b45309;
  --amber-pale:#fef3c7;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-300:#d1d5db;
  --gray-500:#6b7280;
  --gray-700:#374151;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-dark);font-size:14px;line-height:1.5}

/* ─── Header ────────────────────────────────────────────────── */
.page-header{background:var(--green-dark);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:16px}
.page-header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.page-header .sub{font-size:12px;opacity:.7;margin-top:2px}
.back-link{color:#fff;text-decoration:none;opacity:.7;font-size:13px;margin-right:8px;white-space:nowrap}
.back-link:hover{opacity:1}

/* ─── Top bar / tab nav ─────────────────────────────────────── */
.topbar{background:var(--white);border-bottom:2px solid var(--green-border);display:flex;align-items:center;padding:0 24px;gap:4px}
.tab-btn{padding:14px 20px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text-light);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--green-dark);border-bottom-color:var(--green-dark)}
.tab-btn:hover:not(.active){color:var(--text-mid)}
.stats-bar{margin-left:auto;display:flex;gap:20px;align-items:center;padding:8px 0}
.stat{text-align:right}
.stat .val{font-size:18px;font-weight:700;color:var(--green-dark);display:block;line-height:1}
.stat .lbl{font-size:10px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}

/* ─── Layout ────────────────────────────────────────────────── */
.layout{display:flex;min-height:calc(100vh - 110px)}
.sidebar{width:280px;min-width:280px;background:var(--white);border-right:1px solid var(--green-border);padding:20px;overflow-y:auto}
.main{flex:1;padding:20px 24px;overflow-x:hidden}

/* ─── Sidebar controls ──────────────────────────────────────── */
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-light);margin-bottom:8px;display:block}
.search-box{width:100%;padding:8px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;outline:none;background:var(--gray-100);margin-bottom:16px}
.search-box:focus{border-color:var(--green-light);background:#fff;box-shadow:0 0 0 3px rgba(42,148,104,.12)}
.filter-group{margin-bottom:18px}
.filter-select{width:100%;padding:7px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;background:#fff;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--green-light)}

.member-filter{display:flex;flex-direction:column;gap:5px}
.member-chip{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;cursor:pointer;transition:background .1s;font-size:12px;color:var(--text-mid)}
.member-chip:hover{background:var(--gray-100)}
.member-chip input{accent-color:var(--green-dark);width:13px;height:13px;cursor:pointer}
.member-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.clear-btn{width:100%;padding:7px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;font-size:12px;color:var(--text-mid);cursor:pointer;margin-top:4px}
.clear-btn:hover{background:var(--gray-100)}

.result-count{font-size:12px;color:var(--text-light);margin-bottom:16px}

/* ─── Vote cards (Tracker tab) ──────────────────────────────── */
.meeting-group{margin-bottom:28px}
.meeting-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--green-border)}
.meeting-header h3{font-size:13px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.4px}
.meeting-header .min-link{font-size:11px;color:var(--green-light);text-decoration:none;margin-left:auto;white-space:nowrap}
.meeting-header .min-link:hover{text-decoration:underline}

.vote-card{background:var(--white);border:1px solid var(--green-border);border-radius:8px;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.vote-card:hover{box-shadow:0 2px 8px rgba(23,61,52,.1)}
.vote-card-top{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.vote-num{font-size:11px;color:var(--text-light);font-weight:600;flex-shrink:0;padding-top:1px}
.vote-info{flex:1;min-width:0}
.vote-title{font-size:14px;font-weight:600;color:var(--text-dark);line-height:1.3;margin-bottom:4px}
.vote-desc{font-size:12px;color:var(--text-mid);line-height:1.4}
.vote-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.outcome-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.outcome-badge.passed{background:var(--green-pale);color:var(--green-dark);border:1px solid var(--green-border)}
.outcome-badge.failed{background:var(--red-pale);color:var(--red-dark);border:1px solid #f5c6c2}
.tally{font-size:13px;font-weight:700;color:var(--text-mid)}

.vote-pills{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
.pill{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.2}
.pill .name{font-weight:400}
.pill.yes{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.pill.no{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.pill.recused{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.pill.absent{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200)}
.pill.vacant{background:#f3f4f6;color:#9ca3af;border:1px dashed #d1d5db}
.pill.notoncil{display:none} /* hide non-council members from pill view */

.vote-tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 10px}
.tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--green-pale);color:var(--green-dark);letter-spacing:.3px}

/* ─── Heatmap tab ───────────────────────────────────────────── */
.heatmap-wrap{overflow-x:auto;margin-bottom:32px}
.heatmap-title{font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--green-border)}
.heatmap-table{border-collapse:collapse;width:100%;min-width:700px;border-spacing:0}
.heatmap-table td{padding:5px 4px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.heatmap-table tr:hover td{background:rgba(23,61,52,.03)}
.hm-vote-title{font-size:12px;font-weight:600;color:var(--text-dark);display:block;line-height:1.3}
.hm-vote-meta{font-size:10px;color:var(--text-light);display:block;margin-top:1px}
.vote-col-th{text-align:left;min-width:200px;max-width:240px;padding:12px 10px;font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.4px;background:var(--white);border-bottom:2px solid var(--green-border);vertical-align:bottom}
.result-col-th{text-align:center;padding:12px 10px;font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.4px;background:var(--white);border-bottom:2px solid var(--green-border);vertical-align:bottom;white-space:nowrap}

/* Member name header */
.hm-member-header{background:var(--green-dark);color:#fff;font-size:13px;font-weight:800;text-align:center;padding:14px 10px 12px;vertical-align:bottom;line-height:1.3;white-space:normal;min-width:90px;max-width:120px}
.hm-member-header .mem-role{display:block;font-size:9px;font-weight:500;opacity:.6;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}

/* Stats summary row */
.hm-stats-cell{text-align:center;padding:16px 10px 14px;vertical-align:middle}
.hm-stats-cell .pct-num{font-size:30px;font-weight:900;display:block;line-height:1;color:#fff}
.hm-stats-cell .pct-frac{display:block;font-size:12px;font-weight:700;color:rgba(255,255,255,.9);margin-top:5px}
.hm-stats-cell .pct-maj{display:block;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.75);margin-top:3px}
.hm-stats-cell .pct-total{display:block;font-size:10px;color:rgba(255,255,255,.55);margin-top:3px}
.stats-label-cell{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;vertical-align:middle;background:var(--gray-100)}
.hm-pct-high{background:#25845a}
.hm-pct-mid-high{background:#3c7d5f}
.hm-pct-mid{background:#7a6a3a}
.hm-pct-low{background:#b5574a}

/* Vote cells */
.hm-cell{width:64px;height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin:0 auto;cursor:pointer;transition:transform .1s,opacity .1s;letter-spacing:.3px;text-transform:uppercase}.hm-cell:hover{opacity:.82;transform:scale(1.06)}
.hm-cell:hover{transform:scale(1.08)}
.hm-yes-str{background:#2f9c6c;color:#fff}
.hm-no-str{background:#b5574a;color:#fff}
.hm-rec{background:#c48a2e;color:#fff;font-size:9.5px}
.hm-abs{background:#9ca3af;color:#fff}
.hm-vac{background:#e5e7eb;color:#9ca3af;border:1px dashed #d1d5db;font-size:9px}
.hm-nc{background:transparent;color:#e5e7eb}
.hm-outcome.passed{color:var(--green-dark);font-weight:700;font-size:11px;white-space:nowrap}
.hm-outcome.failed{color:#b5574a;font-weight:700;font-size:11px;white-space:nowrap}

.hm-cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.hm-cat-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--green-border);background:var(--white);color:var(--text-mid);font-size:12px;font-weight:500;cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
.hm-cat-btn:hover{background:var(--green-pale);border-color:var(--green-light);color:var(--green-dark)}
.hm-cat-btn.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;font-weight:600}
/* ─── Heatmap view-toggle (Issue vs Category) ──────────────── */
.hm-view-toggle{display:flex;gap:8px;margin-bottom:14px}
.hm-view-btn{padding:6px 18px;border-radius:20px;border:1px solid var(--green-border);background:var(--white);color:var(--text-mid);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.hm-view-btn:hover{background:var(--green-pale);border-color:var(--green-light);color:var(--green-dark)}
.hm-view-btn.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;font-weight:700}

/* ─── Category-aggregation cells ────────────────────────────── */
.hm-cat-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:80px;min-height:72px;border-radius:6px;padding:6px 8px;font-weight:700;line-height:1.2}
.hm-cat-cell .cat-label{font-size:22px;letter-spacing:.5px}
.hm-cat-cell .cat-counts{font-size:26px;font-weight:800}
.hm-cat-cell.yes-dom{background:#2f9c6c;color:#fff}
.hm-cat-cell.no-dom{background:#b5574a;color:#fff}
.hm-cat-cell.tied{background:#c48a2e;color:#fff}
.hm-cat-cell.none{background:transparent;color:#e5e7eb}

.heatmap-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-mid)}
.leg-swatch{width:18px;height:18px;border-radius:3px}

/* ─── Empty state ───────────────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state p{font-size:14px}

/* ─── Responsive ────────────────────────────────────────────── */
@media(max-width:720px){
  .sidebar{display:none}
  .main{padding:14px 16px}
  .stats-bar{display:none}
}
</style>
</head>
<body>

<!-- ─── Page Header ─────────────────────────────────────────── -->
<header class="page-header">
  <a href="/v2/gov-hub.html" class="back-link">← Gov Hub</a>
  <div>
    <h1>Town Council — Vote Tracker</h1>
    <div class="sub">Telluride, Colorado · 2024–2026 · Data from official adopted minutes</div>
  </div>
</header>

<!-- ─── Tab bar + stats ─────────────────────────────────────── -->
<div class="topbar">
  <div class="stats-bar">
    <div class="stat"><span class="val" id="stat-votes">—</span><span class="lbl">Votes</span></div>
    <div class="stat"><span class="val" id="stat-split">—</span><span class="lbl">Split</span></div>
    <div class="stat"><span class="val" id="stat-failed">—</span><span class="lbl">Failed</span></div>
  </div>
</div>

<!-- ─── Main layout ─────────────────────────────────────────── -->
<div class="layout">

  <!-- Sidebar filters -->
  <aside class="sidebar">
    <div class="filter-group">
      <label class="filter-label">Entity</label>
      <select class="filter-select" id="filter-entity" onchange="switchEntity()">
        <option value="telluride">Town of Telluride</option>
        <option value="bocc">San Miguel BOCC</option>
        <option value="planning">San Miguel Planning Commission</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Year</label>
      <select class="filter-select" id="filter-year" onchange="renderHeatmap()">
        <option value="">All years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>
  </aside>

  <!-- Main content (two tabs) -->
  <main class="main">

    <!-- ── Heatmap ─────────────────────────────────────────────── -->
    <div id="view-heatmap">

      <!-- View toggle -->
      <div class="hm-view-toggle">
        <button class="hm-view-btn active" id="hm-btn-issue" onclick="setHmView('issue')">Votes by Issue</button>
        <button class="hm-view-btn" id="hm-btn-category" onclick="setHmView('category')">Votes by Category</button>
      </div>


      <div class="heatmap-legend">
        <div class="leg-item"><div class="leg-swatch hm-yes-str"></div> YES</div>
        <div class="leg-item"><div class="leg-swatch hm-no-str"></div> NO</div>
        <div class="leg-item"><div class="leg-swatch hm-rec"></div> Recused</div>
        <div class="leg-item"><div class="leg-swatch hm-abs"></div> Absent</div>
        <div class="leg-item"><div class="leg-swatch hm-vac" style="border:1px dashed #d1d5db;font-size:9px"></div> Vacant</div>
      </div>
      <div id="heatmap-content"></div>
    </div>

  </main>
</div>

/* ══════════════════════════════════════════════════════════════
   RENDER LOGIC
══════════════════════════════════════════════════════════════ */

let activeTab = 'heatmap';
let hmCatFilter = ''; // active category filter for heatmap (empty = all)
let hmViewMode = 'issue'; // 'issue' or 'category'

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('view-tracker').style.display = tab === 'tracker' ? '' : 'none';
  document.getElementById('view-heatmap').style.display  = tab === 'heatmap'  ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderHeatmap();
}

// ── populate category dropdown ──────────────────────────────
function populateFilters() {
  const cats = [...new Set(VOTE_ITEMS.flatMap(v => v.tags))].sort();
  const sel = document.getElementById('filter-cat');
  cats.forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('filter-year').value = '';
  document.getElementById('filter-cat').value = '';
  document.getElementById('filter-outcome').value = '';
  renderTracker();
}

// ── filter votes ────────────────────────────────────────────
function getFilteredVotes() {
  const q      = document.getElementById('search').value.toLowerCase().trim();
  const year   = document.getElementById('filter-year').value;
  const cat    = document.getElementById('filter-cat').value;
  const outcome = document.getElementById('filter-outcome').value;

  return VOTE_ITEMS.filter(v => {
    if (year && String(v.year) !== year) return false;
    if (cat && !v.tags.includes(cat)) return false;
    if (outcome && v.outcome !== outcome) return false;
    if (q) {
      const hay = (v.title + ' ' + v.description + ' ' + v.tags.join(' ') + ' ' + v.meeting).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── pill helper ──────────────────────────────────────────────
function voteClass(v) {
  switch(v) {
    case 'Yes':     return 'yes';
    case 'No':      return 'no';
    case 'Recused': return 'recused';
    case 'Absent':  return 'absent';
    case 'Vacant':  return 'vacant';
    default:        return 'notoncil';
  }
}
function voteLabel(v) {
  return { Yes:'✓', No:'✗', Recused:'⊘', Absent:'–', Vacant:'○' }[v] || '·';
}

// ── render tracker tab ──────────────────────────────────────
function renderTracker() {
  const filtered = getFilteredVotes();
  document.getElementById('result-count').textContent =
    `Showing ${filtered.length} of ${VOTE_ITEMS.length} votes`;

  // Update stats bar
  const split  = filtered.filter(v => v.tally && v.tally.includes('-') && v.tally !== '7-0' && v.tally !== '6-0' && v.tally !== '5-0' && v.tally !== '4-0').length;
  const failed = filtered.filter(v => v.outcome === 'Failed').length;
  document.getElementById('stat-votes').textContent  = filtered.length;
  document.getElementById('stat-split').textContent  = split;
  document.getElementById('stat-failed').textContent = filtered.filter(v => v.outcome === 'Failed').length;

  if (!filtered.length) {
    document.getElementById('tracker-content').innerHTML = `
      <div class="empty-state"><p>No votes match your filters.</p></div>`;
    return;
  }

  // Group by meeting
  const groups = {};
  filtered.forEach(v => {
    if (!groups[v.meeting]) groups[v.meeting] = [];
    groups[v.meeting].push(v);
  });

  // Sort meetings chronologically (most recent first)
  const sortedMeetings = Object.keys(groups).sort((a, b) => {
    const da = groups[a][0].date, db = groups[b][0].date;
    return db.localeCompare(da);
  });

  let html = '';
  sortedMeetings.forEach(meeting => {
    const votes = groups[meeting];
    const url = votes[0].minutesUrl;
    html += `<div class="meeting-group">
      <div class="meeting-header">
        <h3>${meeting}</h3>
        <a class="min-link" href="${url}" target="_blank" rel="noopener">📄 Adopted Minutes ↗</a>
      </div>`;
    votes.forEach((v, i) => {
      const pills = ALL_MEMBERS.map(m => {
        const mv = v.votes[m.id];
        if (!mv) return ''; // not on council
        const cls = voteClass(mv);
        return `<span class="pill ${cls}">${voteLabel(mv)} <span class="name">${m.shortName}</span></span>`;
      }).join('');
      const tags = v.tags.map(t => `<span class="tag">${t}</span>`).join('');
      html += `<div class="vote-card">
        <div class="vote-card-top">
          <span class="vote-num">#${String(i+1).padStart(2,'0')}</span>
          <div class="vote-info">
            <div class="vote-title">${v.title}</div>
            <div class="vote-desc">${v.description}</div>
          </div>
          <div class="vote-right">
            <span class="outcome-badge ${v.outcome.toLowerCase()}">${v.outcome.toUpperCase()}</span>
            <span class="tally">${v.tally}</span>
          </div>
        </div>
        <div class="vote-pills">${pills}</div>
        <div class="vote-tags">${tags}</div>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('tracker-content').innerHTML = html;
}


// ── render heatmap: Votes by Category view ─────────────────
function renderHeatmapByCategory() {
  const ent = (document.getElementById('filter-entity') || {value:'telluride'}).value;
  if (ent === 'bocc')     { renderBoccHeatmap();     return; }
  if (ent === 'planning') { renderPlanningHeatmap();  return; }

  const yearSel = document.getElementById('filter-year').value;

  const eras = yearSel === '2026'
    ? [{label:'2026 Council', members:COUNCIL_2026, yearFilter:2026}]
    : yearSel === '2025'
    ? [{label:'2025 Council (Nov–Dec transition)', members:COUNCIL_2025_LATE, yearFilter:2025, lateOnly:true},
       {label:'2025 Council (Jan–Oct)', members:COUNCIL_2025_EARLY, yearFilter:2025, earlyOnly:true}]
    : yearSel === '2024'
    ? [{label:'2024 Council', members:COUNCIL_2024, yearFilter:2024}]
    : [{label:'2026 Council', members:COUNCIL_2026, yearFilter:2026},
       {label:'2025 Council (Nov–Dec)', members:COUNCIL_2025_LATE, yearFilter:2025, lateOnly:true},
       {label:'2025 Council (Jan–Oct)', members:COUNCIL_2025_EARLY, yearFilter:2025, earlyOnly:true},
       {label:'2024 Council', members:COUNCIL_2024, yearFilter:2024}];

  // All unique categories across filtered votes
  const allCats = [...new Set(VOTE_ITEMS.flatMap(v => v.tags))].sort();

  let html = '';
  eras.forEach(era => {
    const eraVotes = VOTE_ITEMS.filter(v => {
      if (v.year !== era.yearFilter) return false;
      if (era.earlyOnly) return v.date < '2025-11-01';
      if (era.lateOnly)  return v.date >= '2025-11-01';
      return true;
    });
    if (!eraVotes.length) return;

    const mems = era.members.map(id => ALL_MEMBERS.find(m => m.id === id));

    // Build per-member, per-category yes/no counts
    // catStats[cat][memberId] = { yes, no }
    const catStats = {};
    allCats.forEach(cat => {
      catStats[cat] = {};
      mems.forEach(m => { catStats[cat][m.id] = { yes: 0, no: 0 }; });
    });

    eraVotes.forEach(v => {
      v.tags.forEach(cat => {
        if (!catStats[cat]) return;
        mems.forEach(m => {
          const mv = v.votes[m.id];
          if (mv === 'Yes') catStats[cat][m.id].yes++;
          else if (mv === 'No') catStats[cat][m.id].no++;
        });
      });
    });

    // Only show categories that have at least one vote in this era
    const activeCats = allCats.filter(cat =>
      mems.some(m => catStats[cat][m.id].yes + catStats[cat][m.id].no > 0)
    );
    if (!activeCats.length) return;

    html += `<div class="heatmap-wrap">
      <div class="heatmap-title">${era.label}</div>
      <table class="heatmap-table">
        <thead>
          <tr>
            <th class="vote-col-th">Category</th>
            ${mems.map(m => `<th class="hm-member-header">${m.name}<span class="mem-role">${m.title}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>`;

    activeCats.forEach(cat => {
      html += `<tr>
        <td><span class="hm-vote-title" style="font-size:24px;font-weight:700">${cat}</span></td>`;
      mems.forEach(m => {
        const s = catStats[cat][m.id];
        const total = s.yes + s.no;
        if (!total) {
          html += `<td><div class="hm-cat-cell none"></div></td>`;
        } else if (s.yes > s.no) {
          html += `<td><div class="hm-cat-cell yes-dom">
            <span class="cat-label">YES</span>
            <span class="cat-counts">${s.yes}/${s.no}</span>
          </div></td>`;
        } else if (s.no > s.yes) {
          html += `<td><div class="hm-cat-cell no-dom">
            <span class="cat-label">NO</span>
            <span class="cat-counts">${s.no}/${s.yes}</span>
          </div></td>`;
        } else {
          html += `<td><div class="hm-cat-cell tied">
            <span class="cat-label">TIED</span>
            <span class="cat-counts">${s.yes}/${s.no}</span>
          </div></td>`;
        }
      });
      html += `</tr>`;
    });

    html += `</tbody></table></div>`;
  });

  if (!html) html = `<div class="empty-state"><p>No votes found.</p></div>`;
  document.getElementById('heatmap-content').innerHTML = html;
}

// ── build heatmap category chip bar ────────────────────────
function buildHmCatBar() {
  const cats = [...new Set(VOTE_ITEMS.flatMap(v => v.tags))].sort();
  const bar = document.getElementById('hm-cat-bar');
  if (!bar) return;
  if (hmViewMode === 'category') { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const allBtn = `<button class="hm-cat-btn${hmCatFilter===''?' active':''}" onclick="setHmCat('')">All categories</button>`;
  const chips = cats.map(c =>
    `<button class="hm-cat-btn${hmCatFilter===c?' active':''}" onclick="setHmCat('${c}')">${c}</button>`
  ).join('');
  bar.innerHTML = allBtn + chips;
}

function setHmCat(cat) {
  hmCatFilter = cat;
  buildHmCatBar();
  renderHeatmap();
}

function setHmView(mode) {
  hmViewMode = mode;
  // Toggle button active states
  document.getElementById('hm-btn-issue').classList.toggle('active', mode === 'issue');
  document.getElementById('hm-btn-category').classList.toggle('active', mode === 'category');
  renderHeatmap();
}

   ENTITY SWITCHING
══════════════════════════════════════════════════════════════ */
function switchEntity() {
  const ent = document.getElementById('filter-entity').value;
  const yearSel = document.getElementById('filter-year');
  yearSel.innerHTML = '';

  let years = [];
  if (ent === 'telluride') {
    years = [['', 'All years'], ['2026','2026'], ['2025','2025'], ['2024','2024']];
  } else if (ent === 'bocc') {
    years = [['', 'All years'], ['2026','2026'], ['2025','2025'], ['2024','2024']];
  } else if (ent === 'planning') {
    years = [['', 'All years'], ['2026','2026'], ['2025','2025'], ['2024','2024']];
  } else {
    years = [['', 'All years'], ['2024','2024']];
  }
  years.forEach(([val, label]) => {
    const o = document.createElement('option');
    o.value = val; o.textContent = label;
    yearSel.appendChild(o);
  });
  yearSel.selectedIndex = 0; // always reset to "All years" when switching entity
  hmCatFilter = '';
  renderHeatmap();
}

/* ══════════════════════════════════════════════════════════════
   BOCC HEATMAP
══════════════════════════════════════════════════════════════ */
function renderBoccHeatmap() {
  const yearSel = document.getElementById('filter-year').value;
  const catSel  = hmCatFilter;

  const eras = yearSel === '2026'
    ? [{ label:'2026 San Miguel BOCC', members:BOCC_2025, yearFilter:2026 }]
    : yearSel === '2025'
    ? [{ label:'2025 San Miguel BOCC', members:BOCC_2025, yearFilter:2025 }]
    : yearSel === '2024'
    ? [{ label:'2024 San Miguel BOCC', members:BOCC_2024, yearFilter:2024 }]
    : [{ label:'2026 San Miguel BOCC', members:BOCC_2025, yearFilter:2026 },
       { label:'2025 San Miguel BOCC', members:BOCC_2025, yearFilter:2025 },
       { label:'2024 San Miguel BOCC', members:BOCC_2024, yearFilter:2024 }];

  let html = '';
  eras.forEach(era => {
    let eraVotes = BOCC_VOTE_ITEMS.filter(v => {
      if (v.year !== era.yearFilter) return false;
      if (catSel && !v.tags.includes(catSel)) return false;
      return true;
    }).sort((a,b) => b.date.localeCompare(a.date));

    if (!eraVotes.length) return;

    const mems = era.members.map(id => BOCC_ALL_MEMBERS.find(m => m.id === id)).filter(Boolean);

    const stats = {};
    mems.forEach(m => {
      let yes = 0, no = 0, total = 0, withMaj = 0;
      eraVotes.forEach(v => {
        const mv = v.votes[m.id];
        if (mv === 'Yes' || mv === 'No') {
          total++;
          if (mv === 'Yes') yes++; else no++;
          const onWinningSide = (v.outcome === 'Passed' && mv === 'Yes') ||
                                (v.outcome === 'Failed'  && mv === 'No');
          if (onWinningSide) withMaj++;
        }
      });
      stats[m.id] = { yes, no, total, withMaj };
    });

    function pctClass(pct) {
      return pct >= 80 ? 'hm-pct-high' :
             pct >= 60 ? 'hm-pct-mid-high' :
             pct >= 40 ? 'hm-pct-mid' : 'hm-pct-low';
    }

    html += `<div class="heatmap-wrap">
      <div class="heatmap-title">${era.label}</div>
      <table class="heatmap-table">
        <thead>
          <tr>
            <th class="vote-col-th">Vote</th>
            ${mems.map(m => `<th class="hm-member-header">${m.name}<span class="mem-role">${m.title}</span></th>`).join('')}
            <th class="result-col-th">Result</th>
          </tr>
          <tr>
            <td class="stats-label-cell">Summary</td>
            ${mems.map(m => {
              const s = stats[m.id];
              const pct    = s.total ? Math.round(s.yes / s.total * 100) : 0;
              const majPct = s.total ? Math.round(s.withMaj / s.total * 100) : 0;
              return `<td class="hm-stats-cell ${pctClass(pct)}">
                <span class="pct-num">${pct}%</span>
                <span class="pct-frac">${s.yes}/${s.total} Yes</span>
                <span class="pct-maj">${majPct}% w/ majority</span>
                <span class="pct-total">${s.total} votes cast</span>
              </td>`;
            }).join('')}
            <td style="background:var(--gray-100)"></td>
          </tr>
        </thead>
        <tbody>`;

    eraVotes.forEach(v => {
      const dateStr = v.date.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_,y,mo,d) =>
        `${['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo]} ${+d}`);
      html += `<tr>
        <td>
          <a href="${v.minutesUrl}" target="_blank" style="text-decoration:none">
            <span class="hm-vote-title">${v.title}</span>
          </a>
          <span class="hm-vote-meta">${dateStr} · ${v.tags[0]}</span>
        </td>`;
      mems.forEach(m => {
        const mv = v.votes[m.id];
        let cls = 'hm-nc', lbl = '';
        if      (mv === 'Yes')     { cls = 'hm-yes-str'; lbl = 'YES'; }
        else if (mv === 'No')      { cls = 'hm-no-str';  lbl = 'NO'; }
        else if (mv === 'Recused') { cls = 'hm-rec';     lbl = 'Recused'; }
        else if (mv === 'Absent')  { cls = 'hm-abs';     lbl = 'Absent'; }
        else if (mv === 'Vacant')  { cls = 'hm-vac';     lbl = 'Vacant'; }
        const cellLink = v.minutesUrl ? `<a href="${v.minutesUrl}" target="_blank" rel="noopener" style="text-decoration:none;display:block">` : '';
        const cellLinkEnd = v.minutesUrl ? '</a>' : '';
        html += `<td>${cellLink}<div class="hm-cell ${cls}" title="${m.name}: ${mv||'Not on BOCC'}. Click to view minutes.">${lbl}</div>${cellLinkEnd}</td>`;
      });
      html += `<td class="hm-outcome ${v.outcome.toLowerCase()}" style="padding:5px 8px;white-space:nowrap">${v.outcome} ${v.tally}</td>`;
      html += `</tr>`;
    });

    html += `</tbody></table></div>`;
  });

  if (!html) html = `<div class="empty-state"><p>No BOCC votes for the selected filters.<br>More meetings being added — <a href="https://sanmiguelcoco.portal.civicclerk.com/search?q=&filters=Minutes&category_id=26" target="_blank">view all BOCC minutes</a>.</p></div>`;
  document.getElementById('heatmap-content').innerHTML = html;
}

              const s = stats[m.id];
              const pct    = s.total ? Math.round(s.yes / s.total * 100) : 0;
              const majPct = s.total ? Math.round(s.withMaj / s.total * 100) : 0;
              return `<td class="hm-stats-cell ${pctClass(pct)}">
                <span class="pct-num">${pct}%</span>
                <span class="pct-frac">${s.yes}/${s.total} Yes</span>
                <span class="pct-maj">${majPct}% w/ majority</span>
                <span class="pct-total">${s.total} votes cast</span>
              </td>`;
            }).join('')}
            <td style="background:var(--gray-100)"></td>
          </tr>
        </thead>
        <tbody>`;

    eraVotes.forEach(v => {
      const dateStr = v.date.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_, y,mo,d) =>
        `${['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo]} ${+d}`);
      html += `<tr>
        <td>
          <a href="${v.minutesUrl}" target="_blank" style="text-decoration:none">
            <span class="hm-vote-title">${v.title}</span>
          </a>
          <span class="hm-vote-meta">${dateStr} · ${v.tags[0]}</span>
        </td>`;
      mems.forEach(m => {
        const mv = v.votes[m.id];
        let cls = 'hm-nc', lbl = '';
        if      (mv === 'Yes')     { cls = 'hm-yes-str'; lbl = 'YES'; }
        else if (mv === 'No')      { cls = 'hm-no-str';  lbl = 'NO'; }
        else if (mv === 'Recused') { cls = 'hm-rec';     lbl = 'Recused'; }
        else if (mv === 'Absent')  { cls = 'hm-abs';     lbl = 'Absent'; }
        else if (mv === 'Vacant')  { cls = 'hm-vac';     lbl = 'Vacant'; }
        const cellLink = v.minutesUrl ? `<a href="${v.minutesUrl}" target="_blank" rel="noopener" style="text-decoration:none;display:block">` : '';
        const cellLinkEnd = v.minutesUrl ? '</a>' : '';
        html += `<td>${cellLink}<div class="hm-cell ${cls}" title="${m.name}: ${mv||'Not on Council'}. Click to view minutes.">${lbl}</div>${cellLinkEnd}</td>`;
      });
      html += `<td class="hm-outcome ${v.outcome.toLowerCase()}" style="padding:5px 8px;white-space:nowrap">${v.outcome} ${v.tally}</td>`;
      html += `</tr>`;
    });

    html += `</tbody></table></div>`;
  });

  if (!html) html = `<div class="empty-state"><p>No votes for the selected filters.</p></div>`;
  document.getElementById('heatmap-content').innerHTML = html;
}

renderHeatmap();
